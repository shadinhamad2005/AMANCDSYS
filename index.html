<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD & AMAN Tracker (Multi-Project)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a202c;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #2d3748;
        }

        /* Adjusted color filter for calendar picker in dark mode for better visibility */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .action-btn.animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .5;
            }
        }

        /* Login Screen Styles */
        #login-screen {
            position: fixed;
            inset: 0;
            background: #111827;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            display: none;
            height: 100vh;
            width: 100%;
        }

        /* Style for date inputs to keep calendar picker visible */
        input[type="date"] {
            color-scheme: dark;
        }

        /* Smooth fade up for modals/toasts */
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased overflow-hidden">

    <div id="login-screen">
        <div class="w-full max-w-md p-8 bg-gray-800 rounded-2xl shadow-2xl border border-gray-700">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white tracking-wider">SYSTEM LOGIN</h1>
                <p class="text-teal-500 text-sm mt-2">CD & Aman Tracker</p>
            </div>
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Email</label>
                    <input type="email" id="login-email"
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-teal-500 outline-none"
                        placeholder="admin@tracker.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                    <input type="password" id="login-password"
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-teal-500 outline-none"
                        placeholder="••••••••" required>
                </div>
                <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
                <button type="submit"
                    class="w-full py-3 px-4 bg-teal-600 hover:bg-teal-500 rounded-lg text-white font-bold transition-colors shadow-lg">
                    Access Dashboard
                </button>
            </form>
        </div>
    </div>

    <div id="app-container" class="flex">
        <aside class="w-64 bg-gray-800/30 p-6 border-r border-gray-700/50 flex-shrink-0 flex flex-col">
            <div class="text-center mb-8">
                <h1 class="text-xl font-bold text-white tracking-wider">CD & AMAN</h1>
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <p id="user-display" class="text-xs text-gray-400 truncate max-w-[150px]">User</p>
                </div>
            </div>

            <!-- PROJECT DROPDOWN -->
            <div class="mb-8">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Active Project</label>
                <select id="project-select"
                    class="w-full bg-gray-900 border border-gray-600 text-white text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block p-2.5">
                    <option value="Main Project">Main Project</option>
                    <!-- Additional projects will be loaded here -->
                </select>
            </div>

            <nav id="navigation" class="space-y-4 flex-1">
                <button data-page="Civil Defence"
                    class="nav-link flex items-center w-full px-4 py-3 text-sm font-medium rounded-lg transition-all duration-200 bg-teal-600/90 text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6 mr-4">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <span class="flex-1 text-left">Civil Defence</span>
                </button>
                <button data-page="Aman Certificate"
                    class="nav-link flex items-center w-full px-4 py-3 text-sm font-medium rounded-lg transition-all duration-200 text-gray-300 hover:bg-gray-700/50 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6 mr-4">
                        <rect width="16" height="20" x="4" y="2" rx="2"></rect>
                        <path d="M9 22v-4h6v4"></path>
                        <path d="M8 6h.01"></path>
                        <path d="M16 6h.01"></path>
                        <path d="M12 6h.01"></path>
                        <path d="M12 10h.01"></path>
                        <path d="M12 14h.01"></path>
                        <path d="M16 10h.01"></path>
                        <path d="M16 14h.01"></path>
                        <path d="M8 10h.01"></path>
                        <path d="M8 14h.01"></path>
                    </svg>
                    <span class="flex-1 text-left">Aman Certificate</span>
                </button>
            </nav>
            <button id="logout-btn"
                class="flex items-center justify-center w-full px-4 py-2 text-sm font-medium text-red-400 hover:bg-red-900/30 rounded-lg transition-colors border border-red-900/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" x2="9" y1="12" y2="12"></line>
                </svg>
                Sign Out
            </button>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto h-full">

            <!-- Notification Bell and Dropdown -->
            <div class="absolute top-0 right-0 m-6 z-30">
                <div class="relative">
                    <button id="notification-btn"
                        class="p-2 rounded-full text-gray-300 hover:text-white hover:bg-gray-800 transition-colors relative">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="w-6 h-6">
                            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                            <path d="M10.375 22a2 2 0 1 0 3.25 0"></path>
                        </svg>
                        <span id="notification-count"
                            class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-red-100 transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full hidden">0</span>
                    </button>
                    <div id="notification-dropdown"
                        class="absolute right-0 mt-2 w-80 rounded-md shadow-lg bg-gray-800 ring-1 ring-black ring-opacity-5 focus:outline-none hidden max-h-96 overflow-y-auto">
                        <div class="py-1" id="notification-list">
                            <!-- Notifications will be rendered here -->
                        </div>
                    </div>
                </div>
            </div>

            <div id="page-Civil Defence" class="page active"></div>
            <div id="page-Aman Certificate" class="page"></div>
        </main>
    </div>

    <div id="modal-container"
        class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/60 backdrop-blur-sm"></div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
