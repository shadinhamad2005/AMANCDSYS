<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD & AMAN Tracker (Multi-Project)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>window.jsPDF = window.jspdf.jsPDF;</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a202c;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #2d3748;
        }

        /* Adjusted color filter for calendar picker in dark mode for better visibility */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .action-btn.animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .5;
            }
        }

        /* Login Screen Styles */
        #login-screen {
            position: fixed;
            inset: 0;
            background: #111827;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            display: none;
            height: 100vh;
            width: 100%;
        }

        /* Style for date inputs to keep calendar picker visible */
        input[type="date"] {
            color-scheme: dark;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased overflow-hidden">

    <div id="login-screen">
        <div class="w-full max-w-md p-8 bg-gray-800 rounded-2xl shadow-2xl border border-gray-700">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white tracking-wider">SYSTEM LOGIN</h1>
                <p class="text-teal-500 text-sm mt-2">CD & Aman Tracker</p>
            </div>
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Email</label>
                    <input type="email" id="login-email"
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-teal-500 outline-none"
                        placeholder="admin@tracker.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                    <input type="password" id="login-password"
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-teal-500 outline-none"
                        placeholder="••••••••" required>
                </div>
                <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
                <button type="submit"
                    class="w-full py-3 px-4 bg-teal-600 hover:bg-teal-500 rounded-lg text-white font-bold transition-colors shadow-lg">
                    Access Dashboard
                </button>
            </form>
        </div>
    </div>

    <div id="app-container" class="flex">
        <aside class="w-64 bg-gray-800/30 p-6 border-r border-gray-700/50 flex-shrink-0 flex flex-col">
            <div class="text-center mb-8">
                <h1 class="text-xl font-bold text-white tracking-wider">CD & AMAN</h1>
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <p id="user-display" class="text-xs text-gray-400 truncate max-w-[150px]">User</p>
                </div>
            </div>

            <!-- PROJECT DROPDOWN -->
            <div class="mb-8">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Active Project</label>
                <select id="project-select"
                    class="w-full bg-gray-900 border border-gray-600 text-white text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block p-2.5">
                    <option value="Main Project">Main Project</option>
                </select>
            </div>

            <nav id="navigation" class="space-y-4 flex-1">
                <button data-page="Properties"
                    class="nav-link flex items-center w-full px-4 py-3 text-sm font-medium rounded-lg transition-all duration-200 bg-teal-600/90 text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6 mr-4">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="flex-1 text-left">All Properties</span>
                </button>
            </nav>

            <div class="px-4 mb-4 mt-auto space-y-2">
                <button id="link-onedrive-btn"
                    class="flex items-center w-full px-4 py-2 text-sm font-medium rounded-lg transition-colors border border-blue-500/50 text-blue-400 hover:bg-blue-900/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span id="onedrive-status-text">Link OneDrive</span>
                </button>

                <button id="settings-btn"
                    class="flex items-center w-full px-4 py-2 text-sm font-medium rounded-lg transition-colors border border-gray-600 text-gray-300 hover:bg-gray-800 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
                        </path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span>Settings</span>
                </button>
            </div>

            <button id="logout-btn"
                class="flex items-center justify-center w-full px-4 py-2 text-sm font-medium text-red-400 hover:bg-red-900/30 rounded-lg transition-colors border border-red-900/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" x2="9" y1="12" y2="12"></line>
                </svg>
                Sign Out
            </button>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto h-full">

            <div id="page-Properties" class="page active"></div>
        </main>
    </div>

    <div id="modal-container"
        class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/60 backdrop-blur-sm"></div>

    <script type="module">
        // --------------------------------------------------------------
        // 1. FIREBASE IMPORTS & CONFIGURATION
        // --------------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { get, set as setIdb } from 'https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm';

        // Firebase Realtime Database Configuration (Original content preserved)
        // NOTE: This uses Firebase Realtime Database and not Firestore as per the original code.
        const firebaseConfig = {
            apiKey: "AIzaSyAnsZJnWu5PvC5UDyGL7q2zO9HjePDt5wk",
            authDomain: "amancdsys.firebaseapp.com",
            projectId: "amancdsys",
            storageBucket: "amancdsys.firebasestorage.app",
            messagingSenderId: "335675080686",
            appId: "1:335675080686:web:f38787505d1873c3cf58ff",
            measurementId: "G-F4D55C3MFK"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // --------------------------------------------------------------
        // 2.5 ONEDRIVE FILE SYSTEM API
        // --------------------------------------------------------------
        let oneDriveFolderHandle = null;

        async function initOneDrive() {
            try {
                const handle = await get('oneDriveHandle');
                if (handle) {
                    const options = { mode: 'readwrite' };
                    if ((await handle.queryPermission(options)) === 'granted') {
                        oneDriveFolderHandle = handle;
                        document.getElementById('onedrive-status-text').textContent = 'OneDrive Linked';
                        document.getElementById('link-onedrive-btn').classList.replace('text-blue-400', 'text-green-400');
                        document.getElementById('link-onedrive-btn').classList.replace('border-blue-500/50', 'border-green-500/50');
                    } else {
                        document.getElementById('onedrive-status-text').textContent = 'Grant Folder Access';
                    }
                }
            } catch (e) {
                console.error("Init OneDrive error", e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('link-onedrive-btn').addEventListener('click', async () => {
                try {
                    let handle = await get('oneDriveHandle');
                    if (handle && (await handle.queryPermission({ mode: 'readwrite' })) === 'prompt') {
                        const perm = await handle.requestPermission({ mode: 'readwrite' });
                        if (perm === 'granted') {
                            oneDriveFolderHandle = handle;
                            document.getElementById('onedrive-status-text').textContent = 'OneDrive Linked';
                            document.getElementById('link-onedrive-btn').classList.replace('text-blue-400', 'text-green-400');
                            document.getElementById('link-onedrive-btn').classList.replace('border-blue-500/50', 'border-green-500/50');
                            return;
                        }
                    }

                    handle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    await setIdb('oneDriveHandle', handle);
                    oneDriveFolderHandle = handle;
                    document.getElementById('onedrive-status-text').textContent = 'OneDrive Linked';
                    document.getElementById('link-onedrive-btn').classList.replace('text-blue-400', 'text-green-400');
                    document.getElementById('link-onedrive-btn').classList.replace('border-blue-500/50', 'border-green-500/50');
                } catch (e) {
                    console.error("Folder picker error", e);
                }
            });
        });

        window.openLocalFile = async (fileName) => {
            if (!oneDriveFolderHandle) {
                showModal("Access Required", "<p class='text-red-400'>Please click 'Link OneDrive' or 'Grant Folder Access' in the sidebar first.</p>");
                return;
            }
            try {
                if ((await oneDriveFolderHandle.queryPermission({ mode: 'read' })) !== 'granted') {
                    await oneDriveFolderHandle.requestPermission({ mode: 'read' });
                }
                const fileHandle = await oneDriveFolderHandle.getFileHandle(fileName);
                const file = await fileHandle.getFile();
                const url = URL.createObjectURL(file);
                window.open(url, '_blank');
            } catch (err) {
                console.error(err);
                showModal("File Not Found", `<p class='text-red-400'>Could not open the file. It may have been moved or deleted from your OneDrive folder. Error: ${err.message}</p>`);
            }
        };

        // --------------------------------------------------------------
        // 2. AUTHENTICATION LOGIC
        // --------------------------------------------------------------
        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const userDisplay = document.getElementById('user-display');
        const logoutBtn = document.getElementById('logout-btn');

        // Monitor Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Logged in as:", user.email);
                userDisplay.textContent = user.email;
                loginScreen.style.display = 'none';
                appContainer.style.display = 'flex';
                listenToFirebase();
            } else {
                console.log("User signed out");
                loginScreen.style.display = 'flex';
                appContainer.style.display = 'none';
            }
        });

        // Handle Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            loginError.classList.add('hidden');

            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    loginError.textContent = "Invalid Email or Password.";
                    loginError.classList.remove('hidden');
                });
        });

        // Handle Logout
        logoutBtn.addEventListener('click', () => {
            // Replaced confirm() with an internal message/check for consistency
            showModal("Confirm Sign Out", "<p class='text-gray-300'>Are you sure you want to sign out?</p><div class='flex justify-end gap-4 mt-6'><button id='confirm-logout' class='px-6 py-2 rounded-lg bg-red-600 text-white hover:bg-red-500 transition-colors font-semibold'>Sign Out</button><button id='cancel-logout' class='px-6 py-2 rounded-lg bg-gray-600 text-white hover:bg-gray-500 transition-colors font-semibold'>Cancel</button></div>", () => {
                document.getElementById('confirm-logout').addEventListener('click', () => {
                    signOut(auth).then(() => {
                        window.location.reload();
                    }).catch((error) => {
                        console.error("Error signing out:", error);
                        // Using internal modal instead of alert
                        showModal("Error Signing Out", "<p class='text-red-400'>There was an error signing out. Please try again.</p>");
                    });
                    hideModal();
                });
                document.getElementById('cancel-logout').addEventListener('click', hideModal);
            });
        });


        // --------------------------------------------------------------
        // 3. APP STATE & LOGIC
        // --------------------------------------------------------------
        let cdCerts = [];
        let amanCerts = [];
        let deletedCerts = []; // For soft deletes (Recycle Bin)
        let historyData = {}; // For CD/Aman certificate old expiry/link history
        let projectsList = new Set(['Main Project']);
        let currentProject = 'Main Project';

        // ** STEP 1: DEFINE THE AUTHORIZED ADMIN UID **
        // NOTE: Replace 'YOUR_ADMIN_FIREBASE_UID_HERE' with the actual UID of the user who should have edit access.
        // If left as a placeholder, no one will have edit access.
        const ADMIN_UID = '2xs0IlmRDDYwbekOuXsv2ThWBCl1';

        // Helper function to check if the current user is authorized
        const ADMIN_EMAILS = ['admin@amancdsys.net'];
        const isAuthorizedEditor = () => {
            if (!auth.currentUser) return false;
            return ADMIN_EMAILS.includes(auth.currentUser.email);
        };

        let currentPage = 'Properties';
        let currentFilters = {
            'Properties': { validity: 'All', phase: 'All', workflow: 'All', search: '' }
        };

        function getUnifiedProperties() {
            const propertyMap = new Map();
            const getProp = (propNo, phase, project, type) => {
                const key = `${String(propNo).trim().toLowerCase()}-${project}`;
                if (!propertyMap.has(key)) {
                    propertyMap.set(key, {
                        propertyNumber: propNo,
                        phase: phase,
                        project: project,
                        propertyType: type,
                        cd: null,
                        aman: null
                    });
                }
                return propertyMap.get(key);
            };

            cdCerts.forEach(c => {
                const p = getProp(c.propertyNumber, c.phase, c.project, c.propertyType);
                p.cd = c;
            });
            amanCerts.forEach(c => {
                const p = getProp(c.propertyNumber, c.phase, c.project, c.propertyType);
                p.aman = c;
            });

            return Array.from(propertyMap.values());
        }

        const CD_WORKFLOW_STEPS = ['AMC Contract Pending', 'AMC Contract Applied', 'AMC Contract Issued', 'CD Application Submitted', 'Inspection Scheduled', 'Inspection Failed', 'Certificate Ready'];

        // Migration map: old step names → new step names
        const CD_STEP_MIGRATION = {
            'AMC ready':          'AMC Contract Issued',
            'Renewal Pending':    'AMC Contract Pending',
            'Informed Fire team': 'AMC Contract Applied',
            'Awaiting inspection':'CD Application Submitted',
            'Inspection Date':    'Inspection Scheduled',
            'Certificate ready':  'Certificate Ready',
        };

        const AMAN_WORKFLOW_STEPS = ['Application Submitted', 'Unhealthy FACP Panel', 'Cert Issued (Pending Install)', 'Inspection & Installation', 'Installation Failed', 'Renewal Pending', 'Renewal Faults Pending', 'Active & Monitored'];

        const AMAN_STEP_MIGRATION = {
            'Pending Renewal':          'Renewal Pending',
            'Application Done':         'Application Submitted',
            'Installation in Progress': 'Inspection & Installation',
            'Installation Done':        'Active & Monitored',
            'Certificate ready':        'Active & Monitored',
            'Payment Completed':          'Cert Issued (Pending Install)',
            'Maintenance / Installation': 'Inspection & Installation',
            'Testing & Commissioning':    'Active & Monitored',
            'Certificate Ready':          'Active & Monitored'
        };

        function migrateOldWorkflowSteps(cdData, amanData) {
            cdData.forEach(cert => {
                if (CD_STEP_MIGRATION[cert.workflowStatus]) {
                    cert.workflowStatus = CD_STEP_MIGRATION[cert.workflowStatus];
                }
                // Remove legacy amcOnly flag cleanly
                if (cert.amcOnly) {
                    cert.amcOnly = false;
                    // If it was AMC-only with no expiry, set it to AMC Contract Pending
                    if (!cert.expiryDate) {
                        cert.workflowStatus = 'AMC Contract Pending';
                    }
                }
            });

            amanData.forEach(cert => {
                if (AMAN_STEP_MIGRATION[cert.workflowStatus]) {
                    cert.workflowStatus = AMAN_STEP_MIGRATION[cert.workflowStatus];
                }
            });
        }

        // --------------------------------------------------------------
        // 4. DATABASE FUNCTIONS
        // --------------------------------------------------------------

        const saveDataToFirebase = () => {
            if (!auth.currentUser) return; // Don't save if not logged in
            // Prevent schema validation errors by storing deletedCerts inside historyData
            historyData['__deleted_certs__'] = deletedCerts;
            
            set(ref(db, 'appData'), {
                cdCerts: cdCerts,
                amanCerts: amanCerts,
                historyData: historyData
            }).catch((error) => {
                // Replaced alert
                showModal("Error Saving Data", `<p class='text-red-400'>Error saving to cloud: ${error.message}</p>`);
            });
        };

        const listenToFirebase = () => {
            if (!auth.currentUser) return;
            const dataRef = ref(db, 'appData');
            onValue(dataRef, (snapshot) => {
                const data = snapshot.val();

                if (data) {
                    cdCerts = data.cdCerts || [];
                    // Ensure renewalHistory is initialized for Aman Cets
                    amanCerts = (data.amanCerts || []).map(c => ({
                        ...c,
                        renewalHistory: c.renewalHistory || [] // Initialize or keep array
                    }));
                    
                    // Migrate old CD and Aman workflow step names to new ones
                    migrateOldWorkflowSteps(cdCerts, amanCerts);
                    
                    historyData = data.historyData || {};
                    deletedCerts = historyData['__deleted_certs__'] || data.deletedCerts || [];

                    // Update Projects List
                    projectsList = new Set(['Main Project']);
                    [...cdCerts, ...amanCerts].forEach(item => {
                        if (item.project) projectsList.add(item.project);
                    });
                    updateProjectDropdown();
                } else {
                    cdCerts = [];
                    amanCerts = [];
                    deletedCerts = [];
                    historyData = {};
                    updateProjectDropdown();
                }
                // Only re-render the main page if no modal is currently open.
                // When a modal (workflow manager, hub, etc.) is visible, we update
                // the in-memory data silently to avoid a disruptive page flash.
                const isModalOpen = !document.getElementById('modal-container').classList.contains('hidden');
                if (!isModalOpen) {
                    render();
                    updateNotifications();
                    setTimeout(() => { if(window.showExpiryNotificationBanner) showExpiryNotificationBanner(); }, 500);
                }
            }, (error) => {
                console.error("Error loading data:", error);
                if (error.code === 'PERMISSION_DENIED') {
                    showModal("Access Denied", "<p class='text-red-400'>Access Denied. Please ensure you are logged in correctly.</p>");
                }
            });
        };

        // --------------------------------------------------------------
        // 5. PROJECT LOGIC
        // --------------------------------------------------------------
        const projectSelect = document.getElementById('project-select');

        function updateProjectDropdown() {
            projectSelect.innerHTML = '';
            // Add existing projects
            projectsList.forEach(p => {
                const option = document.createElement('option');
                option.value = p;
                option.textContent = p;
                if (p === currentProject) option.selected = true;
                projectSelect.appendChild(option);
            });
            // Add Create New Option
            const createOption = document.createElement('option');
            createOption.value = '__CREATE_NEW__';
            createOption.textContent = '+ Create New Project';
            createOption.style.fontWeight = 'bold';
            createOption.style.color = '#2dd4bf'; // Teal
            projectSelect.appendChild(createOption);
        }

        projectSelect.addEventListener('change', (e) => {
            if (e.target.value === '__CREATE_NEW__') {
                const modalContent = `
                    <div class="space-y-4">
                        <label for="newProjectName" class="block text-sm font-medium text-gray-300">Enter the name for the new project (e.g. 'Open Yards Phase 2'):</label>
                        <input type="text" id="newProjectName" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white" placeholder="Project Name" required>
                        <div class="flex justify-end gap-4">
                            <button id="cancel-new-project" class="px-6 py-2 rounded-lg bg-gray-600 text-white hover:bg-gray-500 transition-colors font-semibold">Cancel</button>
                            <button id="save-new-project" class="px-6 py-2 rounded-lg bg-teal-600 text-white hover:bg-teal-500 transition-colors font-semibold">Create Project</button>
                        </div>
                    </div>`;

                showModal('Create New Project', modalContent, () => {
                    const newNameInput = document.getElementById('newProjectName');
                    newNameInput.focus();

                    document.getElementById('save-new-project').addEventListener('click', () => {
                        const newName = newNameInput.value.trim();
                        if (newName) {
                            projectsList.add(newName);
                            currentProject = newName;
                            updateProjectDropdown();
                            render();
                            hideModal();
                        } else {
                            showModal('Error', "<p class='text-red-400'>Project name cannot be empty.</p>");
                        }
                    });
                    document.getElementById('cancel-new-project').addEventListener('click', hideModal);
                });
            } else {
                currentProject = e.target.value;
                render();
            }
        });

        // --------------------------------------------------------------
        // 5.1 CUSTOM REPORTING LOGIC
        // --------------------------------------------------------------

        function handleShowTools() {
            const modalContent = `
                <div class="space-y-6">
                    <p class="text-sm text-gray-400">Select categories to include in the generated PDF report.</p>
                    
                    <!-- Civil Defence Filters -->

        function generateCustomPDF() {
            // 1. Gather Filter Settings
            const options = {
                cd: {
                    valid: document.getElementById('cd-valid').checked,
                    expired: document.getElementById('cd-expired').checked,
                    near: document.getElementById('cd-near').checked,
                    amc: document.getElementById('cd-amc').checked
                },
                aman: {
                    valid: document.getElementById('aman-valid').checked,
                    expired: document.getElementById('aman-expired').checked,
                    near: document.getElementById('aman-near').checked,
                    installation: document.getElementById('aman-installation').checked
                },
                currentProjectOnly: document.getElementById('current-project-only').checked
            };

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const reportDate = new Date().toLocaleDateString('en-GB');

            // Title
            doc.setFontSize(18);
            doc.text(`Status Report - ${options.currentProjectOnly ? currentProject : 'All Projects'}`, 14, 22);
            doc.setFontSize(11);
            doc.text(`Generated on: ${reportDate}`, 14, 30);

            let finalY = 35;
            let hasData = false;

            // Helper to add a table section
            const addSection = (title, data, isAman) => {
                if (data.length === 0) return;
                hasData = true;

                // Check page break
                if (finalY > 250) {
                    doc.addPage();
                    finalY = 20;
                }

                doc.setFontSize(14);
                // Set Color based on type/status hint in title
                if (title.includes("Expired")) doc.setTextColor(220, 53, 69); // Red
                else if (title.includes("Near")) doc.setTextColor(255, 193, 7); // Orange/Yellow
                else if (title.includes("Valid")) doc.setTextColor(40, 167, 69); // Green
                else if (title.includes("Installation")) doc.setTextColor(59, 130, 246); // Blue
                else doc.setTextColor(0, 0, 0); // Black

                doc.text(title, 14, finalY + 10);
                doc.setTextColor(0, 0, 0); // Reset

                const body = data.map(c => [
                    c.propertyNumber,
                    c.propertyType || '',
                    formatDate(c.expiryDate),
                    getValidityStatus(c.expiryDate).text,
                    c.workflowStatus || 'N/A'
                ]);

                doc.autoTable({
                    startY: finalY + 15,
                    head: [['Property', 'Type', 'Expiry', 'Status', 'Workflow']],
                    body: body,
                    theme: 'striped',
                    headStyles: { fillColor: isAman ? [22, 160, 133] : [41, 128, 185] },
                    styles: { fontSize: 10 },
                    margin: { top: 20 }
                });

                finalY = doc.lastAutoTable.finalY + 10;
            };

            // Filter Logic
            const filterCerts = (list, criteria) => {
                return list.filter(c => {
                    const projectMatch = !options.currentProjectOnly || (c.project || 'Main Project') === currentProject;
                    if (!projectMatch) return false;

                    const status = getValidityStatus(c.expiryDate).text;
                    if (criteria.expired && status === 'Expired') return true;
                    if (criteria.near && status === 'Near Expiry') return true;
                    if (criteria.valid && (status === 'Valid' || status === 'New')) return true;
                    if (criteria.amc && c.workflowStatus === 'AMC ready') return true;
                    if (criteria.installation && c.workflowStatus === 'Installation in Progress') return true;

                    return false;
                });
            };

            // --- Civil Defence Sections ---
            if (options.cd.expired) addSection("Civil Defence - Expired Certificates",
                filterCerts(cdCerts, { expired: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Expired'), false);

            if (options.cd.near) addSection("Civil Defence - Near Expiry (Action Required)",
                filterCerts(cdCerts, { near: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Near Expiry'), false);

            if (options.cd.amc) addSection("Civil Defence - AMC Ready Workflows",
                filterCerts(cdCerts, { amc: true }).filter(c => c.workflowStatus === 'AMC ready'), false);

            if (options.cd.valid) addSection("Civil Defence - Valid Certificates",
                filterCerts(cdCerts, { valid: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Valid'), false);


            // --- Aman Sections ---
            if (options.aman.expired) addSection("Aman - Expired Certificates",
                filterCerts(amanCerts, { expired: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Expired'), true);

            if (options.aman.near) addSection("Aman - Near Expiry",
                filterCerts(amanCerts, { near: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Near Expiry'), true);

            if (options.aman.installation) addSection("Aman - Installation in Progress",
                filterCerts(amanCerts, { installation: true }).filter(c => c.workflowStatus === 'Installation in Progress'), true);

            if (options.aman.valid) addSection("Aman - Valid Certificates",
                filterCerts(amanCerts, { valid: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Valid'), true);


            if (!hasData) {
                doc.setFontSize(12);
                doc.setTextColor(100);
                doc.text("No records found matching the selected criteria.", 14, 50);
            }

            doc.save(`Custom_Report_${currentProject}_${new Date().toISOString().split('T')[0]}.pdf`);
        }

        // --------------------------------------------------------------
        // 6. APP STATE & LOGIC
        // --------------------------------------------------------------

        const getValidityStatus = (expiryDate) => {
            if (!expiryDate) return { text: 'N/A', color: 'gray', daysLeft: null };
            const now = new Date();
            const expiry = new Date(expiryDate);
            const thirtyDaysFromNow = new Date();
            thirtyDaysFromNow.setDate(now.getDate() + 30);
            const msPerDay = 1000 * 60 * 60 * 24;
            const daysLeft = Math.ceil((expiry - now) / msPerDay);
            
            if (expiry < now) return { text: 'Expired', color: 'red', daysLeft };
            if (expiry <= thirtyDaysFromNow) return { text: 'Near Expiry', color: 'yellow', daysLeft };
            return { text: 'Valid', color: 'green', daysLeft };
        };

        const formatDate = (dateString) => {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            if (isNaN(date)) return 'Invalid Date';
            return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        };

        const processData = (data) => {
            let valid = 0, nearExpiry = 0, expired = 0;
            data.forEach(item => {
                const status = getValidityStatus(item.expiryDate).text;
                if (status === 'Valid') valid++;
                else if (status === 'Near Expiry') nearExpiry++;
                else if (status === 'Expired') expired++;
            });
            return { valid, nearExpiry, expired };
        };

        // ADDED: Notification Logic
        function generateExpiryNotifications() {
            const notifications = [];
            const now = new Date();
            const thirtyDaysFromNow = new Date();
            thirtyDaysFromNow.setDate(now.getDate() + 30);

            // Helper to check for notifications
            const checkCerts = (certs, type) => {
                certs.filter(c => (c.project || 'Main Project') === currentProject).forEach(cert => {
                    if (!cert.expiryDate) return;
                    const expiry = new Date(cert.expiryDate);

                    if (expiry < now) {
                        notifications.push({
                            id: cert.id,
                            type: type,
                            message: `${type === 'Civil Defence' ? 'CD' : 'Aman'} Cert #${cert.propertyNumber} **Expired** on ${formatDate(cert.expiryDate)}!`,
                            urgency: 'red'
                        });
                    } else if (expiry <= thirtyDaysFromNow) {
                        notifications.push({
                            id: cert.id,
                            type: type,
                            message: `${type === 'Civil Defence' ? 'CD' : 'Aman'} Cert #${cert.propertyNumber} **Near Expiry** on ${formatDate(cert.expiryDate)}.`,
                            urgency: 'yellow'
                        });
                    }
                });
            };

            checkCerts(cdCerts, 'Civil Defence');
            checkCerts(amanCerts, 'Aman Certificate');

            return notifications;
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-yellow-600/90 border border-yellow-500 text-white px-6 py-4 rounded-lg shadow-2xl z-50 animate-fade-in-up flex items-start gap-3 max-w-sm';
            toast.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0 mt-0.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <div class="text-sm font-medium leading-snug">${message}</div>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-500');

        function checkAndApplyAutomaticStatusUpdates() {
            let changedCount = 0;
            const today = new Date().setHours(0, 0, 0, 0);

            // Terminal statuses that do NOT get auto-reset even when expired
            const CD_TERMINAL_STATUSES_EXEMPT = ['AMC Contract Pending', 'AMC Contract Applied', 'Informed Fire team'];
            cdCerts.forEach(cert => {
                if ((cert.project || 'Main Project') === currentProject && cert.expiryDate) {
                    const expiry = new Date(cert.expiryDate).setHours(0, 0, 0, 0);
                    if (expiry < today) {
                        // Reset ANY non-exempt CD status to 'AMC Contract Pending' when expired
                        if (!CD_TERMINAL_STATUSES_EXEMPT.includes(cert.workflowStatus)) {
                            cert.workflowStatus = 'AMC Contract Pending';
                            changedCount++;
                        }
                    }
                }
            });

            // Aman: enters 'Renewal Pending' if expired
            const AMAN_EXEMPT = ['Renewal Pending', 'Renewal Faults Pending', 'Inspection & Installation', 'Installation Failed'];
            amanCerts.forEach(cert => {
                if ((cert.project || 'Main Project') === currentProject && cert.expiryDate) {
                    const expiry = new Date(cert.expiryDate).setHours(0, 0, 0, 0);
                    if (expiry < today) {
                        if (!AMAN_EXEMPT.includes(cert.workflowStatus)) {
                            cert.workflowStatus = 'Renewal Pending';
                            changedCount++;
                        }
                    }
                }
            });

            if (changedCount > 0) {
                saveDataToFirebase();
                if (window.hasRenderedOnce) {
                    showToast(`System Auto-Update: ${changedCount} expired certificate(s) have been automatically moved to their pending renewal states.`);
                }
            }
        }

        function render() {
            checkAndApplyAutomaticStatusUpdates();
            window.hasRenderedOnce = true;

            // FILTER DATA BY PROJECT BEFORE RENDERING
            const allProps = getUnifiedProperties();
            const filteredProps = allProps.filter(p => (p.project || 'Main Project') === currentProject);

            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const activePage = document.getElementById(`page-${currentPage}`);
            if (activePage) activePage.classList.add('active');

            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.dataset.page === currentPage) {
                    link.classList.add('bg-teal-600/90', 'text-white', 'shadow-lg');
                    link.classList.remove('text-gray-300', 'hover:bg-gray-700/50');
                } else {
                    link.classList.remove('bg-teal-600/90', 'text-white', 'shadow-lg');
                    link.classList.add('text-gray-300', 'hover:bg-gray-700/50');
                }
            });

            if (currentPage === 'Properties') {
                renderPropertiesPage('Properties', filteredProps);
            }
            updateNotifications(); // Re-render notifications whenever main view changes
        }

                ${generateDetailStatCardHTML('Active', activeMonitored, 'green', iReady)}`;

            // Create simple CSS Donut Charts
            const renderChart = (title, valid, near, expired, total) => {
                if(total === 0) return `<div class="bg-gray-800/50 border border-gray-700 p-4 rounded-2xl flex items-center justify-center h-full"><p class="text-gray-500">No Data</p></div>`;
                const validPct = Math.round((valid / total) * 100) || 0;
                const nearPct = Math.round((near / total) * 100) || 0;
                const expPct = Math.round((expired / total) * 100) || 0;
                return `
                <div class="bg-gray-800/50 border border-gray-700 p-4 rounded-2xl flex flex-col items-center justify-center shadow-lg">
                    <h3 class="text-sm font-bold text-gray-300 mb-4 uppercase tracking-widest">${title} Compliance</h3>
                    <div class="relative w-32 h-32 rounded-full flex items-center justify-center mb-4" style="background: conic-gradient(#4ade80 ${validPct}%, #facc15 ${validPct}% ${validPct + nearPct}%, #f87171 ${validPct + nearPct}% 100%);">
                        <div class="absolute inset-2 bg-gray-800 rounded-full flex items-center justify-center">
                            <span class="text-2xl font-black text-white">${validPct}%</span>
                        </div>
                    </div>
                    <div class="flex gap-4 text-xs font-semibold">
                        <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-green-400"></span> ${valid}</div>
                        <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-yellow-400"></span> ${near}</div>
                        <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-red-400"></span> ${expired}</div>
                    </div>
                </div>`;
            };

            return `
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4">
                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-500">
                    Dashboard Overview

                    <button onclick="handleShowDownloadOptions('Civil Defence')" class="px-4 py-2 bg-blue-600/80 hover:bg-blue-500 rounded-lg text-sm font-bold text-white shadow-lg flex items-center gap-2 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        CD Report
                    </button>
                    <button onclick="handleShowDownloadOptions('Aman Certificate')" class="px-4 py-2 bg-yellow-600/80 hover:bg-yellow-500 rounded-lg text-sm font-bold text-white shadow-lg flex items-center gap-2 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Aman Report
                    </button>
                    <button onclick="handleShowFinancialReportOptions()" class="px-4 py-2 bg-teal-600/80 hover:bg-teal-500 rounded-lg text-sm font-bold text-white shadow-lg flex items-center gap-2 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        Financial
                    </button>
                    <button onclick="handleGlobalSearch()" class="px-4 py-2 bg-purple-600/80 hover:bg-purple-500 rounded-lg text-sm font-bold text-white shadow-lg flex items-center gap-2 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        Global Search
                    </button>
                </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8">
                <div class="lg:col-span-3">
                    <h2 class="text-xl font-bold text-white mb-3">Civil Defence Overview</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 mb-6">${cdCards}</div>

                </div>

        }

        function generateDetailStatCardHTML(title, value, color, icon) {
            const colorMap = {
                teal: { bg: 'bg-teal-500/10', border: 'border-teal-500/30', text: 'text-teal-400', num: 'text-teal-300' },
                green: { bg: 'bg-green-500/10', border: 'border-green-500/30', text: 'text-green-400', num: 'text-green-300' },
                yellow: { bg: 'bg-yellow-500/10', border: 'border-yellow-500/30', text: 'text-yellow-400', num: 'text-yellow-300' },
                red: { bg: 'bg-red-500/10', border: 'border-red-500/30', text: 'text-red-400', num: 'text-red-300' },
                blue: { bg: 'bg-blue-500/10', border: 'border-blue-500/30', text: 'text-blue-400', num: 'text-blue-300' },
                purple: { bg: 'bg-purple-500/10', border: 'border-purple-500/30', text: 'text-purple-400', num: 'text-purple-300' },
                orange: { bg: 'bg-orange-500/10', border: 'border-orange-500/30', text: 'text-orange-400', num: 'text-orange-300' },
                gray: { bg: 'bg-gray-700/40', border: 'border-gray-600/50', text: 'text-gray-400', num: 'text-white' },
            };
            const c = colorMap[color] || colorMap.gray;
            return `
            <div class="${c.bg} border ${c.border} rounded-2xl p-4 flex flex-col gap-2 hover:scale-105 transition-transform duration-200 cursor-default">
                <div class="flex items-center justify-between">

                    <span class="${c.text} opacity-70">${icon}</span>

                <p class="text-2xl sm:text-3xl font-black ${c.num} leading-none">${value}</p>
            </div>`;
        }

                        </div>
                    </div>`;
                }
            }

            pageEl.innerHTML = `
                ${bannerHTML}
                <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
                    <h1 class="text-4xl font-bold text-white">All Properties</h1>
                    <div class="flex items-center gap-2 flex-wrap justify-end">
                        <div class="flex items-center gap-1 bg-gray-800 border border-gray-700 rounded-xl p-1">
                            <button id="workflow-hub-btn" class="flex items-center gap-2 px-3 py-2 text-sm font-semibold text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                                Active Workflows
                            </button>
                        </div>
                        ${isEditor ? `
                        <button onclick="handleShowForm('Civil Defence')" class="flex items-center gap-2 px-3 py-2 text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 rounded-xl transition-colors shadow-lg shadow-blue-900/40">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
                            Add CD Certificate
                        </button>
                        <button onclick="handleShowForm('Aman Certificate')" class="flex items-center gap-2 px-3 py-2 text-sm font-bold text-white bg-yellow-600 hover:bg-yellow-500 rounded-xl transition-colors shadow-lg shadow-yellow-900/40">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
                            Add Aman Certificate
                        </button>` : ''}
                    </div>
                </div>
                ${detailDashboardHTML}
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div class="relative md:col-span-1">
                        <input type="search" id="search-input-unified" placeholder="${searchPlaceholder}" value="${currentFilters.Properties.search}" class="w-full bg-gray-800 border border-gray-700 rounded-lg pl-10 pr-4 py-2 text-white focus:ring-2 focus:ring-teal-500">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                    <div>
                        <select id="phase-filter-unified" data-filter-type="phase" class="filter-select w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-teal-500">

                            <option value="Phase 1">Phase 1</option>

            if (phaseFilter) phaseFilter.value = currentFilters.Properties.phase;

            const remindLaterBtn = pageEl.querySelector('#bulk-remind-later-btn');
            if (remindLaterBtn) remindLaterBtn.addEventListener('click', () => {

                render();
