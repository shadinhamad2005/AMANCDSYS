        // --- Unified Workflow Manager ---
        function handleShowWorkflowManager(propNo) {
            const props = getUnifiedProperties();
            const prop = props.find(p => p.propertyNumber === propNo);
            if (!prop) return showModal("Error", "<p class='text-red-400'>Property not found.</p>");

            // Helper to generate the card HTML using the existing logic inside handleShowDetailsModal
            // We can essentially rebuild the HTML generation here to isolate CD vs Aman
            function getCardHtml(cert, type) {
                if (!cert) {
                    return `<div class="bg-gray-800/50 border border-gray-700/50 rounded-2xl p-6 flex items-center justify-center h-full shadow-lg">
                                <p class="text-gray-400 font-medium">No ${type} record linked to this property.</p>
                            </div>`;
                }

                const isCD = type === 'Civil Defence';
                const isAman = type === 'Aman Certificate';
                const costs = isAman ? calculateAmanCosts(cert) : {};
                
                const detailsMap = [
                    { label: 'Validity Status', value: generateStatusBadge(getValidityStatus(cert.expiryDate)), html: true },
                    { label: 'Expiry Date', value: formatDate(cert.expiryDate) },
                    { label: 'Workflow Status', value: generateWorkflowBadge(cert.workflowStatus, cert.inspectionDate, type), html: true },
                ];

                if (isCD) {
                    detailsMap.splice(2, 0, { label: 'Issue Date', value: formatDate(cert.issueDate) });
                    detailsMap.push({ label: 'AMC Only', value: cert.amcOnly === 'on' || cert.amcOnly === true ? 'Yes' : 'No' });
                    if (cert.amcOnly === 'on' || cert.amcOnly === true) {
                        detailsMap.push({ label: 'AMC Expiry Date', value: formatDate(cert.amcExpiryDate) || 'Not Set' });
                    }
                }
                if (isAman) {
                    detailsMap.push({ label: 'Account ID', value: cert.accountId || 'N/A' });
                    detailsMap.push({ label: 'Record ID', value: cert.recordId || 'N/A' });
                    detailsMap.push({ label: 'Device ID', value: cert.deviceId || 'N/A' });
                    detailsMap.push({ label: 'Serial Number', value: cert.serialNumber || 'N/A' });
                }

                let notesDisplay = 'N/A';
                if (Array.isArray(cert.notes) && cert.notes.length > 0) {
                    notesDisplay = cert.notes.map(n => `<div class="mb-2 p-2 bg-gray-900 rounded border border-gray-700"><p class="text-xs text-teal-400 mb-1">${formatDate(n.date)}</p><p class="text-sm text-gray-200 whitespace-pre-wrap">${n.text}</p></div>`).join('');
                } else if (typeof cert.notes === 'string' && cert.notes.trim()) {
                    notesDisplay = `<div class="mb-2 p-2 bg-gray-900 rounded border border-gray-700"><p class="text-sm text-gray-200 whitespace-pre-wrap">${cert.notes}</p></div>`;
                }
                detailsMap.push({ label: 'Notes', value: notesDisplay, html: true, fullWidth: true });

                const detailsHtml = detailsMap.map(detail => `
                    <div class="${detail.fullWidth ? 'md:col-span-2' : 'col-span-1'} p-2 bg-gray-900/50 rounded-lg">
                        <p class="text-[9px] font-bold text-gray-400 uppercase tracking-wider">${detail.label}</p>
                        <div class="text-xs font-medium text-white mt-1">
                            ${detail.html ? detail.value : (detail.value || 'N/A')}
                        </div>
                    </div>
                `).join('');

                const costHtml = isAman ? `
                    <div class="md:col-span-2 mt-2">
                        <h4 class="text-xs font-bold text-yellow-400 mb-1.5 uppercase tracking-wider">Financial Overview (AED)</h4>
                        <div class="grid grid-cols-3 gap-2">
                            <div class="p-1.5 bg-gray-900/50 rounded-lg text-center">
                                <p class="text-[9px] font-semibold text-gray-400">Total Install</p>
                                <p class="text-xs font-bold text-white">${costs.totalInstallation.toFixed(2)}</p>
                            </div>
                            <div class="p-1.5 bg-gray-900/50 rounded-lg text-center">
                                <p class="text-[9px] font-semibold text-gray-400">Total Renewal</p>
                                <p class="text-xs font-bold text-white">${costs.totalRenewal.toFixed(2)}</p>
                            </div>
                            <div class="p-1.5 bg-teal-900/40 rounded-lg text-center border border-teal-700/50">
                                <p class="text-[9px] font-semibold text-teal-300">Total Lifetime</p>
                                <p class="text-xs font-bold text-white">${costs.totalLifetime.toFixed(2)}</p>
                            </div>
                        </div>
                    </div>
                ` : '';

                const isLocalFile = cert.certificateLink && !cert.certificateLink.startsWith('http');
                const certLinkStr = cert.certificateLink ? `
                    ${isLocalFile ? 
                        `<button onclick="window.openLocalFile('${cert.certificateLink}')" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-500 transition-colors text-white text-sm font-bold shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="10" y1="13" x2="14" y2="13"></line><line x1="10" y1="17" x2="14" y2="17"></line><line x1="10" y1="9" x2="10" y2="9"></line></svg>
                            View Document
                        </button>`
                    :
                        `<a href="${cert.certificateLink}" target="_blank" rel="noopener noreferrer" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-teal-600 hover:bg-teal-500 transition-colors text-white text-sm font-bold shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="10" y1="13" x2="14" y2="13"></line><line x1="10" y1="17" x2="14" y2="17"></line><line x1="10" y1="9" x2="10" y2="9"></line></svg>
                            View Cloud Doc
                        </a>`
                    }` : '';

                const isLocalPayment = cert.paymentReportLink && !cert.paymentReportLink.startsWith('http');
                const paymentLinkStr = cert.paymentReportLink ? `
                    ${isLocalPayment ?
                        `<button onclick="window.openLocalFile('${cert.paymentReportLink}')" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-teal-600/50 hover:bg-teal-500/50 transition-colors text-white text-sm font-bold shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="10" y1="13" x2="14" y2="13"></line><line x1="10" y1="17" x2="14" y2="17"></line><line x1="10" y1="9" x2="10" y2="9"></line></svg>
                            Payment Report
                        </button>`
                    :
                        `<a href="${cert.paymentReportLink}" target="_blank" rel="noopener noreferrer" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-teal-600/50 hover:bg-teal-500/50 transition-colors text-white text-sm font-bold shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="10" y1="13" x2="14" y2="13"></line><line x1="10" y1="17" x2="14" y2="17"></line><line x1="10" y1="9" x2="10" y2="9"></line></svg>
                            Payment Report
                        </a>`
                    }` : '';

                return `
                <div class="bg-gray-800/50 border border-gray-700/50 rounded-2xl p-4 shadow-lg flex flex-col relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-teal-500/5 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
                    
                    <div class="flex items-center justify-between border-b border-gray-700/50 pb-3 mb-3">
                        <h3 class="text-lg font-bold text-${isCD ? 'blue' : 'yellow'}-400 flex items-center gap-2">
                            ${type}
                        </h3>
                        <div class="flex gap-2">
                            <button class="action-btn text-teal-400 hover:text-teal-300 p-1.5 bg-gray-800 rounded transition-colors" data-action="edit" data-id="${cert.id}" data-type="${type}" title="Edit ${type}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path><path d="m15 5 4 4"></path></svg>
                            </button>
                            <button class="action-btn text-purple-400 hover:text-purple-300 p-1.5 bg-gray-800 rounded transition-colors" data-action="history" data-id="${cert.id}" data-type="${type}" title="${type} History">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                            </button>
                            <button class="action-btn text-orange-400 hover:text-orange-300 p-1.5 bg-gray-800 rounded transition-colors" data-action="renew" data-id="${cert.id}" data-type="${type}" title="Renew ${type}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.13 15.57a9 9 0 1 0 3.84-10.36L2 8"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 flex-1">
                        ${detailsHtml}
                        ${costHtml}
                    </div>

                    <div class="mt-3">
                        <button class="w-full py-2.5 bg-gradient-to-r from-teal-600 to-teal-500 hover:from-teal-500 hover:to-teal-400 text-white font-bold rounded-xl shadow-lg shadow-teal-900/50 transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2 action-btn text-sm" data-action="interactive-workflow" data-id="${cert.id}" data-type="${type}">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                            Manage Workflow Steps
                        </button>
                    </div>

                    <div class="mt-4 flex gap-2 pt-3 border-t border-gray-700/50">
                        ${certLinkStr}
                        ${paymentLinkStr}
                    </div>
                </div>
                `;
            }

            const headerHtml = `
                <div class="col-span-full flex flex-col md:flex-row justify-between items-center mb-2 p-4 bg-gray-800 border border-gray-700 rounded-xl shadow-lg">
                    <div>
                        <h2 class="text-2xl font-black text-white tracking-tight">Property <span class="text-teal-400">${prop.propertyNumber}</span></h2>
                        <p class="text-sm font-medium text-gray-400 mt-1">${prop.project || 'Main Project'} &bull; ${prop.phase || 'N/A Phase'} &bull; ${(prop.propertyType || 'N/A').toUpperCase()}</p>
                    </div>
                </div>
            `;

            // Setup Dependency Gate: If Aman is bad, block CD actions.
            // But we evaluate this when the user clicks 'Renew' or 'Edit' on CD.
            // For now, let's just show an alert if Aman is not active.
            let dependencyAlert = '';
            if (prop.cd && prop.aman) {
                const amanValid = ['Active & Monitored', 'Application Submitted', 'Cert Issued (Pending Install)'].includes(prop.aman.workflowStatus);
                const cdStatus = getValidityStatus(prop.cd.expiryDate);
                
                // If CD is expired/near expiry and Aman is unhealthy or expired, warn them!
                if (!amanValid && (cdStatus.text === 'Expired' || cdStatus.text === 'Near Expiry')) {
                    dependencyAlert = `
                        <div class="col-span-full mb-4 p-4 bg-red-900/30 border border-red-500/50 rounded-xl flex items-center gap-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="text-red-400 flex-shrink-0" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                            <div>
                                <h4 class="text-sm font-bold text-red-400 uppercase tracking-wider">Dependency Warning</h4>
                                <p class="text-sm text-red-300 mt-1">Aman system must be active and compliant before Civil Defence renewal can be processed.</p>
                            </div>
                        </div>
                    `;
                }
            }

            const modalContent = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 pb-8">
                    ${headerHtml}
                    ${dependencyAlert}
                    ${getCardHtml(prop.cd, 'Civil Defence')}
                    ${getCardHtml(prop.aman, 'Aman Certificate')}
                </div>
            `;

            // Passing 'max-w-[96vw] h-[95vh]' to make it focus mode/fullscreen
            showModal(`Workflow Manager`, modalContent, null, '!m-0 !rounded-none !border-0 w-screen h-[100dvh] !max-w-none !max-h-[100dvh]');
        }

        // --- Renewal Modal ---

        function handleShowRenewalModal(type, id) {
            const dataArray = type === 'Civil Defence' ? cdCerts : amanCerts;
            const cert = dataArray.find(c => c.id === id);
            if (!cert) return showModal("Error", "<p class='text-red-400'>Certificate not found.</p>");

            const isCivilDefence = type === 'Civil Defence';
            const isAman = type === 'Aman Certificate';
            const validityStatus = getValidityStatus(cert.expiryDate);

            const renewalFieldsHtml = isAman ? `
                <h3 class="text-lg font-bold text-yellow-400 mb-4 border-b border-gray-700 pb-2">Aman Financial Details (Renewal Payment)</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="renewalDate" class="block text-sm font-medium text-gray-300 mb-2">Renewal/Payment Date</label>
                        <input type="date" id="renewalDate" name="renewalDate" required class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white">
                    </div>
                    <div>
                        <label for="renewalCost" class="block text-sm font-medium text-gray-300 mb-2">Renewal Cost (AED)</label>
                        <input type="number" step="0.01" id="renewalCost" name="renewalCost" required class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white" placeholder="Amount in AED">
                    </div>
                </div>
                <div class="mt-4">
                    <label for="amanRenewalOutcome" class="block text-sm font-medium text-gray-300 mb-2">Renewal Outcome</label>
                    <select id="amanRenewalOutcome" name="amanRenewalOutcome" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        <option value="success">Successful Renewal (Certificate Ready)</option>
                        <option value="fault">Payment Done but System Faulty (No Certificate Issued)</option>
                    </select>
                </div>
            ` : '';

            // NEW: Issue Date field for CD renewals
            const cdIssueDateInput = isCivilDefence ? `
                <div class="pt-4">
                    <label for="newIssueDate" class="block text-sm font-medium text-gray-300 mb-2">New Certificate Issue Date</label>
                    <input type="date" id="newIssueDate" name="newIssueDate" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white">
                </div>
            ` : '';

            const amcExpiryInput = (isCivilDefence && (cert.amcOnly === 'on' || cert.amcOnly === true)) ? `
                <div class="pt-4">
                    <label for="newAmcExpiryDate" class="block text-sm font-medium text-gray-300 mb-2">New AMC Expiry Date</label>
                    <input type="date" id="newAmcExpiryDate" name="newAmcExpiryDate" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white">
                </div>
            ` : '';


            const modalContent = `
                <form id="renewal-form" data-id="${id}" data-type="${type}" class="space-y-6">
                    <p class="text-lg font-medium text-gray-300">Renewing <span class="text-teal-400">${cert.propertyNumber}</span> (Current Status: ${validityStatus.text})</p>
                    
                    <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2">New Certificate Details</h3>
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label for="newExpiryDate" class="block text-sm font-medium text-gray-300 mb-2">New Regular Expiry Date</label>
                            <input type="date" id="newExpiryDate" name="newExpiryDate" ${!(cert.amcOnly === 'on' || cert.amcOnly === true) ? 'required' : ''} class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white">
                        </div>
                        ${cdIssueDateInput}
                        ${amcExpiryInput}
                    </div>

                    <div class="col-span-full pt-4">
                        <label class="block text-sm font-medium text-gray-300 mb-2">New Certificate Document (Optional)</label>
                        <div class="flex gap-4 items-start">
                            <div class="flex-1">
                                <input type="text" id="renewCertificateLink" name="renewCertificateLink" placeholder="Paste link or upload new certificate" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-teal-500 mb-2">
                            </div>
                            <div class="flex-shrink-0 flex flex-col items-end">
                                <input type="file" id="renewCertificateFile" class="hidden" accept=".pdf,image/*">
                                <button type="button" id="renew-upload-btn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm font-semibold transition-colors flex items-center gap-2 border border-gray-600">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" x2="12" y1="3" y2="15"></line></svg>
                                    Upload
                                </button>
                                <span id="renew-upload-status" class="text-xs text-gray-400 mt-2 hidden"></span>
                            </div>
                        </div>
                    </div>
                    
                    ${renewalFieldsHtml}

                    <div class="flex justify-end gap-4 pt-4">
                        <button type="button" id="renewal-cancel-btn" class="px-6 py-2 rounded-lg bg-gray-600 text-white hover:bg-gray-500 transition-colors font-semibold">Cancel</button>
                        <button type="submit" class="px-6 py-2 rounded-lg bg-teal-600 text-white hover:bg-teal-500 transition-colors font-semibold">Confirm Renewal</button>
                    </div>
                </form>
            `;

            showModal(`Renew ${type} Certificate`, modalContent, () => {
                document.getElementById('renewal-form').addEventListener('submit', handleProcessRenewal);
                document.getElementById('renewal-cancel-btn').addEventListener('click', hideModal);

                // File Upload Logic for Renewal (Local OneDrive)
                const uploadBtn = document.getElementById('renew-upload-btn');
                const uploadStatus = document.getElementById('renew-upload-status');
                const linkInput = document.getElementById('renewCertificateLink');
                const fileInput = document.getElementById('renewCertificateFile');

                if (uploadBtn && fileInput) {
                    uploadBtn.addEventListener('click', async () => {
                        if (!oneDriveFolderHandle) {
                            showModal("Access Required", "<p class='text-red-400'>Please click 'Link OneDrive' or 'Grant Access' in the sidebar first to link your local certificate folder.</p>");
                            return;
                        }
                        fileInput.click();
                    });

                    fileInput.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;

                        uploadStatus.textContent = 'Saving to OneDrive...';
                        uploadStatus.classList.remove('hidden', 'text-green-400', 'text-red-400');
                        uploadStatus.classList.add('text-teal-400');
                        uploadBtn.disabled = true;

                        try {
                            if ((await oneDriveFolderHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
                                await oneDriveFolderHandle.requestPermission({ mode: 'readwrite' });
                            }

                            const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                            const fileName = `${Date.now()}_${safeName}`;
                            const fileHandle = await oneDriveFolderHandle.getFileHandle(fileName, { create: true });
                            const writable = await fileHandle.createWritable();
                            await writable.write(file);
                            await writable.close();

                            linkInput.value = fileName;

                            uploadStatus.textContent = 'Saved to folder!';
                            uploadStatus.classList.remove('text-teal-400', 'text-red-400');
                            uploadStatus.classList.add('text-green-400');
                            uploadBtn.disabled = false;
                        } catch (err) {
                            console.error(err);
                            uploadStatus.textContent = 'Save failed!';
                            uploadStatus.classList.remove('text-teal-400', 'text-green-400');
                            uploadStatus.classList.add('text-red-400');
                            uploadBtn.disabled = false;
                        }
                    });
                }
            });
        }

        function handleProcessRenewal(e) {
            e.preventDefault();
            const form = e.target;
            const id = form.dataset.id;
            const type = form.dataset.type;
            const dataArray = type === 'Civil Defence' ? cdCerts : amanCerts;
            const certIndex = dataArray.findIndex(c => c.id === id);

            if (certIndex === -1) return;

            const newExpiryDate = document.getElementById('newExpiryDate').value;
            const cert = dataArray[certIndex];
            const isAmcOnly = cert.amcOnly === 'on' || cert.amcOnly === true;

            if (!newExpiryDate && !isAmcOnly) {
                showModal("Validation Error", "<p class='text-red-400'>New Expiry Date is mandatory.</p>");
                return;
            }

            // 1. Log Old Expiry/Link to HistoryData before renewal
            if (!historyData[id]) historyData[id] = [];
            historyData[id].push({
                ...cert,
                archivedAt: new Date().toISOString(),
                // Keep only relevant historical fields to save space
                // FIX: Ensure no undefined values for Firebase set()
                expiryDate: cert.expiryDate || '',
                amcExpiryDate: cert.amcExpiryDate || '',
                certificateLink: cert.certificateLink || ''
            });


            // 2. Update Main Certificate Data
            if (newExpiryDate) cert.expiryDate = newExpiryDate;
            
            if (type === 'Aman Certificate') {
                const outcome = document.getElementById('amanRenewalOutcome')?.value;
                if (outcome === 'fault') {
                    cert.workflowStatus = 'Renewal Faults Pending';
                } else {
                    cert.workflowStatus = 'Active & Monitored';
                }
            } else {
                // CD renewal complete
                cert.workflowStatus = 'Certificate Ready';
            }
            cert.inspectionDate = ''; // Clear inspection date if renewal

            // 2b. Handle Civil Defence Issue Date and AMC Expiry update
            if (type === 'Civil Defence') {
                const newIssueDate = document.getElementById('newIssueDate')?.value;
                if (newIssueDate) {
                    cert.issueDate = newIssueDate;
                }
                const newAmcExpiryDate = document.getElementById('newAmcExpiryDate')?.value;
                if (newAmcExpiryDate) {
                    cert.amcExpiryDate = newAmcExpiryDate;
                }
            }

            // 2c. Update Certificate Link if a new one was uploaded/pasted
            const newLink = document.getElementById('renewCertificateLink').value;
            if (newLink) {
                cert.certificateLink = newLink;
            }

            // 3. Handle Aman Financial History
            if (type === 'Aman Certificate') {
                const renewalDate = document.getElementById('renewalDate').value;
                const renewalCost = parseFloat(document.getElementById('renewalCost').value);

                if (!renewalDate || isNaN(renewalCost) || renewalCost < 0) {
                    showModal("Validation Error", "<p class='text-red-400'>Renewal Date and Cost are required for Aman certificates.</p>");
                    return;
                }

                // Add new Renewal record to renewalHistory
                cert.renewalHistory.push({
                    id: Math.random().toString(36).substring(2, 10),
                    type: 'Renewal',
                    date: renewalDate,
                    cost: renewalCost
                });
            }

            // 4. Save and Finish
            saveDataToFirebase();
            hideModal();
            render();
            showModal("Renewal Complete", `<p class='text-green-400'>Certificate for ${cert.propertyNumber} has been successfully renewed until ${formatDate(newExpiryDate)}!</p>`);
        }

        // --- Financial Report Options Modal ---
        function handleShowFinancialReportOptions() {
            const modalContent = `

        function handleExportFinancialDataCSV(type, data) {
            if (type !== 'Aman Certificate') return;

            const filteredData = data
                .filter(item => (item.project || 'Main Project') === currentProject)
                .sort((a, b) => String(a.propertyNumber).localeCompare(String(b.propertyNumber), undefined, { numeric: true, sensitivity: 'base' }));

            if (filteredData.length === 0) {
                showModal("Export Failed", "<p class='text-yellow-400'>No data to export based on the current filters.</p>");
                return;
            }

            // --- Group by section (matching PDF layout) ---
            const sectionMap = { Warehouse: 'warehouse', OPY: 'opy', Admin: 'admin', Others: 'others' };
            const grouped = filteredData.reduce((acc, item) => {
                let t = (item.propertyType || '').toLowerCase().replace(/\s/g, '');
                if (t.includes('openyard')) t = 'opy';
                if (t.includes('adminbuilding')) t = 'admin';
                if (t === 'warehouse' || t === 'warehouses') t = 'warehouse';
                const key = Object.keys(sectionMap).find(k => sectionMap[k] === t) || 'Others';
                if (!acc[key]) acc[key] = [];
                acc[key].push(item);
                return acc;
            }, {});

            // --- Determine max renewals across ALL data ---
            const maxRenewals = filteredData.reduce((max, item) => {
                const rCount = (item.renewalHistory || []).filter(r => r.type === 'Renewal').length;
                return Math.max(max, rCount);
            }, 0);

            // --- Build Header row ---
            const dynHeaders = [];
            for (let i = 1; i <= maxRenewals; i++) dynHeaders.push(`R${i} Date`, `R${i} Cost (AED)`);
            const headers = ['Property No.', 'Expiry Date', 'Account ID', 'Install Date', 'Install Cost (AED)', ...dynHeaders, 'Total Install (AED)', 'Total Renewal (AED)', 'Total Lifetime (AED)'];

            const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
            const rows = [];

            // --- Title row ---
            rows.push([esc(`Aman Certificate Financial Report - ${currentProject}`)]);
            rows.push([esc(`Generated: ${new Date().toLocaleDateString('en-GB')}`)]);
            rows.push(['']); // blank spacer

            // Grand totals accumulators
            let grandInstall = 0, grandRenewal = 0;

            const sectionOrder = ['Warehouse', 'OPY', 'Admin', 'Others'];
            sectionOrder.forEach(section => {
                const sData = grouped[section] || [];
                if (sData.length === 0) return;

                // Section header
                rows.push([esc(`=== ${section} ===`)]);
                rows.push(headers.map(esc).join(','));

                let secInstall = 0, secRenewal = 0;

                sData.forEach(item => {
                    const history = item.renewalHistory || [];
                    const inst = history.find(r => r.type === 'Installation') || {};
                    const renewals = history.filter(r => r.type === 'Renewal').sort((a, b) => new Date(a.date) - new Date(b.date));
                    const costs = calculateAmanCosts(item);

                    const installCost = parseFloat(inst.cost) || 0;
                    const renewCost = costs.totalRenewal;
                    secInstall += installCost;
                    secRenewal += renewCost;

                    const rowData = [
                        item.propertyNumber || '',
                        item.expiryDate ? formatDate(item.expiryDate) : 'N/A',
                        item.accountId || 'N/A',
                        inst.date ? formatDate(inst.date) : 'N/A',
                        installCost.toFixed(2)
                    ];
                    for (let i = 1; i <= maxRenewals; i++) {
                        const r = renewals[i - 1];
                        rowData.push(r ? formatDate(r.date) : '', r ? parseFloat(r.cost).toFixed(2) : '');
                    }
                    rowData.push(costs.totalInstallation.toFixed(2), renewCost.toFixed(2), costs.totalLifetime.toFixed(2));
                    rows.push(rowData.map(esc).join(','));
                });

                // Section subtotal row
                const subtotalPad = Array(5 + maxRenewals * 2).fill(esc(''));
                const subtotalLabel = `${section} Subtotal`;
                const lifetime = secInstall + secRenewal;
                rows.push([
                    esc(subtotalLabel),
                    ...subtotalPad.slice(1),
                    esc(secInstall.toFixed(2)),
                    esc(secRenewal.toFixed(2)),
                    esc(lifetime.toFixed(2))
                ].join(','));
                rows.push(['']); // blank spacer between sections

                grandInstall += secInstall;
                grandRenewal += secRenewal;
            });

            // --- Grand summary row ---
            rows.push(['']); // spacer
            rows.push([esc('GRAND TOTAL SUMMARY')]);
            const summaryHeaders = ['Total Installation Cost (AED)', 'Total Renewal Cost (AED)', 'Total Lifetime Cost (AED)'];
            rows.push(summaryHeaders.map(esc).join(','));
            rows.push([esc(grandInstall.toFixed(2)), esc(grandRenewal.toFixed(2)), esc((grandInstall + grandRenewal).toFixed(2))].join(','));

            // --- Download ---
            const blob = new Blob([rows.map(r => Array.isArray(r) ? r.join(',') : r).join('\n')], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Aman_Financial_Report_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function handleDownloadFinancialReport(type, data) {
            if (type !== 'Aman Certificate') return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');

            // --- Filtering Data (Done in the options modal trigger, but filtering again for safety based on local state) ---
            const filters = currentFilters[type] || { validity: 'All', phase: 'All', workflow: 'All', search: '' };
            const getLower = (item, field) => String(item[field] || '').toLowerCase();

            const filteredData = data.filter(item => {
                const validityMatch = checkValidityFilter(item, filters);
                let searchMatch = !filters.search;
                if (filters.search) {
                    const searchTerm = filters.search.toLowerCase();
                    searchMatch = (getLower(item, 'propertyNumber').includes(searchTerm)) ||
                        (getLower(item, 'accountId').includes(searchTerm)) ||
                        (getLower(item, 'recordId').includes(searchTerm)) ||
                        (getLower(item, 'deviceId').includes(searchTerm)) ||
                        (getLower(item, 'serialNumber').includes(searchTerm));
                }
                const phaseMatch = filters.phase === 'All' || item.phase === filters.phase;
                const workflowMatch = filters.workflow === 'All' || item.workflowStatus === filters.workflow;
                return validityMatch && searchMatch && phaseMatch && workflowMatch;
            });

            if (filteredData.length === 0) {
                showModal("Report Generation Failed", "<p class='text-yellow-400'>No Aman data matching current filters to generate the financial report.</p>");
                return;
            }

            filteredData.sort((a, b) => String(a.propertyNumber).localeCompare(String(b.propertyNumber), undefined, { numeric: true, sensitivity: 'base' }));

            // --- Grouping Data ---
            const PROPERTY_SECTIONS_MAP = { 'Warehouse': 'warehouse', 'OPY': 'opy', 'Admin': 'admin', 'Others': 'others' };
            const sectionsToReport = ['Warehouse', 'OPY', 'Admin']; // Only report on these three major sections

            const groupedData = filteredData.reduce((acc, item) => {
                let itemType = item.propertyType ? item.propertyType.toLowerCase().replace(/\s/g, '') : 'others';
                // Robust routing logic (same as renderAllTables)
                if (itemType.includes('openyard')) itemType = 'opy';
                if (itemType.includes('adminbuilding')) itemType = 'admin';
                if (itemType === 'warehouse' || itemType === 'warehouses') itemType = 'warehouse';
                if (itemType === 'admin') itemType = 'admin';
                if (itemType === 'opy') itemType = 'opy';

                let sectionKey = 'Others';
                for (const key in PROPERTY_SECTIONS_MAP) {
                    if (PROPERTY_SECTIONS_MAP[key] === itemType) {
                        sectionKey = key;
                        break;
                    }
                }

                if (!acc[sectionKey]) acc[sectionKey] = [];
                acc[sectionKey].push(item);
                return acc;
            }, {});

            // --- Report Header ---
            const reportTitle = `Aman Certificate Financial History Report - ${currentProject}`;
            const reportDate = new Date().toLocaleDateString('en-GB');

            doc.setFontSize(18);
            doc.text(reportTitle, 14, 22);
            doc.setFontSize(11);
            doc.text(`Report generated on: ${reportDate}`, 14, 30);

            let totalInstallCostSummary = 0;
            let totalRenewalCostSummary = 0;
            let finalY = 35;


            // --- Helper to Generate Section Table ---
            const generateSectionTable = (sectionTitle, sectionData, startY) => {
                if (sectionData.length === 0) return startY;

                let groupInstallCost = 0;
                let groupRenewalCost = 0;

                // --- Table Headers (Fixed for Vertical Data) ---
                const head = [
                    [{ content: sectionTitle, colSpan: 5, styles: { fillColor: [176, 224, 230], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center' } }], // Light Blue Header
                    ['Prop No.', 'Expiry Date', 'Account ID', 'Install Info (Date / Cost)', 'Renewal History (Date / Cost)']
                ];

                // 3. Prepare table body
                const body = sectionData.map(item => {
                    const history = item.renewalHistory || [];
                    const installRecord = history.find(r => r.type === 'Installation') || {};
                    const renewalRecords = history.filter(r => r.type === 'Renewal').sort((a, b) => new Date(a.date) - new Date(b.date));

                    const installCost = parseFloat(installRecord.cost) || 0;
                    groupInstallCost += installCost;
                    totalInstallCostSummary += installCost;

                    // Install Info Cell: Stack Date and Cost vertically
                    const installInfo = [
                        'Date: ' + (installRecord.date ? formatDate(installRecord.date) : 'N/A'),
                        'Cost: ' + ((installRecord.cost !== undefined && installRecord.cost !== '') ? `${parseFloat(installRecord.cost).toFixed(2)} AED` : 'N/A')
                    ].join('\n');

                    // Renewal History Cell: Stack ALL renewal pairs vertically
                    const renewalHistoryLines = renewalRecords.map((r, index) =>
                        `R${index + 1}: ${formatDate(r.date)} / ${parseFloat(r.cost).toFixed(2)} AED`
                    );
                    const renewalInfo = renewalHistoryLines.length > 0 ? renewalHistoryLines.join('\n') : 'N/A';

                    // Sum renewal costs for this specific row
                    let rowRenewalCost = 0;
                    renewalRecords.forEach(r => { rowRenewalCost += parseFloat(r.cost) || 0; });
                    groupRenewalCost += rowRenewalCost;
                    totalRenewalCostSummary += rowRenewalCost;

                    return [
                        item.propertyNumber || '',
                        formatDate(item.expiryDate),
                        item.accountId || 'N/A',
                        installInfo,
                        renewalInfo
                    ];
                });

                // --- Group Summary Row ---
                const summaryRow = [
                    { content: `Total ${sectionTitle} Costs:`, colSpan: 3, styles: { halign: 'right', fontStyle: 'bold', fillColor: [192, 222, 237], textColor: [0, 0, 0] } }, // Very Light Blue/Gray
                    { content: `Install: ${groupInstallCost.toFixed(2)} AED`, colSpan: 1, styles: { halign: 'center', fontStyle: 'bold', fillColor: [144, 238, 144], textColor: [0, 0, 0] } }, // Light Green
                    { content: `Renewal: ${groupRenewalCost.toFixed(2)} AED`, colSpan: 1, styles: { halign: 'center', fontStyle: 'bold', fillColor: [144, 238, 144], textColor: [0, 0, 0] } } // Light Green
                ];
                body.push(summaryRow);

                doc.autoTable({
                    startY: startY,
                    head: head,
                    body: body,
                    theme: 'striped',
                    styles: { fontSize: 8, cellPadding: 1.5, lineColor: [150, 150, 150], lineWidth: 0.1, valign: 'top', textColor: [0, 0, 0] }, // Black text
                    headStyles: { fillColor: [22, 160, 133], textColor: 255, fontStyle: 'bold' }, // Teal Header
                    alternateRowStyles: { fillColor: [230, 230, 230] }, // Very light rows
                    bodyStyles: { fillColor: [255, 255, 255] }, // White rows
                    margin: { top: 10, bottom: 10, left: 10, right: 10 } // Reduced margin for max width
                });

                return doc.lastAutoTable.finalY + 10; // Return new starting Y position
            };

            // 4. Generate Tables for Sections (Warehouse, OPY, Admin)
            sectionsToReport.forEach(section => {
                finalY = generateSectionTable(section, groupedData[section] || [], finalY);
            });

            // 4b. Generate table for 'Others' (if any)
            if (groupedData['Others'] && groupedData['Others'].length > 0) {
                finalY = generateSectionTable('Others / Uncategorized', groupedData['Others'], finalY);
            }

            // 5. Overall Summary Section
            doc.setFontSize(14);
            doc.text('Overall Financial Summary (Filtered Records)', 14, finalY);

            doc.autoTable({
                startY: finalY + 5,
                head: [['Total Installation Cost (AED)', 'Total Renewal Cost (AED)', 'Total Lifetime Cost (AED)']],
                body: [
                    [
                        totalInstallCostSummary.toFixed(2),
                        totalRenewalCostSummary.toFixed(2),
                        (totalInstallCostSummary + totalRenewalCostSummary).toFixed(2)
                    ]
                ],
                theme: 'grid',
                styles: { cellPadding: 3, textColor: [0, 0, 0], fontStyle: 'bold' },
                headStyles: { fillColor: [44, 62, 80], textColor: 255 },
                alternateRowStyles: { fillColor: [230, 230, 230] },
                bodyStyles: { fillColor: [255, 255, 255] },
                margin: { left: 14, right: 14 }
            });

            // --- Save ---
            doc.save(`Aman_Financial_Report_${new Date().toISOString().split('T')[0]}.pdf`);
        }

        function checkValidityFilter(item, filters) {
            const validityObj = getValidityStatus(item.expiryDate);
            const text = validityObj.text;
            const val = filters.validity;
            if (val === 'All') return true;
            if (val === 'Expired - All') return text === 'Expired';
            if (val === 'Expired - Critical') return text === 'Expired' && validityObj.daysLeft <= -90;
            if (val === 'Expired - High') return text === 'Expired' && validityObj.daysLeft > -90 && validityObj.daysLeft <= -30;
            if (val === 'Expired - Medium') return text === 'Expired' && validityObj.daysLeft > -30;
            if (val === 'Expired') return text === 'Expired'; // Fallback for standard filter
            return text === val;
        }

        function handleDownloadReport(type, exportFilters = null) {
            const { jsPDF } = window.jspdf;
            const isCivilDefence = type === 'Civil Defence';
            // Aman report uses landscape to fit all property columns
            const doc = isCivilDefence ? new jsPDF() : new jsPDF('landscape', 'mm', 'a4');

            const dataArray = type === 'Civil Defence' ? cdCerts : amanCerts;
            const filters = exportFilters || currentFilters[type] || { validity: 'All', phase: 'All', workflow: 'All', search: '' };

            const getLower = (item, field) => String(item[field] || '').toLowerCase();

            // 1. Filter Data
            const projectData = dataArray.filter(c => (c.project || 'Main Project') === currentProject);

            const reportData = projectData.filter(item => {
                const validityMatch = checkValidityFilter(item, filters);
                let searchMatch = !filters.search;
                if (filters.search) {
                    const searchTerm = filters.search.toLowerCase();
                    if (type === 'Aman Certificate') {
                        searchMatch = (getLower(item, 'propertyNumber').includes(searchTerm)) ||
                            (getLower(item, 'accountId').includes(searchTerm)) ||
                            (getLower(item, 'recordId').includes(searchTerm)) ||
                            (getLower(item, 'deviceId').includes(searchTerm)) ||
                            (getLower(item, 'serialNumber').includes(searchTerm));
                    } else {
                        searchMatch = (getLower(item, 'propertyNumber').includes(searchTerm));
                    }
                }
                const phaseMatch = filters.phase === 'All' || item.phase === filters.phase;
                const workflowMatch = filters.workflow === 'All' || item.workflowStatus === filters.workflow;
                return validityMatch && searchMatch && phaseMatch && workflowMatch;
            });

            if (reportData.length === 0) {
                showModal("Report Generation Failed", "<p class='text-yellow-400'>No data to report based on the current filters.</p>");
                return;
            }

            // 2. Sort Data by Priority (Expired Days) then Property Number
            reportData.sort((a, b) => {
                const aStatus = getValidityStatus(a.expiryDate);
                const bStatus = getValidityStatus(b.expiryDate);
                
                if (aStatus.daysLeft !== null && bStatus.daysLeft !== null) {
                    if (aStatus.daysLeft !== bStatus.daysLeft) {
                        return aStatus.daysLeft - bStatus.daysLeft; // Ascending (most negative first)
                    }
                } else if (aStatus.daysLeft !== null) {
                    return -1;
                } else if (bStatus.daysLeft !== null) {
                    return 1;
                }
                
                return String(a.propertyNumber).localeCompare(String(b.propertyNumber), undefined, { numeric: true, sensitivity: 'base' });
            });

            // 3. Setup PDF
            const reportDate = new Date().toLocaleDateString('en-GB');
            const pageWidth = doc.internal.pageSize.getWidth();

            if (!isCivilDefence) {
                // Aman — teal landscape header banner
                doc.setFillColor(22, 160, 133);
                doc.rect(0, 0, pageWidth, 20, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(13);
                doc.setFont(undefined, 'bold');
                doc.text(`Aman Certificate Report — ${currentProject}`, 14, 13);
                doc.setFontSize(9);
                doc.setFont(undefined, 'normal');
                doc.text(`Generated: ${reportDate}  |  Records: ${reportData.length}`, pageWidth - 14, 13, { align: 'right' });
                doc.setTextColor(0, 0, 0);
            } else {
                doc.setFontSize(18);
                doc.text(`${type} Status Report - ${currentProject}`, 14, 22);
                doc.setFontSize(11);
                doc.text(`Generated on: ${reportDate}`, 14, 30);
            }

            let finalY = isCivilDefence ? 35 : 25;

            // 4. Define Helper for Adding Sections
            const addSection = (title, sectionData) => {
                if (sectionData.length === 0) return;

                // Check page break for Main Header
                const pageH = doc.internal.pageSize.getHeight();
                if (finalY > pageH - 40) {
                    doc.addPage();
                    finalY = 20;
                }

                // --- Render Main Status Header ---
                doc.setFontSize(14);
                doc.setFont(undefined, 'bold');
                if (title.includes("Expired")) doc.setTextColor(220, 53, 69); // Red
                else if (title.includes("Near")) doc.setTextColor(255, 193, 7); // Orange/Yellow
                else if (title.includes("Valid")) doc.setTextColor(40, 167, 69); // Green
                else if (title.includes("Installation")) doc.setTextColor(59, 130, 246); // Blue
                else if (title.includes("AMC")) doc.setTextColor(16, 185, 129); // Greenish
                else doc.setTextColor(0, 0, 0); // Black

                doc.text(title, 14, finalY + 10);
                doc.setTextColor(0, 0, 0); // Reset
                doc.setFont(undefined, 'normal');
                finalY += 15;

                // --- Group by Property Type ---
                // Map to standardize keys
                const grouped = { 'Warehouse': [], 'OPY': [], 'Admin': [], 'Others': [] };
                sectionData.forEach(item => {
                    const raw = (item.propertyType || '').toLowerCase().replace(/\s/g, '');
                    let key = 'Others';
                    if (raw.includes('warehouse')) key = 'Warehouse';
                    else if (raw.includes('opy') || raw.includes('openyard')) key = 'OPY';
                    else if (raw.includes('admin')) key = 'Admin';
                    grouped[key].push(item);
                });

                // --- Render Sub-Tables ---
                ['Warehouse', 'OPY', 'Admin', 'Others'].forEach(typeKey => {
                    const subData = grouped[typeKey];
                    if (subData.length === 0) return;

                    // Check page break for Sub Table
                    if (finalY > doc.internal.pageSize.getHeight() - 40) {
                        doc.addPage();
                        if (!isCivilDefence) {
                            // repeat thin header on new page
                            doc.setFillColor(22, 160, 133);
                            doc.rect(0, 0, pageWidth, 10, 'F');
                            doc.setTextColor(255, 255, 255);
                            doc.setFontSize(8);
                            doc.text(`Aman Report  |  ${currentProject}  |  ${reportDate}`, 14, 7);
                            doc.setTextColor(0, 0, 0);
                            finalY = 14;
                        } else {
                            finalY = 20;
                        }
                    }

                    // Sub-Header
                    doc.setFontSize(12);
                    doc.setFont(undefined, 'bold');
                    doc.setTextColor(80, 80, 80); // Dark Gray
                    doc.text(`Type: ${typeKey}`, 14, finalY + 5);
                    doc.setTextColor(0, 0, 0);
                    doc.setFont(undefined, 'normal');

                    // Prepare Body
                    // Note: 'Type' column removed as it is now redundant due to grouping

                    let head = ['Property', 'Expiry', 'Status', 'Workflow'];
                    let body = [];

                    if (isCivilDefence) {
                        head = ['Property', 'Issue Date', 'Expiry', 'AMC Expiry', 'Status', 'Workflow'];
                        body = subData.map(c => {
                            let workflowText = c.workflowStatus || 'N/A';
                            if (c.workflowStatus === 'Inspection Date' && c.inspectionDate) {
                                workflowText = `Inspection: ${formatDate(c.inspectionDate)}`;
                            }
                            return [
                                c.propertyNumber,
                                formatDate(c.issueDate),
                                formatDate(c.expiryDate),
                                (c.amcOnly === 'on' || c.amcOnly === true) ? (formatDate(c.amcExpiryDate) || 'Not set') : '—',
                                getValidityStatus(c.expiryDate).text,
                                workflowText
                            ];
                        });
                    } else {
                        // Aman — all property fields, landscape
                        head = ['Prop. No.', 'Phase', 'Account ID', 'Record ID', 'Device ID', 'Serial No.', 'Expiry Date', 'Status', 'Workflow', 'Notes'];
                        body = subData.map(c => [
                            c.propertyNumber || '—',
                            c.phase          || '—',
                            c.accountId      || '—',
                            c.recordId       || '—',
                            c.deviceId       || '—',
                            c.serialNumber   || '—',
                            formatDate(c.expiryDate),
                            getValidityStatus(c.expiryDate).text,
                            c.workflowStatus || '—',
                            (Array.isArray(c.notes) ? c.notes.map(n => `[${formatDate(n.date)}] ${n.text}`).join(' | ') : (c.notes || ''))
                        ]);
                    }

                    const amanColStyles = isCivilDefence ? {} : {
                        0: { cellWidth: 22, fontStyle: 'bold' },
                        1: { cellWidth: 16, halign: 'center' },
                        2: { cellWidth: 30 },
                        3: { cellWidth: 28 },
                        4: { cellWidth: 28 },
                        5: { cellWidth: 30 },
                        6: { cellWidth: 24, halign: 'center' },
                        7: { cellWidth: 22, halign: 'center' },
                        8: { cellWidth: 30 },
                        9: { cellWidth: 26, textColor: [100,100,100], fontStyle: 'italic' }
                    };

                    doc.autoTable({
                        startY: finalY + 8,
                        head: [head],
                        body: body,
                        theme: 'grid',
                        headStyles: {
                            fillColor: isCivilDefence ? [41, 128, 185] : [22, 160, 133],
                            textColor: 255,
                            fontStyle: 'bold',
                            fontSize: isCivilDefence ? 9 : 7.5,
                            halign: 'center',
                            cellPadding: 2
                        },
                        styles: {
                            fontSize: isCivilDefence ? 9 : 7,
                            cellPadding: 1.8,
                            lineColor: [180, 180, 180],
                            lineWidth: 0.2,
                            valign: 'middle',
                            overflow: 'linebreak'
                        },
                        columnStyles: amanColStyles,
                        alternateRowStyles: { fillColor: [245, 250, 252] },
                        bodyStyles: { fillColor: [255, 255, 255] },
                        margin: { top: 20, left: isCivilDefence ? 14 : 10, right: isCivilDefence ? 14 : 10 }
                    });

                    finalY = doc.lastAutoTable.finalY + 10;
                });

                finalY += 5; // Extra spacing after a status section
            };

            // 5. Categorize Data (Buckets)
            const expired = [];
            const nearExpiry = [];
            const installation = [];
            const amcReady = [];
            const valid = [];
            const others = [];

            reportData.forEach(c => {
                const status = getValidityStatus(c.expiryDate).text;
                if (status === 'Expired') {
                    expired.push(c);
                } else if (status === 'Near Expiry') {
                    nearExpiry.push(c);
                } else if (!isCivilDefence && c.workflowStatus === 'Installation in Progress') {
                    installation.push(c);
                } else if (isCivilDefence && c.workflowStatus === 'AMC ready') {
                    amcReady.push(c);
                } else if (status === 'Valid' || status === 'New') {
                    valid.push(c);
                } else {
                    others.push(c);
                }
            });

            // 6. Render Grouped Sections
            addSection(`${type} - Expired Certificates`, expired);
            addSection(`${type} - Near Expiry`, nearExpiry);

            if (isCivilDefence) {
                addSection(`${type} - AMC Ready`, amcReady);
            } else {
                addSection(`${type} - Installation in Progress`, installation);
            }

            addSection(`${type} - Valid Certificates`, valid);
            addSection(`${type} - Other Records`, others);

            if (filters.validity === 'All') {
                const allUnified = getUnifiedProperties();
                const missingPropsRaw = allUnified.filter(p => p.project === currentProject && !p[isCivilDefence ? 'cd' : 'aman']);
                if (missingPropsRaw.length > 0) {
                    const missingCerts = missingPropsRaw.map(p => ({
                        propertyNumber: p.propertyNumber,
                        phase: p.phase,
                        propertyType: p.propertyType,
                        expiryDate: '',
                        workflowStatus: 'Not Registered',
                        issueDate: '',
                        amcOnly: false,
                        amcExpiryDate: '',
                        accountId: '',
                        deviceId: '',
                        serialNumber: ''
                    }));
                    addSection(`Properties Missing from ${type}`, missingCerts);
                }
            }

            doc.save(`${type.replace(/\s/g, '_')}_Report_${currentProject}_${new Date().toISOString().split('T')[0]}.pdf`);
        }


        function handleExportData(type, data) {

            link.download = `${type.replace(/\s/g, '_')}_${currentProject.replace(/\s/g, '_')}_Export.json`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function handleShowImportModal(type) {
            const modalContent = `
                <p class="text-gray-300 mb-4">Paste your JSON data below. Data must be an array of certificate objects for the current project:</p>
                <textarea id="import-json-data" rows="10" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white focus:ring-2 focus:ring-teal-500 font-mono text-sm" placeholder='[{"propertyNumber": "W123", "phase": "Phase 1", ...}, {"propertyNumber": "W124", "phase": "Phase 1", ...}]'></textarea>

                    <button id="import-confirm-btn" class="px-6 py-2 rounded-lg bg-teal-600 text-white hover:bg-teal-500 transition-colors font-semibold">Import Data</button>
                </div>
            `;

            showModal(`Import ${type} Data for ${currentProject}`, modalContent, () => {
                document.getElementById('import-cancel-btn').addEventListener('click', hideModal);
                document.getElementById('import-confirm-btn').addEventListener('click', () => {
                    const jsonString = document.getElementById('import-json-data').value;
                    try {
                        const importedData = JSON.parse(jsonString);
                        if (!Array.isArray(importedData)) {
                            throw new Error("Data must be a JSON array.");
                        }

                        let successfulImports = 0;
                        let failedImports = 0;

                        importedData.forEach(newCertData => {
                            if (!newCertData.propertyNumber) {
                                failedImports++;
                                return;
                            }

                            // 1. Ensure it doesn't duplicate an existing ID OR propertyNumber in this project
                            const dataArray = type === 'Civil Defence' ? cdCerts : amanCerts;
                            const isDuplicate = dataArray.some(cert =>
                                (cert.id === newCertData.id) ||
                                (cert.propertyNumber.trim().toLowerCase() === newCertData.propertyNumber.trim().toLowerCase() && (cert.project || 'Main Project') === currentProject)
                            );

                            if (isDuplicate) {
                                failedImports++;
                                return;
                            }

                            // 2. Assign default and current project values if missing/not provided
                            newCertData.project = currentProject;
                            newCertData.id = newCertData.id || String(Date.now()) + '-' + Math.random().toString(36).substring(2, 6);
                            newCertData.createdAt = newCertData.createdAt || new Date().toISOString();

                            // 3. Merge or push into master array
                            if (type === 'Civil Defence') {
                                cdCerts.push(newCertData);
                            } else {
                                amanCerts.push({
                                    ...newCertData,
                                    renewalHistory: newCertData.renewalHistory || []
                                });
                            }
                            successfulImports++;
                        });

                        saveDataToFirebase();
                        hideModal();
                        render();
                        showModal("Import Complete", `<p class='text-green-400'>Successfully imported ${successfulImports} new records. ${failedImports > 0 ? `<span class="text-yellow-400">(${failedImports} skipped due to missing Property Number or duplication.)</span>` : ''}</p>`);

                    } catch (error) {
                        showModal("Import Error", `<p class='text-red-400'>Invalid JSON format or data structure. Please ensure it's a valid JSON array of objects. Error: ${error.message}</p>`);
                    }
                });
            });
        }


        // --- Global Form Save Handler (Moved outside handleShowForm to fix scope error) ---
        function handleSave(e, type, id) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);

            let data = Object.fromEntries(formData.entries());
            data.amcOnly = formData.get('amcOnly') === 'on';

            try {
                data.notes = JSON.parse(formData.get('notes') || '[]');
            } catch(e) {
                data.notes = [];
            }

            handleOperation(type, id ? 'update' : 'add', id, data);
        }

        // --- Global CRUD Operation Handler (Moved inside module scope) ---
        function handleOperation(type, operation, id, data) {
            if (operation === 'delete') {
                // Replaced confirm() with modal
                showModal("Confirm Deletion", "<p class='text-gray-300'>Are you sure you want to permanently delete this certificate record?</p><div class='flex justify-end gap-4 mt-6'><button id='confirm-delete' class='px-6 py-2 rounded-lg bg-red-600 text-white hover:bg-red-500 transition-colors font-semibold'>Delete</button><button id='cancel-delete' class='px-6 py-2 rounded-lg bg-gray-600 text-white hover:bg-gray-500 transition-colors font-semibold'>Cancel</button></div>", () => {
                    document.getElementById('confirm-delete').addEventListener('click', () => {
                        let certToDelete;
                        if (type === 'Civil Defence') {
                            certToDelete = cdCerts.find(c => c.id === id);
                            cdCerts = cdCerts.filter(c => c.id !== id);
                        } else {
                            certToDelete = amanCerts.find(c => c.id === id);
                            amanCerts = amanCerts.filter(c => c.id !== id);
                        }
                        
                        if (certToDelete) {
                            certToDelete.isDeleted = true;
                            certToDelete.deletedAt = new Date().toISOString();
                            certToDelete.deletedBy = auth.currentUser?.email || 'Unknown';
                            deletedCerts.push(certToDelete);
                        }
                        
                        saveDataToFirebase(); // Cloud Save
                        render();
                        hideModal();
                    });
                    document.getElementById('cancel-delete').addEventListener('click', hideModal);
                });
                return;
            }

            let dataArray = type === 'Civil Defence' ? cdCerts : amanCerts;

            // Determine Project
            const entryProject = (data && data.project) ? data.project : currentProject;

            const propertyNumber = data.propertyNumber.trim();

            if (!propertyNumber) {
                showModal("Validation Error", "<p class='text-red-400'>Property Number cannot be empty.</p>");
                return;
            }

            // Validation: Expiry Date > Issue Date
            if (data.issueDate && data.expiryDate) {
                if (new Date(data.expiryDate) <= new Date(data.issueDate)) {
                    showModal("Validation Error", "<p class='text-red-400'>Error: Expiry Date must be later than the Issue Date.</p>");
                    return;
                }
            }

            // Validation: Duplicate Aman Device ID
            if (type === 'Aman Certificate' && data.deviceId) {
                const excludeId = operation === 'update' ? id : null;
                const dupeProp = window.checkAmanDuplicateDeviceId ? window.checkAmanDuplicateDeviceId(data.deviceId, excludeId) : null;
                if (dupeProp) {
                    showModal("Validation Error", `<p class='text-red-400'>Error: Device ID "${data.deviceId}" is already in use by Property ${dupeProp}. Device IDs must be unique.</p>`);
                    return;
                }
            }

            if (operation === 'add') {
                // Check duplicate WITHIN current project - THIS IS THE CASE-INSENSITIVE VALIDATION
                const isDuplicate = dataArray.some(cert => cert.propertyNumber.trim().toLowerCase() === propertyNumber.toLowerCase() && (cert.project || 'Main Project') === entryProject);
                if (isDuplicate) {
                    showModal("Validation Error", `<p class='text-red-400'>Error: A certificate for Property Number "${propertyNumber}" already exists in this project. (It may be stored with different capitalization, please search for it to find it.)</p>`);
                    return;
                }

                // Conditionally build Aman-specific data object
                const amanFields = type === 'Aman Certificate' ? {
                    deviceId: data.deviceId || '',
                    serialNumber: data.serialNumber || '',
                    // NEW: Initialize renewalHistory on creation
                    renewalHistory: data.renewalHistory || []
                } : {};

                let newCert = {
                    ...data,
                    propertyNumber,
                    id: String(Date.now()) + '-' + Math.random().toString(36).substring(2, 6),
                    createdAt: new Date().toISOString(),
                    createdBy: auth.currentUser?.email || 'Unknown',
                    lastUpdated: new Date().toISOString(),
                    lastUpdatedBy: auth.currentUser?.email || 'Unknown',
                    project: entryProject,
                    // Spread Aman fields only if type is Aman
                    ...amanFields,
                    // Link Field
                    certificateLink: data.certificateLink || ''
                };

                // BUG FIX: Check if workflowStatus was passed (from import), otherwise use default logic
                if (type === 'Civil Defence') {
                    if (data.workflowStatus) {
                        newCert.workflowStatus = data.workflowStatus;
                    } else {
                        newCert.workflowStatus = data.amcOnly ? 'AMC ready' : 'Renewal Pending';
                    }

                    if (data.amcOnly) {
                        newCert.issueDate = '';
                        newCert.expiryDate = '';
                    }
                } else if (type === 'Aman Certificate') {
                    if (data.workflowStatus) {
                        newCert.workflowStatus = data.workflowStatus;
                    } else {
                        newCert.workflowStatus = 'Installation in Progress';
                    }
                }
                dataArray.push(newCert);
            } else if (operation === 'update') {
                const isDuplicate = dataArray.some(cert => cert.propertyNumber.trim().toLowerCase() === propertyNumber.toLowerCase() && cert.id !== id && (cert.project || 'Main Project') === entryProject);
                if (isDuplicate) {
                    showModal("Validation Error", `<p class='text-red-400'>Error: Another certificate with Property Number "${propertyNumber}" already exists in this project.</p>`);
                    return;
                }
                const certIndex = dataArray.findIndex(c => c.id === id);
                if (certIndex !== -1) {
                    const originalCert = { ...dataArray[certIndex] };

                    // HISTORY LOGIC ADDED HERE (For Old Expiry/Link)
                    if (!historyData[id]) {
                        historyData[id] = [];
                    }
                    // Only push old version if expiry or link changed
                    if (originalCert.expiryDate !== data.expiryDate || originalCert.certificateLink !== data.certificateLink) {
                        historyData[id].push({
                            ...originalCert,
                            archivedAt: new Date().toISOString(),
                            // Keep only relevant historical fields to save space
                            // FIX: Ensure no undefined values for Firebase set()
                            expiryDate: originalCert.expiryDate || '',
                            certificateLink: originalCert.certificateLink || ''
                        });
                    }

                    // FIX 4: Since phase and propertyType are now editable, we don't force them back from originalCert.
                    let updatedCert = { 
                        ...originalCert, 
                        ...data, 
                        propertyNumber, 
                        lastUpdated: new Date().toISOString(),
                        lastUpdatedBy: auth.currentUser?.email || 'Unknown' 
                    };

                    if (data.isRenewal === 'true' || updatedCert.workflowStatus === 'Certificate Ready') {
                        updatedCert.workflowStatus = 'Certificate Ready';
                        updatedCert.inspectionDate = '';
                        updatedCert.amcOnly = false;
                    }

                    if (type === 'Civil Defence' && data.amcOnly === true && updatedCert.workflowStatus !== 'Certificate Ready') {
                        updatedCert.workflowStatus = 'AMC ready';
                        updatedCert.issueDate = '';
                        updatedCert.expiryDate = '';
                    }

                    // Aman Fields handling on update
                    if (type === 'Aman Certificate') {
                        updatedCert.accountId = data.accountId || '';
                        updatedCert.recordId = data.recordId || '';
                        updatedCert.deviceId = data.deviceId || '';
                        updatedCert.serialNumber = data.serialNumber || '';
                        // Preserve the renewalHistory array
                        updatedCert.renewalHistory = originalCert.renewalHistory || [];
                    } else {
                        // Ensure CD certs DO NOT have these properties when saving to Firebase
                        delete updatedCert.deviceId;
                        delete updatedCert.serialNumber;
                        delete updatedCert.renewalHistory;
                    }

                    // Update certificate link
                    updatedCert.certificateLink = data.certificateLink || '';

                    dataArray[certIndex] = updatedCert;
                }
            }

            saveDataToFirebase(); // Cloud Save
            hideModal();
            render();
            updateNotifications(); // Update notifications after saving data
        }

        function handleBulkEmailCD() {
            const expired = cdCerts.filter(c => getValidityStatus(c.expiryDate).text === 'Expired' && c.workflowStatus === 'Renewal Pending');
            if (expired.length === 0) return;

            let propList = expired.map(c => `- Property ${c.propertyNumber} (Expired: ${formatDate(c.expiryDate)})`).join('\n');
            const body = `Hello Team,\n\nPlease note that the following Civil Defence certificates have expired:\n\n${propList}\n\nPlease initiate the renewal process for these properties, and reply with the application details and inspection schedules once you receive the dates.\n\nThank you.`;
            const subject = `Urgent: Bulk Renewal Required for ${expired.length} Properties`;
            const toEmail = window.localStorage.getItem('fireAmcEmail') || 'fireamc@example.com';

            const mailtoLink = `mailto:${toEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            const link = document.createElement('a');
            link.href = mailtoLink;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            expired.forEach(c => c.workflowStatus = 'Informed Fire team');
            saveDataToFirebase();
            render();
            showToast("Bulk email generated and statuses updated to 'Informed Fire team'.");
        }

            saveDataToFirebase();
            render();
            showToast(`Updated ${expired.length} certificates to 'Informed Fire team'.`);
        }
