            pageEl.querySelector(`#search-input-unified`).addEventListener('input', (e) => {
                currentFilters.Properties.search = e.target.value;
                renderAllTables(data);
            });

            pageEl.querySelectorAll(`.filter-select`).forEach(select => {
                select.addEventListener('change', (e) => {
                    const filterType = e.target.dataset.filterType;
                    currentFilters.Properties[filterType] = e.target.value;
                    renderAllTables(data);
                });
            });
        }

        function renderAllTables(data) {
            const filters = currentFilters.Properties;
            const PROPERTY_SECTIONS = { 'Warehouse': 'warehouse', 'OPY': 'opy', 'Admin': 'admin', 'Others': 'others' };
            const getLower = (val) => String(val || '').toLowerCase();

            let filteredData = data.filter(item => {
                let searchMatch = !filters.search;
                if (filters.search) {
                    const term = filters.search.toLowerCase();
                    searchMatch = getLower(item.propertyNumber).includes(term) ||
                        (item.aman && getLower(item.aman.accountId).includes(term)) ||
                        (item.aman && getLower(item.aman.deviceId).includes(term)) ||
                        (item.aman && getLower(item.aman.serialNumber).includes(term));
                }
                const phaseMatch = filters.phase === 'All' || item.phase === filters.phase;
                return searchMatch && phaseMatch;
            });

            filteredData.sort((a, b) => String(a.propertyNumber).localeCompare(String(b.propertyNumber), undefined, { numeric: true, sensitivity: 'base' }));

            const groupedData = filteredData.reduce((acc, item) => {
                let itemType = item.propertyType ? item.propertyType.toLowerCase().replace(/\s/g, '') : 'others';
                if (itemType.includes('openyard')) itemType = 'opy';
                if (itemType.includes('adminbuilding')) itemType = 'admin';
                if (itemType === 'warehouse' || itemType === 'warehouses') itemType = 'warehouse';
                if (itemType === 'admin') itemType = 'admin';
                if (itemType === 'opy') itemType = 'opy';

                let section = 'Others';
                for (const key in PROPERTY_SECTIONS) {
                    if (PROPERTY_SECTIONS[key] === itemType) { section = key; break; }
                }
                if (!acc[section]) acc[section] = [];
                acc[section].push(item);
                return acc;
            }, { 'Warehouse': [], 'OPY': [], 'Admin': [], 'Others': [] });

            Object.keys(PROPERTY_SECTIONS).forEach(sectionTitle => {
                renderTableSection(sectionTitle, groupedData[sectionTitle] || []);
            });
        }

        function renderTableSection(sectionTitle, data) {
            const tableBody = document.getElementById(`table-body-${sectionTitle.replace(/\s+/g, '-')}`);
            if (!tableBody) return;

            const isEditor = isAuthorizedEditor();
            const renderPhaseColumn = sectionTitle === 'Warehouse';
            let totalColumns = 6;
            if (renderPhaseColumn) totalColumns += 1;

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="${totalColumns}" class="text-center py-10 text-gray-400 bg-gray-800/50">No properties in this section matching criteria.</td></tr>`;
                return;
            }

            tableBody.innerHTML = data.map(item => {
                // Determine CD Status
                let cdStatusBadge = `<span class="text-gray-600 text-xs">—</span>`;
                let cdWorkflowBadge = `<span class="text-gray-600 text-xs">—</span>`;
                if (item.cd) {
                    const cdVal = getValidityStatus(item.cd.expiryDate);
                    cdStatusBadge = `<div class="flex flex-col gap-1"><span>${formatDate(item.cd.expiryDate)}</span>${generateStatusBadge(cdVal)}</div>`;
                    cdWorkflowBadge = generateWorkflowBadge(item.cd.workflowStatus, item.cd.inspectionDate, 'Civil Defence');
                }

                // Determine Aman Status
                let amanStatusBadge = `<span class="text-gray-600 text-xs">—</span>`;
                let amanWorkflowBadge = `<span class="text-gray-600 text-xs">—</span>`;
                if (item.aman) {
                    const amanVal = getValidityStatus(item.aman.expiryDate);
                    amanStatusBadge = `<div class="flex flex-col gap-1"><span>${formatDate(item.aman.expiryDate)}</span>${generateStatusBadge(amanVal)}</div>`;
                    amanWorkflowBadge = generateWorkflowBadge(item.aman.workflowStatus, null, 'Aman Certificate');
                }

                return `
                <tr class="bg-gray-800/50 border-b border-gray-700 hover:bg-gray-700/70 transition-colors">
                    <td class="px-3 py-3 text-sm font-bold text-teal-300 sticky left-0 bg-gray-800 border-r border-gray-700 w-32 max-w-[8rem] truncate" title="${item.propertyNumber}">${item.propertyNumber}</td>
                    ${renderPhaseColumn ? `<td class="px-3 py-3 text-sm text-gray-300 truncate max-w-[6rem]">${item.phase || ''}</td>` : ''}
                    <td class="px-3 py-3 text-sm text-gray-300">${cdStatusBadge}</td>
                    <td class="px-3 py-3 text-sm">${cdWorkflowBadge}</td>
                    <td class="px-3 py-3 text-sm text-gray-300">${amanStatusBadge}</td>
                    <td class="px-3 py-3 text-sm">${amanWorkflowBadge}</td>
                    <td class="px-3 py-3 text-sm font-medium sticky right-0 bg-gray-800 border-l border-gray-700">
                        <div class="flex items-center justify-end gap-2">
                            <button class="action-btn text-blue-500 hover:text-blue-700 bg-blue-500/10 p-2 rounded hover:bg-blue-500/20" data-action="view-details" data-prop="${item.propertyNumber}" title="Workflow Manager">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                            ${isEditor ? `
                            <button class="action-btn text-teal-400 hover:text-teal-300 bg-teal-500/10 p-2 rounded hover:bg-teal-500/20" data-action="edit-unified" data-prop="${item.propertyNumber}" title="Edit Property">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path><path d="m15 5 4 4"></path></svg>
                            </button>` : ''}
                        </div>
                    </td>
                </tr>
                `}).join('');
        }

        function generateStatusBadge(status) {
            const colors = { green: "bg-green-500/20 text-green-400 border border-green-500/30", yellow: "bg-yellow-500/20 text-yellow-400 border border-yellow-500/30", red: "bg-red-500/20 text-red-400 border border-red-500/30", gray: "bg-gray-500/20 text-gray-400 border border-gray-500/30" };
            let daysLabel = '';
            if (status.daysLeft !== null && status.daysLeft !== undefined) {
                if (status.daysLeft < 0) daysLabel = `<span class="ml-1 text-[9px] font-bold text-red-300">${Math.abs(status.daysLeft)}d ago</span>`;
                else if (status.color !== 'green') daysLabel = `<span class="ml-1 text-[9px] font-bold text-yellow-300">${status.daysLeft}d left</span>`;
            }
            return `<span class="px-2 py-0.5 text-xs font-semibold rounded-full whitespace-nowrap ${colors[status.color]}">${status.text}${daysLabel}</span>`;
        }

        function generateWorkflowBadge(status, inspectionDate, type) {
            const cdColors = {
                'AMC Contract Pending':   'bg-red-500/20 text-red-400 border-red-500/30',
                'AMC Contract Applied':   'bg-orange-500/20 text-orange-400 border-orange-500/30',
                'AMC Contract Issued':    'bg-purple-500/20 text-purple-400 border-purple-500/30',
                'CD Application Submitted': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                'Inspection Scheduled':   'bg-cyan-500/20 text-cyan-400 border-cyan-500/30',
                'Inspection Failed':      'bg-red-600/30 text-red-300 border-red-600/40',
                'Certificate Ready':      'bg-green-500/20 text-green-400 border-green-500/30',
            };

            const amanColors = {
                'Application Submitted':         'bg-blue-500/20 text-blue-400 border-blue-500/30',
                'Unhealthy FACP Panel':          'bg-red-900/30 text-red-400 border-red-500/40',
                'Cert Issued (Pending Install)': 'bg-purple-500/20 text-purple-400 border-purple-500/30',
                'Inspection & Installation':     'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
                'Installation Failed':           'bg-red-600/30 text-red-300 border-red-600/40',
                'Renewal Pending':               'bg-orange-500/20 text-orange-400 border-orange-500/30',
                'Renewal Faults Pending':        'bg-red-500/20 text-red-400 border-red-500/30',
                'Active & Monitored':            'bg-green-500/20 text-green-400 border-green-500/30',
            };

            const colors = type === 'Civil Defence' ? cdColors : amanColors;

            let text = status || 'N/A';
            if (status === 'Inspection Scheduled' && inspectionDate) {
                text = `Insp: ${formatDate(inspectionDate)}`;
            }
            if (status === 'Inspection Failed') {
                text = '⚠ Insp Failed';
            }

            let pctHtml = '';
            if (status) {
                const steps = type === 'Civil Defence' ? ['AMC Contract Pending', 'AMC Contract Applied', 'AMC Contract Issued', 'CD Application Submitted', 'Inspection Scheduled', 'Certificate Ready'] : ['Application Submitted', 'Cert Issued (Pending Install)', 'Inspection & Installation', 'Renewal Pending', 'Active & Monitored'];
                let idx = steps.indexOf(status);
                if (idx === -1) {
                    if (status === 'Inspection Failed' || status === 'Unhealthy FACP Panel' || status === 'Installation Failed' || status === 'Renewal Faults Pending') {
                        idx = steps.length / 2; // Rough middle for failures
                    } else {
                        idx = steps.length - 1; // Default complete
                    }
                }
                const pct = Math.max(5, Math.round(((idx + 1) / steps.length) * 100));
                const barColor = (status.includes('Failed') || status.includes('Fault') || status.includes('Unhealthy')) ? 'bg-red-500' : (pct >= 100 ? 'bg-green-500' : 'bg-teal-400');
                pctHtml = `<div class="w-full bg-gray-700/50 rounded-full h-1 mt-1 overflow-hidden"><div class="${barColor} h-1 rounded-full transition-all" style="width: ${pct}%"></div></div>`;
            }

            return `<div class="flex flex-col max-w-[130px]"><span class="px-2 py-0.5 text-[10px] font-bold rounded-full whitespace-nowrap border text-center truncate ${colors[status] || 'bg-gray-500/20 text-gray-400 border-gray-500/30'}" title="${text}">${text}</span>${pctHtml}</div>`;
        }

        // --- Modals and Forms ---
        function showModal(title, content, onOpen = null, sizeClass = 'max-w-lg') {
            // Signal to hideModal (if it runs just before this) not to do a full render
            window._suppressHideRender = true;
            const modalContainer = document.getElementById('modal-container');
            modalContainer.innerHTML = `
                <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl w-full ${sizeClass} m-4 max-h-[90vh] flex flex-col">
                    <div class="flex items-center justify-between p-5 border-b border-gray-700 flex-shrink-0">
                        <h3 class="text-xl font-bold text-white">${title}</h3>
                        <button id="modal-close-btn" class="text-gray-400 hover:text-white transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                        </button>
                    </div>
                    <div class="p-6 overflow-y-auto">${content}</div>
                </div>`;
            modalContainer.classList.remove('hidden');
            document.getElementById('modal-close-btn').addEventListener('click', () => {
                if (window._wfFromHub) {
                    window._wfFromHub = false;
                    window._suppressHideRender = true; // Don't flash the page before hub opens
                    hideModal();
                    handleShowWorkflowHub(); // No setTimeout needed — direct call is seamless
                } else {
                    hideModal();
                }
            });
            if (onOpen) onOpen();
        }

        function hideModal() {
            const modalContainer = document.getElementById('modal-container');
            modalContainer.innerHTML = '';
            modalContainer.classList.add('hidden');
            // Only refresh the main page if we are NOT about to immediately open another modal
            if (!window._suppressHideRender) {
                render();
                updateNotifications();
            }
            window._suppressHideRender = false;
        }
        window.hideModal = hideModal;

        function handleShowWorkflowHub() {
            window._wfFromHub = false;
            const allProps = getUnifiedProperties();
            let activeWorkflows = [];

            allProps.forEach(prop => {
                if (prop.project !== currentProject) return;
                const hasCdWorkflow = prop.cd && prop.cd.workflowStatus && prop.cd.workflowStatus !== 'Certificate Ready' && prop.cd.workflowStatus !== 'AMC ready';
                const hasAmanWorkflow = prop.aman && prop.aman.workflowStatus && prop.aman.workflowStatus !== 'Active & Monitored';
                if (hasCdWorkflow || hasAmanWorkflow) {
                    const cdExpiry = hasCdWorkflow ? prop.cd.expiryDate : null;
                    const amanExpiry = hasAmanWorkflow ? prop.aman.expiryDate : null;
                    const sortExpiry = cdExpiry || amanExpiry || null;
                    const cdValidity = cdExpiry ? getValidityStatus(cdExpiry) : null;
                    const amanValidity = amanExpiry ? getValidityStatus(amanExpiry) : null;
                    // Determine tier: Critical > Urgent > Ongoing
                    let tier = 'ongoing';
                    if ((cdValidity && cdValidity.text === 'Expired') || (amanValidity && amanValidity.text === 'Expired')) tier = 'critical';
                    else if ((cdValidity && cdValidity.text === 'Near Expiry') || (amanValidity && amanValidity.text === 'Near Expiry')) tier = 'urgent';
                    activeWorkflows.push({
                        propertyNumber: prop.propertyNumber,
                        cdStatus: hasCdWorkflow ? prop.cd.workflowStatus : null,
                        cdExpiry, cdValidity,
                        amanStatus: hasAmanWorkflow ? prop.aman.workflowStatus : null,
                        amanExpiry, amanValidity,
                        sortExpiry, tier
                    });
                }
            });

            // Sort within each tier by expiry
            const sortByExpiry = (a, b) => ((a.sortExpiry || '9999') > (b.sortExpiry || '9999') ? 1 : -1);
            const critical = activeWorkflows.filter(w => w.tier === 'critical').sort(sortByExpiry);
            const urgent   = activeWorkflows.filter(w => w.tier === 'urgent').sort(sortByExpiry);
            const ongoing  = activeWorkflows.filter(w => w.tier === 'ongoing').sort(sortByExpiry);
            const total = activeWorkflows.length;

            function buildRow(wf) {
                let cdStatusBadge = `<span class="text-gray-600 text-xs">—</span>`;
                let cdWorkflowBadge = `<span class="text-gray-600 text-xs">—</span>`;
                if (wf.cdStatus) {
                    cdStatusBadge = wf.cdValidity ? `<div class="flex flex-col gap-1"><span>${formatDate(wf.cdExpiry)}</span>${generateStatusBadge(wf.cdValidity)}</div>` : '';
                    cdWorkflowBadge = generateWorkflowBadge(wf.cdStatus, null, 'Civil Defence');
                }
                
                let amanStatusBadge = `<span class="text-gray-600 text-xs">—</span>`;
                let amanWorkflowBadge = `<span class="text-gray-600 text-xs">—</span>`;
                if (wf.amanStatus) {
                    amanStatusBadge = wf.amanValidity ? `<div class="flex flex-col gap-1"><span>${formatDate(wf.amanExpiry)}</span>${generateStatusBadge(wf.amanValidity)}</div>` : '';
                    amanWorkflowBadge = generateWorkflowBadge(wf.amanStatus, null, 'Aman Certificate');
                }

                const rowBorder = wf.tier === 'critical' ? 'border-l-4 border-l-red-500' : wf.tier === 'urgent' ? 'border-l-4 border-l-yellow-500' : 'border-l-4 border-l-teal-600';

                return `
                <tr class="hub-row bg-gray-800/50 border-b border-gray-700 hover:bg-gray-700/70 transition-colors cursor-pointer group" data-prop-num="${wf.propertyNumber}" onclick="window._wfFromHub = true; window._suppressHideRender = true; hideModal(); handleShowWorkflowManager('${wf.propertyNumber}');">
                    <td class="px-3 py-3 text-sm font-bold text-teal-300 sticky left-0 bg-gray-800 ${rowBorder} w-32 max-w-[8rem] truncate" title="${wf.propertyNumber}">${wf.propertyNumber}</td>
                    <td class="px-3 py-3 text-sm text-gray-300">${cdStatusBadge}</td>
                    <td class="px-3 py-3 text-sm">${cdWorkflowBadge}</td>
                    <td class="px-3 py-3 text-sm text-gray-300">${amanStatusBadge}</td>
                    <td class="px-3 py-3 text-sm">${amanWorkflowBadge}</td>
                    <td class="px-3 py-3 text-sm font-medium sticky right-0 bg-gray-800 border-l border-gray-700">
                        <div class="flex justify-end opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-teal-400"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                        </div>
                    </td>
                </tr>
                `;
            }

            function buildTier(label, icon, items, colorClass, emptyMsg) {
                return `<div class="mb-6">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="text-base font-black uppercase tracking-widest ${colorClass} flex items-center gap-2">${icon} ${label}</span>
                        <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-gray-700 text-gray-300">${items.length}</span>
                    </div>
                    ${items.length > 0 ? `
                    <div class="overflow-x-auto rounded-xl border border-gray-700/50 shadow-lg">
                        <table class="min-w-full divide-y divide-gray-700/50">
                            <thead class="bg-gray-800/80">
                                <tr>
                                    <th scope="col" class="px-3 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider sticky left-0 bg-gray-800/90 z-10 border-r border-gray-700 w-32">Property</th>
                                    <th scope="col" class="px-3 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider">CD Status</th>
                                    <th scope="col" class="px-3 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider">CD Workflow</th>
                                    <th scope="col" class="px-3 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider">Aman Status</th>
                                    <th scope="col" class="px-3 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider">Aman Workflow</th>
                                    <th scope="col" class="px-3 py-3 text-right text-xs font-bold text-gray-400 uppercase tracking-wider sticky right-0 bg-gray-800/90 z-10 border-l border-gray-700 w-16"></th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-700/50 bg-gray-900/50" id="tier-${label.replace(/\s/g,'-').toLowerCase()}">
                                ${items.map(buildRow).join('')}
                            </tbody>
                        </table>
                    </div>
                    ` : `<div class="px-4 py-3 text-sm text-gray-500 italic">${emptyMsg}</div>`}
                </div>`;
            }

            const criticalTier = buildTier('Critical', '🔴', critical, 'text-red-400', 'No expired certificates.');
            const urgentTier   = buildTier('Urgent', '🟠', urgent, 'text-yellow-400', 'No near-expiry certificates.');
            const ongoingTier  = buildTier('Ongoing', '🟢', ongoing, 'text-teal-400', 'No active mid-workflow items.');

            const emptyState = `<div class="flex flex-col items-center justify-center py-24">
                <div class="w-20 h-20 bg-green-900/20 border border-green-700/30 rounded-full flex items-center justify-center mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <h3 class="text-2xl font-black text-white mb-2">All Clear!</h3>
                <p class="text-gray-400 text-center max-w-sm">No active workflows or pending renewals. All properties are up to date.</p>
            </div>`;

            const contentHTML = `
                <div class="flex flex-col h-full">
                    <!-- Header bar -->
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-5 mb-5 border-b border-gray-700/60 flex-shrink-0">
                        <div>
                            <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-400">Active Workflows Hub</h2>
                            <p class="text-sm text-gray-400 mt-0.5">${currentProject} &mdash; ${total} active workflow${total !== 1 ? 's' : ''} requiring attention</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="relative">
                                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                <input type="search" id="hub-search" placeholder="Search property..." class="bg-gray-900 border border-gray-700 rounded-lg pl-9 pr-4 py-2 text-sm text-white placeholder-gray-500 focus:ring-2 focus:ring-teal-500 focus:outline-none w-56">
                            </div>
                            <div class="flex gap-2 text-xs font-bold">
                                <span class="px-2.5 py-1.5 rounded-lg bg-red-900/30 text-red-400 border border-red-800/40">${critical.length} Critical</span>
                                <span class="px-2.5 py-1.5 rounded-lg bg-yellow-900/30 text-yellow-400 border border-yellow-800/40">${urgent.length} Urgent</span>
                                <span class="px-2.5 py-1.5 rounded-lg bg-teal-900/30 text-teal-400 border border-teal-800/40">${ongoing.length} Ongoing</span>
                            </div>
                        </div>
                    </div>
                    <!-- Scrollable tiers -->
                    <div id="hub-tiers" class="flex-1 overflow-y-auto pr-1" style="max-height: calc(100dvh - 200px);">
                        ${total > 0 ? criticalTier + urgentTier + ongoingTier : emptyState}
                    </div>
                </div>`;

            showModal('Active Workflows Hub', contentHTML, () => {
                const searchInput = document.getElementById('hub-search');
                if (!searchInput) return;
                searchInput.addEventListener('input', () => {
                    const term = searchInput.value.trim().toLowerCase();
                    document.querySelectorAll('.hub-row').forEach(row => {
                        row.style.display = (!term || (row.dataset.propNum || '').toLowerCase().includes(term)) ? '' : 'none';
                    });
                });
            }, '!m-0 !rounded-none !border-0 w-screen h-[100dvh] !max-w-none !max-h-[100dvh]');
        }



        // --- FIX: Add/Edit Form Modal ---



        // --- FIX: Add/Edit Form Modal ---
        window.handleShowForm = handleShowForm;
        function handleShowForm(type, id = null) {
            const isEdit = !!id;
            const dataArray = type === 'Civil Defence' ? cdCerts : amanCerts;
            const cert = isEdit ? dataArray.find(c => c.id === id) : {};

            // Normalize legacy notes string to array
            if (cert && cert.notes && typeof cert.notes === 'string') {
                cert.notes = [{ id: Date.now().toString(), text: cert.notes, date: new Date().toISOString() }];
            } else if (cert && !cert.notes) {
                cert.notes = [];
            }

            // Default values for new entries
            const defaults = {
                propertyNumber: '', phase: 'Phase 1', propertyType: 'warehouse',
                issueDate: '', expiryDate: '', notes: [], workflowStatus: '',
                amcOnly: false, certificateLink: '', inspectionDate: '',
                // Aman specific
                accountId: '', recordId: '', deviceId: '', serialNumber: '',
                paymentReportLink: ''
            };

            const formData = isEdit ? cert : defaults;

            const isCivilDefence = type === 'Civil Defence';
            const isAman = type === 'Aman Certificate';
            const workflowSteps = isCivilDefence ? CD_WORKFLOW_STEPS : AMAN_WORKFLOW_STEPS;

            // Function to normalize stored/default property type to one of the canonical keys (warehouse, opy, admin, others)
            const normalizePropertyType = (typeValue) => {
                const lower = String(typeValue || '').toLowerCase().replace(/\s/g, '');
                if (lower.includes('warehouse')) return 'warehouse';
                if (lower.includes('opy') || lower.includes('openyard')) return 'opy';
                if (lower.includes('admin') || lower.includes('adminbuilding')) return 'admin';
                return 'others';

            const normalizedCurrentType = normalizePropertyType(formData.propertyType);

            const propertyTypeOptions = {

            // --- Aman Menu (Floating: Three-dot icon) ---
            const amanMenuHtml = isAman && isEdit ? `

                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                Edit Financial Records

                        </div>

                                <input type="file" id="certFileInput" accept=".pdf,image/*" class="hidden">
                                <button type="button" id="upload-cert-btn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-sm font-semibold text-white border border-gray-600 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                                    Upload New Certificate
                                </button>
                                <span id="upload-cert-status" class="text-xs hidden"></span>
                            </div>
                        </div>
                    </div>
                    ${sectionHeader('Payment Report Document')}
                    <div class="col-span-2">
                        <input type="hidden" id="paymentReportLink" name="paymentReportLink" value="${formData.paymentReportLink || ''}">
                        <div class="flex flex-col gap-2 p-3 bg-gray-800/60 rounded-lg border border-gray-700">
                            ${formData.paymentReportLink ? `
                            <div class="flex items-center justify-between gap-2 mb-1">
                                <span class="text-xs text-gray-400 truncate flex-1" title="${formData.paymentReportLink}">
                                    📎 Current: <span class="text-teal-400">${formData.paymentReportLink.length > 40 ? formData.paymentReportLink.substring(formData.paymentReportLink.lastIndexOf('_') + 1) : formData.paymentReportLink}</span>
                                </span>
                                <button type="button" id="view-current-payment-btn" class="flex-shrink-0 text-xs px-2 py-1 rounded bg-teal-700/50 text-teal-300 hover:bg-teal-600/60 transition-colors">View Current</button>
                            </div>` : '<p class="text-xs text-gray-500 mb-1">No payment report linked yet.</p>'}
                            <div class="flex gap-2 items-center">
                                <input type="text" id="paymentReportText" placeholder="Paste URL or upload file below..." class="${inputCls} flex-1" value="${formData.paymentReportLink && formData.paymentReportLink.startsWith('http') ? formData.paymentReportLink : ''}">
                            </div>
                            <div class="flex items-center gap-3">
                                <input type="file" id="paymentFileInput" accept=".pdf,image/*" class="hidden">
                                <button type="button" id="upload-payment-btn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-sm font-semibold text-white border border-gray-600 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                                    Upload Payment Report
                                </button>
                                <span id="upload-payment-status" class="text-xs hidden"></span>
                            </div>
                        </div>
                    </div>
                </div>
                ${isAman && isEdit ? amanMenuHtml : ''}
                <div class="flex justify-end gap-3 pt-4 border-t border-gray-700/60 mt-2">
                    <button type="button" id="form-cancel-btn" class="px-5 py-2 rounded-lg text-sm font-semibold bg-gray-700 text-gray-200 hover:bg-gray-600 transition-colors">Cancel</button>
                    <button type="submit" class="px-6 py-2 rounded-lg text-sm font-bold text-white bg-teal-600 hover:bg-teal-500 transition-colors shadow-lg shadow-teal-900/40">${isEdit ? 'Update Certificate' : 'Add Certificate'}</button>
                </div>
            `;

            const formContent = `<form id="cert-form-${type.replace(/\s/g, '-')}" class="relative" data-id="${id || ''}" data-type="${type}">${commonFields}</form>`;

            showModal(`${isEdit ? 'Edit' : 'Add New'} ${type}`, formContent, () => {
                const formEl = document.getElementById(`cert-form-${type.replace(/\s/g, '-')}`);
                const propertyTypeSelect = document.getElementById('propertyType');
                const phaseFieldContainer = document.getElementById('phase-field-container');
                const phaseSelect = document.getElementById('phase');
                const amcOnlyCheckbox = document.getElementById('amcOnly');
                const amcExpiryContainer = document.getElementById('amc-expiry-container');


                // Toggle AMC Expiry field based on checkbox
                if (amcOnlyCheckbox && amcExpiryContainer) {
                    amcOnlyCheckbox.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            amcExpiryContainer.classList.remove('hidden');
                        } else {
                            amcExpiryContainer.classList.add('hidden');
                            // Clear value when unchecked
                            document.getElementById('amcExpiryDate').value = '';
                        }
                    });
                }

                // FIX 4: Added event listener to propertyType to toggle Phase visibility
                if (propertyTypeSelect) {
                    propertyTypeSelect.addEventListener('change', (e) => {
                        const newType = e.target.value;
                        // Check for 'warehouse' using standardized value
                        const isWarehouse = normalizePropertyType(newType) === 'warehouse';
                        phaseFieldContainer.classList.toggle('hidden', !isWarehouse);

                        // If switching away from warehouse, clear phase to prevent confusion
                        if (!isWarehouse && phaseSelect) {
                            phaseSelect.value = 'Other';
                        }
                    });
                }


                // Notes Logic
                const notesContainer = document.getElementById('notes-container');
                const addNoteBtn = document.getElementById('add-note-btn');
                const newNoteText = document.getElementById('new-note-text');
                const notesHidden = document.getElementById('notes-hidden');

                let currentNotes = [];
                try {
                    currentNotes = JSON.parse(notesHidden.value);
                } catch(e) {
                    currentNotes = [];
                }

                function renderNotes() {
                    notesHidden.value = JSON.stringify(currentNotes);
                    if (currentNotes.length === 0) {
                        notesContainer.innerHTML = '<p class="text-xs text-gray-500 italic px-1">No notes recorded.</p>';
                    } else {
                        notesContainer.innerHTML = currentNotes.map(note => `
                            <div class="flex items-start justify-between gap-3 p-3 bg-gray-800/80 rounded-lg border border-gray-700">
                                <div>
                                    <p class="text-xs text-teal-400/80 font-semibold mb-1">${formatDate(note.date)}</p>
                                    <p class="text-sm text-gray-200 whitespace-pre-wrap">${note.text}</p>
                                </div>
                                <button type="button" data-note-id="${note.id}" class="delete-note-btn text-red-400 hover:text-red-300 p-1 flex-shrink-0" title="Clear Note">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </button>
                            </div>
                        `).join('');
                    }

                    notesContainer.querySelectorAll('.delete-note-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const id = btn.getAttribute('data-note-id');
                            currentNotes = currentNotes.filter(n => n.id !== id);
                            renderNotes();
                        });
                    });
                }

                if (addNoteBtn) {
                    addNoteBtn.addEventListener('click', () => {
                        const text = newNoteText.value.trim();
                        if (text) {
                            currentNotes.push({
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                                text: text,
                                date: new Date().toISOString()
                            });
                            newNoteText.value = '';
                            renderNotes();
                        }
                    });
                }
                
                if (notesContainer) renderNotes();

                // PASS CONTEXT TO GLOBAL HANDLER
                formEl.addEventListener('submit', (e) => handleSave(e, type, id));
                document.getElementById('form-cancel-btn').addEventListener('click', hideModal);

                // Aman Menu Toggle Logic
                if (isAman && isEdit) {
                    const menuBtn = document.getElementById('aman-history-menu-btn');
                    const menuDropdown = document.getElementById(`aman-history-dropdown-${id}`);

                    menuBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        menuDropdown.classList.toggle('hidden');
                    });

                    // Handle clicking outside the dropdown to close it
                    document.addEventListener('click', (e) => {
                        if (e.target.closest('#modal-container') && !menuDropdown.contains(e.target) && e.target !== menuBtn) {
                            menuDropdown.classList.add('hidden');
                        }
                    });

                    // Listener for the menu option
                    formEl.querySelector('.aman-menu-option[data-action="edit-financial"]').addEventListener('click', () => {
                        hideModal(); // Close the main edit modal
                        handleShowAmanHistoryModal(id); // Open the dedicated cost management modal
                    });
                }

                // Dynamic re-render logic for inspection date field visibility
                const workflowSelect = document.getElementById('modalWorkflowStatus');
                if (workflowSelect) {
                    workflowSelect.addEventListener('change', (e) => {
                        const container = document.getElementById('inspection-date-container');
                        if (container) {
                            if (e.target.value === 'Inspection Date') {
                                container.classList.remove('hidden');
                            } else {
                                container.classList.add('hidden');
                            }
                        }
                    });
                }

                // Certificate Document — View Current
                const viewCurrentBtn = document.getElementById('view-current-cert-btn');
                if (viewCurrentBtn) {
                    viewCurrentBtn.addEventListener('click', () => {
                        const link = document.getElementById('certificateLink').value;
                        if (link) window.openLocalFile(link);
                    });
                }

                // Certificate Document — paste URL updates hidden input
                const certLinkText = document.getElementById('certLinkText');
                const certLinkHidden = document.getElementById('certificateLink');
                if (certLinkText && certLinkHidden) {
                    certLinkText.addEventListener('input', (e) => {
                        if (e.target.value.startsWith('http')) {
                            certLinkHidden.value = e.target.value;
                        }
                    });
                }

                // Certificate Document — Upload File
                const uploadBtn = document.getElementById('upload-cert-btn');
                const uploadStatus = document.getElementById('upload-cert-status');
                const fileInput = document.getElementById('certFileInput');

                if (uploadBtn && fileInput) {
                    uploadBtn.addEventListener('click', async () => {
                        if (!oneDriveFolderHandle) {
                            showToast('⚠️ Please link your OneDrive folder first (sidebar button).');
                            return;
                        }
                        fileInput.click();
                    });

                    fileInput.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;

                        uploadStatus.textContent = 'Saving...';
                        uploadStatus.classList.remove('hidden', 'text-green-400', 'text-red-400');
                        uploadStatus.classList.add('text-teal-400');
                        uploadBtn.disabled = true;

                        try {
                            if ((await oneDriveFolderHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
                                await oneDriveFolderHandle.requestPermission({ mode: 'readwrite' });
                            }

                            const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                            const fileName = `${Date.now()}_${safeName}`;
                            const fileHandle = await oneDriveFolderHandle.getFileHandle(fileName, { create: true });
                            const writable = await fileHandle.createWritable();
                            await writable.write(file);
                            await writable.close();

                            // Update hidden input so it is saved on form submit
                            document.getElementById('certificateLink').value = fileName;

                            uploadStatus.textContent = `✓ Saved: ${file.name}`;
                            uploadStatus.classList.remove('text-teal-400', 'text-red-400');
                            uploadStatus.classList.add('text-green-400');
                            uploadBtn.disabled = false;
                        } catch (err) {
                            console.error(err);
                            uploadStatus.textContent = 'Save failed: ' + err.message;
                            uploadStatus.classList.remove('text-teal-400', 'text-green-400');
                            uploadStatus.classList.add('text-red-400');
                            uploadBtn.disabled = false;
                        }
                    });
                }

                // Payment Report Document Upload (Aman only)
                const viewCurrentPaymentBtn = document.getElementById('view-current-payment-btn');
                if (viewCurrentPaymentBtn) {
                    viewCurrentPaymentBtn.addEventListener('click', () => {
                        const link = document.getElementById('paymentReportLink').value;
                        if (link) window.openLocalFile(link);
                    });
                }
                const paymentLinkText = document.getElementById('paymentReportText');
                const paymentLinkHidden = document.getElementById('paymentReportLink');
                if (paymentLinkText && paymentLinkHidden) {
                    paymentLinkText.addEventListener('input', (e) => {
                        if (e.target.value.startsWith('http')) paymentLinkHidden.value = e.target.value;
                    });
                }
                const uploadPaymentBtn = document.getElementById('upload-payment-btn');
                const uploadPaymentStatus = document.getElementById('upload-payment-status');
                const paymentFileInput = document.getElementById('paymentFileInput');
                if (uploadPaymentBtn && paymentFileInput) {
                    uploadPaymentBtn.addEventListener('click', async () => {
                        if (!oneDriveFolderHandle) { showToast('⚠️ Please link your OneDrive folder first.'); return; }
                        paymentFileInput.click();
                    });
                    paymentFileInput.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;
                        uploadPaymentStatus.textContent = 'Saving...';
                        uploadPaymentStatus.classList.remove('hidden', 'text-green-400', 'text-red-400');
                        uploadPaymentStatus.classList.add('text-teal-400');
                        uploadPaymentBtn.disabled = true;
                        try {
                            if ((await oneDriveFolderHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
                                await oneDriveFolderHandle.requestPermission({ mode: 'readwrite' });
                            }
                            const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                            const fileName = `${Date.now()}_payment_${safeName}`;
                            const fileHandle = await oneDriveFolderHandle.getFileHandle(fileName, { create: true });
                            const writable = await fileHandle.createWritable();
                            await writable.write(file);
                            await writable.close();
                            document.getElementById('paymentReportLink').value = fileName;
                            uploadPaymentStatus.textContent = `✓ Saved: ${file.name}`;
                            uploadPaymentStatus.classList.remove('text-teal-400', 'text-red-400');
                            uploadPaymentStatus.classList.add('text-green-400');
                            uploadPaymentBtn.disabled = false;
                        } catch (err) {
                            uploadPaymentStatus.textContent = 'Save failed: ' + err.message;
                            uploadPaymentStatus.classList.remove('text-teal-400', 'text-green-400');
                            uploadPaymentStatus.classList.add('text-red-400');
                            uploadPaymentBtn.disabled = false;
                        }
                    });
                }
            }, 'max-w-2xl');
        }

        // --- FIX: History Modal (Expiry/Link History) ---
        function handleShowHistoryModal(id) {
            const history = historyData[id] || [];
            const cert = cdCerts.find(c => c.id === id) || amanCerts.find(c => c.id === id);

            if (!cert) return showModal("Error", `<p class='text-red-400'>Certificate data not found for ID: ${id}</p>`);

            // Reverse the history array to show most recent old entry first
            const sortedHistory = [...history].sort((a, b) => new Date(b.archivedAt) - new Date(a.archivedAt));

            const historyItemsHtml = sortedHistory.length > 0 ? sortedHistory.map((item, index) => {
                const timestamp = new Date(item.archivedAt).toLocaleString('en-GB');
                const isLocalFile = item.certificateLink && !item.certificateLink.startsWith('http');
                const linkHtml = item.certificateLink ? (isLocalFile ? `
                        <button onclick="window.openLocalFile('${item.certificateLink}')" class="text-xs text-teal-400 hover:text-teal-300 underline flex items-center gap-1 mt-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            View Local Archived File
                        </button>` : `
                        <a href="${item.certificateLink}" target="_blank" rel="noopener noreferrer" class="text-xs text-teal-400 hover:text-teal-300 underline flex items-center gap-1 mt-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            View Archived Link
                        </a>`) : `<p class="text-xs text-gray-500 mt-2">No archived link recorded.</p>`;

                const amcExpiryHtml = item.amcExpiryDate ? `<p class="text-sm font-bold text-white mb-2">Archived AMC Expiry: <span class="text-yellow-400">${formatDate(item.amcExpiryDate)}</span></p>` : '';

                return `
                    <div class="p-4 rounded-lg border border-gray-700 ${index === 0 ? 'bg-gray-700/50' : 'bg-gray-800/50'}">
                        <p class="text-sm font-bold text-white mb-2">Archived Expiry: <span class="text-red-400">${formatDate(item.expiryDate)}</span></p>
                        ${amcExpiryHtml}
                        <p class="text-xs text-gray-400">Date Logged: ${timestamp}</p>
                        ${linkHtml}
                        <div class="mt-2 pt-2 border-t border-gray-600">
                            <p class="text-xs text-gray-400">Archived Workflow Status: ${item.workflowStatus || 'N/A'}</p>
                        </div>
                    </div>
                `;
            }).join('')
                : `<p class="text-center py-6 text-gray-400">No previous expiry/link history found for this certificate.</p>`;


            const modalContent = `
                <h4 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2">Current Expiry: <span class="text-teal-400">${formatDate(cert.expiryDate)}</span></h4>
                <div class="space-y-4 max-h-96 overflow-y-auto">
                    ${historyItemsHtml}
                </div>
                <div class="flex justify-end pt-6">
                    <button onclick="hideModal()" class="px-6 py-2 rounded-lg bg-gray-600 text-white hover:bg-gray-500 transition-colors font-semibold">Close</button>
                </div>
            `;

            showModal(`History for ${cert.propertyNumber}`, modalContent);
        }

        // --- Handle Inspection Outcome (Pass / Fail) ---
        function handleUpdateInspectionStatus(id) {
            const certIndex = cdCerts.findIndex(c => c.id === id);
            if (certIndex === -1) return;
            const cert = cdCerts[certIndex];

            const modalContent = `
                <div class="space-y-6">
                    <div class="flex items-center gap-4 p-4 bg-gray-700/50 rounded-xl border border-gray-600">
                        <div class="w-12 h-12 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="#60a5fa" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Property <span class="text-white font-bold">${cert.propertyNumber}</span></p>
                            <p class="text-sm text-gray-400">Inspection was scheduled: <span class="text-cyan-400 font-semibold">${formatDate(cert.inspectionDate)}</span></p>

                    <div class="grid grid-cols-2 gap-4" id="outcome-choice-panel">

                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                            Passed
                        </button>
                        <button id="btn-insp-fail" class="flex flex-col items-center justify-center gap-3 p-5 rounded-2xl border-2 border-red-500/40 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold text-lg transition-all hover:scale-105">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                            Failed
                        </button>
                    </div>

                    <!-- Pass Panel (hidden initially) -->
                    <div id="pass-panel" class="hidden space-y-4">
                        <div class="border-t border-gray-700 pt-4">
                            <h4 class="text-green-400 font-bold mb-4">✓ Certificate Issued — Enter Details</h4>
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Issue Date</label>
                                    <input type="date" id="insp-new-issue" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-3 py-2.5 text-white focus:ring-2 focus:ring-green-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">New Expiry Date <span class="text-red-400">*</span></label>
                                    <input type="date" id="insp-new-expiry" class="w-full bg-gray-900 border border-red-500/50 rounded-xl px-3 py-2.5 text-white focus:ring-2 focus:ring-green-500 focus:outline-none">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Upload Certificate Document (PDF/Image)</label>
                                <input type="file" id="insp-cert-file" accept=".pdf,image/*" class="w-full text-sm text-gray-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-gray-700 file:text-gray-200 hover:file:bg-gray-600 cursor-pointer">
                                <p id="insp-upload-status" class="text-xs text-gray-500 mt-1 hidden"></p>
                            </div>
                            <button id="btn-confirm-pass" class="w-full py-3 rounded-xl font-bold text-white" style="background:linear-gradient(135deg,#15803d,#22c55e);box-shadow:0 4px 15px rgba(34,197,94,0.3);">✓ Confirm Pass &amp; Mark Certificate Ready</button>
                        </div>
                    </div>

                    <!-- Fail Panel (hidden initially) -->
                    <div id="fail-panel" class="hidden space-y-4">
                        <div class="border-t border-gray-700 pt-4">
                            <h4 class="text-red-400 font-bold mb-4">⚠ Inspection Failed — Record Details</h4>
                            <div class="mb-4">
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Fault Attributed To <span class="text-red-400">*</span></label>
                                <div class="grid grid-cols-2 gap-3">
                                    <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-600 bg-gray-700/50 cursor-pointer hover:bg-gray-700 transition-colors">
                                        <input type="radio" name="fault-by" value="AMC Contractor" class="w-4 h-4 accent-orange-500">
                                        <span class="text-sm font-semibold text-orange-300">AMC Contractor</span>
                                    </label>
                                    <label class="flex items-center gap-3 p-3 rounded-xl border border-gray-600 bg-gray-700/50 cursor-pointer hover:bg-gray-700 transition-colors">
                                        <input type="radio" name="fault-by" value="Tenant" class="w-4 h-4 accent-yellow-500">
                                        <span class="text-sm font-semibold text-yellow-300">Tenant</span>
                                    </label>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">CD Officer's Rectification Comments <span class="text-red-400">*</span></label>
                                <textarea id="fail-comments" rows="4" placeholder="Enter the issues noted by the Civil Defence officer during inspection..." class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white text-sm focus:ring-2 focus:ring-red-500 focus:outline-none resize-none"></textarea>
                            </div>
                            <div class="mb-4">
                                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Target Rectification Date</label>
                                <input type="date" id="fail-rect-date" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-3 py-2.5 text-white focus:ring-2 focus:ring-red-500 focus:outline-none">
                            </div>
                            <button id="btn-confirm-fail" class="w-full py-3 rounded-xl font-bold text-white" style="background:linear-gradient(135deg,#991b1b,#ef4444);box-shadow:0 4px 15px rgba(239,68,68,0.3);">Record Failed Inspection</button>
                        </div>
                    </div>
                </div>
            `;

            showModal(`Inspection Outcome — Property ${cert.propertyNumber}`, modalContent, () => {
                document.getElementById('btn-insp-pass').addEventListener('click', () => {
                    document.getElementById('outcome-choice-panel').classList.add('opacity-50');
                    document.getElementById('pass-panel').classList.remove('hidden');
                    document.getElementById('fail-panel').classList.add('hidden');
                    document.getElementById('btn-insp-pass').classList.add('ring-2', 'ring-green-400');
                    document.getElementById('btn-insp-fail').classList.remove('ring-2', 'ring-red-400');
                });

                document.getElementById('btn-insp-fail').addEventListener('click', () => {
                    document.getElementById('outcome-choice-panel').classList.add('opacity-50');
                    document.getElementById('fail-panel').classList.remove('hidden');
                    document.getElementById('pass-panel').classList.add('hidden');
                    document.getElementById('btn-insp-fail').classList.add('ring-2', 'ring-red-400');
                    document.getElementById('btn-insp-pass').classList.remove('ring-2', 'ring-green-400');
                });

                document.getElementById('btn-confirm-pass').addEventListener('click', async () => {
                    const newExpiry = document.getElementById('insp-new-expiry').value;
                    const newIssue = document.getElementById('insp-new-issue').value;
                    if (!newExpiry) { showToast('Please enter the new certificate expiry date.'); return; }

                    const fileInput = document.getElementById('insp-cert-file');
                    const uploadStatus = document.getElementById('insp-upload-status');
                    if (fileInput && fileInput.files.length > 0) {
                        const file = fileInput.files[0];
                        if (!oneDriveFolderHandle) { showToast('⚠ Link OneDrive folder in Settings to upload documents.'); return; }
                        try {
                            uploadStatus.textContent = 'Saving certificate...'; uploadStatus.classList.remove('hidden');
                            if ((await oneDriveFolderHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
                                await oneDriveFolderHandle.requestPermission({ mode: 'readwrite' });
                            }
                            const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                            const fileName = `${Date.now()}_${safeName}`;
                            const fh = await oneDriveFolderHandle.getFileHandle(fileName, { create: true });
                            const wr = await fh.createWritable();
                            await wr.write(file); await wr.close();
                            cert.certificateLink = fileName;
                            uploadStatus.textContent = '✓ Saved!';
                        } catch (err) { uploadStatus.textContent = 'Upload failed: ' + err.message; showToast('⚠ Upload failed: ' + err.message); return; }
                    }

                    // Archive old cert before updating
                    if (!historyData[id]) historyData[id] = [];
                    historyData[id].push({ ...cert, archivedAt: new Date().toISOString(), expiryDate: cert.expiryDate || '', certificateLink: cert.certificateLink || '' });

                    cert.workflowStatus = 'Certificate Ready';
                    cert.inspectionDate = '';
                    cert.lastInspectionResult = 'Pass';
                    cert.rectificationComments = '';
                    cert.rectificationFaultBy = '';
                    cert.rectificationDueDate = '';
                    if (newIssue) cert.issueDate = newIssue;
                    cert.expiryDate = newExpiry;

                    saveDataToFirebase();
                    hideModal();
                    render();
                    showToast('🎉 Inspection PASSED — Certificate marked as Ready!');
                });

                document.getElementById('btn-confirm-fail').addEventListener('click', () => {
                    const faultBy = document.querySelector('input[name="fault-by"]:checked')?.value;
                    const comments = document.getElementById('fail-comments').value.trim();
                    const rectDate = document.getElementById('fail-rect-date').value;

                    if (!faultBy) { showToast('Please select who the fault is attributed to.'); return; }
                    if (!comments) { showToast('Please enter the CD officer\'s rectification comments.'); return; }

                    cert.workflowStatus = 'Inspection Failed';
                    cert.lastInspectionResult = 'Fail';
                    cert.rectificationFaultBy = faultBy;
                    cert.rectificationComments = comments;
                    cert.rectificationDueDate = rectDate || '';
                    cert.inspectionFailCount = (cert.inspectionFailCount || 0) + 1;
                    // Keep the inspection date for reference
                    cert.lastFailedInspectionDate = cert.inspectionDate;

                    saveDataToFirebase();
                    hideModal();
                    render();
                    showToast(`Inspection FAILED recorded — ${faultBy} fault. Property moved to rectification.`);
                });
            });
        }


        // --- Aman Cost History Functions ---

        function calculateAmanCosts(cert) {
            const history = cert.renewalHistory || [];
            let totalInstallation = 0;
            let totalRenewal = 0;

            history.forEach(record => {
                const cost = parseFloat(record.cost) || 0;
                if (record.type === 'Installation') {
                    totalInstallation += cost;
                } else if (record.type === 'Renewal') {
                    totalRenewal += cost;
                }
            });

            return { totalInstallation, totalRenewal, totalLifetime: totalInstallation + totalRenewal };
        }

                            <input type="hidden" name="id" value="${installationRecord.id}">

        function removeRenewalRecord(recordId, certId) {
            const certIndex = amanCerts.findIndex(c => c.id === certId);
            if (certIndex === -1) return;

            amanCerts[certIndex].renewalHistory = amanCerts[certIndex].renewalHistory.filter(r => r.id !== recordId);
            saveDataToFirebase();
            // Re-render the history modal content
            hideModal();
            handleShowAmanHistoryModal(certId);
        }

        function handleSaveHistory(e, id) {
            e.preventDefault();
            const certIndex = amanCerts.findIndex(c => c.id === id);
            if (certIndex === -1) return;

            const newHistory = [];

            // 1. Handle Installation Record
            const installDate = document.getElementById('installDate').value;
            const installCost = parseFloat(document.getElementById('installCost').value);
            const installId = e.target.querySelector('input[name="id"]').value;

            if (installDate && !isNaN(installCost)) {
                newHistory.push({
                    id: installId,
                    type: 'Installation',
                    date: installDate,
                    cost: installCost
                });
            } else {
                showModal("Validation Error", "<p class='text-red-400'>Installation Date and Cost are required.</p>");
                return;
            }

            // 2. Handle Renewal Records
            const renewalRecords = document.getElementById('renewal-records-list').children;
            let validationFailed = false;

            Array.from(renewalRecords).forEach(el => {
                if (el.tagName === 'DIV') {
                    const dateInput = el.querySelector('.renewal-date');
                    const costInput = el.querySelector('.renewal-cost');
                    const recordId = el.dataset.id;

                    const date = dateInput ? dateInput.value : '';
                    const cost = costInput ? parseFloat(costInput.value) : NaN;

                    if (date && !isNaN(cost)) {
                        newHistory.push({
                            id: recordId,
                            type: 'Renewal',
                            date: date,
                            cost: cost
                        });
                    } else if (date || !isNaN(cost)) {
                        // Partial entry found
                        validationFailed = true;
                    }
                }
            });

            if (validationFailed) {
                showModal("Validation Error", "<p class='text-red-400'>All renewal entries must have both a Date and a Cost.</p>");
                return;
            }

            amanCerts[certIndex].renewalHistory = newHistory;
            saveDataToFirebase();
            hideModal();
            render(); // Re-render table and details

            showModal("Success", `<p class='text-green-400'>Aman cost history for ${amanCerts[certIndex].propertyNumber} saved successfully.</p>`);
        }
