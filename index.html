                document.getElementById('settings-import-file').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const imported = JSON.parse(ev.target.result);
                            if (!Array.isArray(imported)) throw new Error('Invalid format');
                            if (window._importTarget === 'Civil Defence') {
                                imported.forEach(c => { if (!cdCerts.find(x => x.id === c.id)) cdCerts.push(c); });
                            } else {
                                imported.forEach(c => { if (!amanCerts.find(x => x.id === c.id)) amanCerts.push(c); });
                            }
                            saveDataToFirebase();
                            render();
                            hideModal();
                            showToast(`✓ ${imported.length} records imported successfully.`);
                        } catch { showToast('Import failed: invalid JSON file.'); }
                    };
                    reader.readAsText(file);
                });
            });
        }

        function triggerExport(type) {
            const data = type === 'Civil Defence' ? cdCerts : amanCerts;
            const filtered = data.filter(c => (c.project || 'Main Project') === currentProject);
            const blob = new Blob([JSON.stringify(filtered, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${type.replace(/\s/g, '_')}_export_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`✓ ${type} data exported.`);
        }


        window.handleInteractiveWorkflow = function handleInteractiveWorkflow(id, type, fromHub = false) {

                        : ['Renewal Pending', 'Active & Monitored'];

                    // Default to simple timeline for active
                    steps = ['Application Submitted', 'Inspection & Installation', 'Active & Monitored'];

                    steps = ['Application Submitted'];
                    if (status === 'Unhealthy FACP Panel' || status === 'Cert Issued (Pending Install)') {
                        steps.push('Unhealthy FACP Panel');
                        steps.push('Cert Issued (Pending Install)');

            const currentStepIndex = steps.indexOf(cert.workflowStatus);

        window.handleInteractiveWorkflow = handleInteractiveWorkflow;

        // FEATURE G: XLSX Export
        function handleDownloadXLSX(type, exportFilters = null) {
            if (!window.XLSX) { showModal('Error', '<p class="text-red-400">Excel library not loaded.</p>'); return; }
            const dataArray = type === 'Civil Defence' ? cdCerts : amanCerts;
            const projectData = dataArray.filter(c => (c.project || 'Main Project') === currentProject);
            
            const filters = exportFilters || currentFilters[type] || { validity: 'All', phase: 'All', workflow: 'All', search: '' };
            const getLower = (item, field) => String(item[field] || '').toLowerCase();
            
            const reportData = projectData.filter(item => {
                const validityMatch = checkValidityFilter(item, filters);
                let searchMatch = !filters.search;
                if (filters.search) {
                    const searchTerm = filters.search.toLowerCase();
                    if (type === 'Aman Certificate') {
                        searchMatch = (getLower(item, 'propertyNumber').includes(searchTerm)) ||
                            (getLower(item, 'accountId').includes(searchTerm)) ||
                            (getLower(item, 'recordId').includes(searchTerm)) ||
                            (getLower(item, 'deviceId').includes(searchTerm)) ||
                            (getLower(item, 'serialNumber').includes(searchTerm));
                    } else {
                        searchMatch = (getLower(item, 'propertyNumber').includes(searchTerm));
                    }
                }
                const phaseMatch = filters.phase === 'All' || (item.phase || 'N/A Phase') === filters.phase;
                const workflowMatch = filters.workflow === 'All' || item.workflowStatus === filters.workflow;
                return validityMatch && searchMatch && phaseMatch && workflowMatch;
            });

            if (reportData.length === 0) { showModal('No Data', '<p class="text-yellow-400">No records found matching filters.</p>'); return; }
            
            // Sort Data by Priority (Expired Days) then Property Number
            reportData.sort((a, b) => {
                const aStatus = getValidityStatus(a.expiryDate);
                const bStatus = getValidityStatus(b.expiryDate);
                
                if (aStatus.daysLeft !== null && bStatus.daysLeft !== null) {
                    if (aStatus.daysLeft !== bStatus.daysLeft) {
                        return aStatus.daysLeft - bStatus.daysLeft; // Ascending (most negative first)
                    }
                } else if (aStatus.daysLeft !== null) {
                    return -1;
                } else if (bStatus.daysLeft !== null) {
                    return 1;
                }
                
                return String(a.propertyNumber).localeCompare(String(b.propertyNumber), undefined, { numeric: true, sensitivity: 'base' });
            });

            const rows = reportData.map(c => {
                const base = { 'Property No': c.propertyNumber, 'Phase': c.phase||'', 'Type': c.propertyType||'', 'Expiry': formatDate(c.expiryDate), 'Validity': getValidityStatus(c.expiryDate).text, 'Workflow': c.workflowStatus||'' };
                if (type === 'Civil Defence') { base['Issue Date'] = formatDate(c.issueDate); base['AMC Only'] = c.amcOnly?'Yes':'No'; base['AMC Expiry'] = formatDate(c.amcExpiryDate); }
                else { base['Account ID'] = c.accountId||''; base['Device ID'] = c.deviceId||''; base['Serial No'] = c.serialNumber||''; const costs = calculateAmanCosts(c); base['Install Cost'] = costs.totalInstallation.toFixed(2); base['Renewal Cost'] = costs.totalRenewal.toFixed(2); base['Lifetime Cost'] = costs.totalLifetime.toFixed(2); }
                return base;
            });
            
            if (filters.validity === 'All') {
                const allUnified = getUnifiedProperties();
                const missingPropsRaw = allUnified.filter(p => p.project === currentProject && !p[type === 'Civil Defence' ? 'cd' : 'aman']);
                missingPropsRaw.forEach(p => {
                    const base = { 'Property No': p.propertyNumber, 'Phase': p.phase||'', 'Type': p.propertyType||'', 'Expiry': 'N/A', 'Validity': 'Missing', 'Workflow': 'Not Registered' };
                    if (type === 'Civil Defence') { base['Issue Date'] = ''; base['AMC Only'] = ''; base['AMC Expiry'] = ''; }
                    else { base['Account ID'] = ''; base['Device ID'] = ''; base['Serial No'] = ''; base['Install Cost'] = ''; base['Renewal Cost'] = ''; base['Lifetime Cost'] = ''; }
                    rows.push(base);
                });
            }

            const ws = window.XLSX.utils.json_to_sheet(rows);
            const wb = window.XLSX.utils.book_new();
            window.XLSX.utils.book_append_sheet(wb, ws, type === 'Civil Defence' ? 'CD' : 'Aman');
            const fname = type.replace(/\s/g,'_') + '_' + currentProject + '_' + new Date().toISOString().split('T')[0] + '.xlsx';
            window.XLSX.writeFile(wb, fname);
        }
        window.handleDownloadXLSX = handleDownloadXLSX;

        // FEATURE H: Global Search
        function handleGlobalSearch() {
            const allProps = getUnifiedProperties();
            const html = `
                <div class="relative mb-4">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="search" id="global-search-input" placeholder="Search property number, Device ID, Serial No..." class="w-full bg-gray-900 border border-gray-700 rounded-xl pl-10 pr-4 py-3 text-white placeholder-gray-500 focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
                <div id="global-search-results" class="space-y-2 max-h-96 overflow-y-auto"></div>`;
            showModal('Global Search', html, () => {
                const input = document.getElementById('global-search-input');
                const results = document.getElementById('global-search-results');
                if (!input) return;
                setTimeout(() => input.focus(), 100);
                input.addEventListener('input', () => {
                    const term = input.value.trim().toLowerCase();
                    if (!term) { results.innerHTML = ''; return; }
                    const matches = allProps.filter(p =>
                        String(p.propertyNumber||'').toLowerCase().includes(term) ||
                        (p.aman && String(p.aman.deviceId||'').toLowerCase().includes(term)) ||
                        (p.aman && String(p.aman.serialNumber||'').toLowerCase().includes(term))
                    );
                    if (matches.length === 0) { results.innerHTML = '<p class="text-gray-400 text-sm py-4 text-center">No results found.</p>'; return; }
                    results.innerHTML = matches.map(p => {
                        const cdBadge = p.cd ? `<span class="px-2 py-0.5 rounded bg-blue-900/40 text-blue-300 text-[10px]">${p.cd.workflowStatus||'CD'}</span>` : '';
                        const amanBadge = p.aman ? `<span class="px-2 py-0.5 rounded bg-yellow-900/40 text-yellow-300 text-[10px]">${p.aman.workflowStatus||'Aman'}</span>` : '';
                        return `<div class="flex items-center justify-between px-4 py-3 bg-gray-800 hover:bg-gray-700 rounded-xl cursor-pointer transition-colors global-result-row" data-prop="${p.propertyNumber}">
                            <div><span class="font-bold text-teal-300">Prop ${p.propertyNumber}</span><span class="ml-2 text-xs text-gray-400 bg-gray-700 px-2 py-0.5 rounded">${p.project||'Main Project'}</span></div>
                            <div class="flex gap-1">${cdBadge}${amanBadge}</div></div>`;
                    }).join('');
                    results.querySelectorAll('.global-result-row').forEach((row, i) => {
                        row.addEventListener('click', () => { hideModal(); setTimeout(() => handleShowWorkflowManager(matches[i].propertyNumber), 50); });
                    });
                });
            }, 'max-w-2xl');
        }
        window.handleGlobalSearch = handleGlobalSearch;

        // FEATURE: Expiry Notification Banner
        function showExpiryNotificationBanner() {
            const all = getUnifiedProperties().filter(p => (p.project||'Main Project') === currentProject);
            let exp = 0, near = 0;
            all.forEach(p => { [p.cd, p.aman].filter(Boolean).forEach(c => { const s = getValidityStatus(c.expiryDate); if(s.text==='Expired') exp++; else if(s.text==='Near Expiry') near++; }); });
            const old = document.getElementById('expiry-banner');
            if (old) old.remove();
            if (!exp && !near) return;
            const app = document.getElementById('app-container');
            const banner = document.createElement('div');
            banner.id = 'expiry-banner';
            banner.className = 'fixed top-0 left-0 right-0 z-[9999] flex items-center justify-between px-6 py-2.5 text-sm font-semibold shadow-2xl';
            banner.style.background = exp > 0 ? 'linear-gradient(135deg,#7f1d1d,#991b1b)' : 'linear-gradient(135deg,#78350f,#92400e)';
            const msg = (exp > 0 ? `<strong>${exp} EXPIRED</strong>` : '') + (exp > 0 && near > 0 ? ' &bull; ' : '') + (near > 0 ? `<strong>${near} near expiry</strong>` : '') + ` &mdash; ${currentProject}`;
            banner.innerHTML = `
                <div class="flex items-center gap-3 text-white"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg>${msg}</div>
                <div class="flex gap-2">
                    <button id="hub-from-banner" class="px-3 py-1 bg-white/20 hover:bg-white/30 rounded-lg text-white text-xs">View Hub</button>
                    <button id="dismiss-banner" class="text-white/60 hover:text-white text-xl leading-none px-2">&times;</button>
                </div>`;
            document.body.prepend(banner);
            if (app) app.style.paddingTop = '42px';
            document.getElementById('dismiss-banner').addEventListener('click', () => { banner.remove(); if(app) app.style.paddingTop=''; });
            document.getElementById('hub-from-banner').addEventListener('click', () => handleShowWorkflowHub());
        }
        window.showExpiryNotificationBanner = showExpiryNotificationBanner;

        // FEATURE E: Device ID Duplicate Check
        function checkAmanDuplicateDeviceId(deviceId, excludeId) {
            if (!deviceId) return null;
            const d = amanCerts.find(c => c.id !== excludeId && c.deviceId && c.deviceId.trim().toLowerCase() === deviceId.trim().toLowerCase());
            return d ? d.propertyNumber : null;
        }
        window.checkAmanDuplicateDeviceId = checkAmanDuplicateDeviceId;



        // --- Event Listeners ---
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.workflow-status-btn') && !e.target.closest('#notification-btn')) {
                // Close workflow dropdowns
                document.querySelectorAll('[id^="workflow-dropdown-"]').forEach(dropdown => {
                    dropdown.classList.add('hidden');
                });
                // Close notification dropdown
                if (!e.target.closest('#notification-dropdown')) {
                    document.getElementById('notification-dropdown').classList.add('hidden');
                }
            }
        });

        document.getElementById('navigation').addEventListener('click', (e) => {
            const navLink = e.target.closest('.nav-link');
            if (navLink) {
                currentPage = navLink.dataset.page;
                render();
            }
        });

        document.body.addEventListener('click', (e) => {
            const actionBtn = e.target.closest('.action-btn');
            const workflowHubBtn = e.target.closest('#workflow-hub-btn');
            const toolsBtn = e.target.closest('#tools-btn');
            if (workflowHubBtn) {
                e.preventDefault();
                handleShowWorkflowHub();
                return;
            }

            if (e.target.closest('#bulk-email-btn')) {
                e.preventDefault();
                handleBulkEmailCD();
                return;
            }

            if (e.target.closest('#bulk-remind-later-btn')) {
                e.preventDefault();
                handleBulkInformedCD();
                return;
            }

            if (toolsBtn) {
                e.preventDefault();
                handleShowTools();
                return;
            }

            if (actionBtn) {
                const { action, id, type } = actionBtn.dataset;
                if (action === 'edit') {
                    handleShowForm(type, id);
                } else if (action === 'interactive-workflow') {
                    window.handleInteractiveWorkflow(id, type, window._wfFromHub || false);
                } else if (action === 'delete') {
                    handleOperation(type, 'delete', id, null);
                } else if (action === 'history') {
                    if (type === 'Aman Certificate') {
                        // The financial history view is accessed via the edit modal now,
                        // but keeping the direct button for backward compatibility or general history.
                        handleShowHistoryModal(id);
                    } else {
                        handleShowHistoryModal(id); // Expiry/Link history for CD and Aman
                    }
                } else if (action === 'view-details' || action === 'edit-unified') {
                    if (actionBtn.dataset.prop) {
                        handleShowWorkflowManager(actionBtn.dataset.prop);
                    } else {
                        handleShowDetailsModal(id, type); // Legacy for Active Workflows hub
                    }
                } else if (action === 'update-inspection') {
                    handleUpdateInspectionStatus(id);
                } else if (action === 'renew') { // NEW RENEWAL ACTION
                    handleShowRenewalModal(type, id);
                } else if (action === 'email-fire-team') {
                    const dataArray = type === 'Civil Defence' ? cdCerts : amanCerts;
                    const cert = dataArray.find(c => c.id === id);
                    if (cert) {
                        handleEmailFireTeam(cert);
                        cert.workflowStatus = 'Informed Fire team';
                        saveDataToFirebase();
                        render();
                        showToast("Email generated. Status updated to 'Informed Fire team'.");
                    }
                }
            }
        });

        document.getElementById('settings-btn').addEventListener('click', handleShowSettingsModal);

        // --- Initialization ---
        function initialize() {
            initOneDrive(); // Try to auto-link the folder silently
            // We wait for auth to complete to load data from Firebase
        }

        initialize();
    </script>
