<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CD & AMAN Tracker (Multi-Project)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a202c;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #2d3748;
        }

        /* Adjusted color filter for calendar picker in dark mode for better visibility */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .action-btn.animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .5;
            }
        }

        /* Login Screen Styles */
        #login-screen {
            position: fixed;
            inset: 0;
            background: #111827;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            display: none;
            height: 100vh;
            width: 100%;
        }

        /* Style for date inputs to keep calendar picker visible */
        input[type="date"] {
            color-scheme: dark;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased overflow-hidden">

    <div id="login-screen">
        <div class="w-full max-w-md p-8 bg-gray-800 rounded-2xl shadow-2xl border border-gray-700">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white tracking-wider">SYSTEM LOGIN</h1>
                <p class="text-teal-500 text-sm mt-2">CD & Aman Tracker</p>
            </div>
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Email</label>
                    <input type="email" id="login-email"
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-teal-500 outline-none"
                        placeholder="admin@tracker.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                    <input type="password" id="login-password"
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-teal-500 outline-none"
                        placeholder="••••••••" required>
                </div>
                <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
                <button type="submit"
                    class="w-full py-3 px-4 bg-teal-600 hover:bg-teal-500 rounded-lg text-white font-bold transition-colors shadow-lg">
                    Access Dashboard
                </button>
            </form>
        </div>
    </div>

    <div id="app-container" class="flex">
        <aside class="w-64 bg-gray-800/30 p-6 border-r border-gray-700/50 flex-shrink-0 flex flex-col">
            <div class="text-center mb-8">
                <h1 class="text-xl font-bold text-white tracking-wider">CD & AMAN</h1>
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <p id="user-display" class="text-xs text-gray-400 truncate max-w-[150px]">User</p>
                </div>
            </div>

            <!-- PROJECT DROPDOWN -->
            <div class="mb-8">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Active Project</label>
                <select id="project-select"
                    class="w-full bg-gray-900 border border-gray-600 text-white text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block p-2.5">
                    <option value="Main Project">Main Project</option>
                </select>
            </div>

            <nav id="navigation" class="space-y-4 flex-1">
                <button data-page="Civil Defence"
                    class="nav-link flex items-center w-full px-4 py-3 text-sm font-medium rounded-lg transition-all duration-200 bg-teal-600/90 text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6 mr-4">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                    <span class="flex-1 text-left">Civil Defence</span>
                </button>
                <button data-page="Aman Certificate"
                    class="nav-link flex items-center w-full px-4 py-3 text-sm font-medium rounded-lg transition-all duration-200 text-gray-300 hover:bg-gray-700/50 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6 mr-4">
                        <rect width="16" height="20" x="4" y="2" rx="2"></rect>
                        <path d="M9 22v-4h6v4"></path>
                        <path d="M8 6h.01"></path>
                        <path d="M16 6h.01"></path>
                        <path d="M12 6h.01"></path>
                        <path d="M12 10h.01"></path>
                        <path d="M12 14h.01"></path>
                        <path d="M16 10h.01"></path>
                        <path d="M16 14h.01"></path>
                        <path d="M8 10h.01"></path>
                        <path d="M8 14h.01"></path>
                    </svg>
                    <span class="flex-1 text-left">Aman Certificate</span>
                </button>
            </nav>

            <div class="px-4 mb-4 mt-auto space-y-2">
                <button id="link-onedrive-btn"
                    class="flex items-center w-full px-4 py-2 text-sm font-medium rounded-lg transition-colors border border-blue-500/50 text-blue-400 hover:bg-blue-900/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span id="onedrive-status-text">Link OneDrive</span>
                </button>

                <button id="settings-btn"
                    class="flex items-center w-full px-4 py-2 text-sm font-medium rounded-lg transition-colors border border-gray-600 text-gray-300 hover:bg-gray-800 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-3" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
                        </path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <span>Settings</span>
                </button>
            </div>

            <button id="logout-btn"
                class="flex items-center justify-center w-full px-4 py-2 text-sm font-medium text-red-400 hover:bg-red-900/30 rounded-lg transition-colors border border-red-900/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" x2="9" y1="12" y2="12"></line>
                </svg>
                Sign Out
            </button>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto h-full">

            <div id="page-Civil Defence" class="page active"></div>
            <div id="page-Aman Certificate" class="page"></div>
        </main>
    </div>

    <div id="modal-container"
        class="hidden fixed inset-0 z-40 flex items-center justify-center bg-black/60 backdrop-blur-sm"></div>

    <script type="module">
        // --------------------------------------------------------------
        // 1. FIREBASE IMPORTS & CONFIGURATION
        // --------------------------------------------------------------
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { get, set as setIdb } from 'https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm';

        // Firebase Realtime Database Configuration (Original content preserved)
        // NOTE: This uses Firebase Realtime Database and not Firestore as per the original code.
        const firebaseConfig = {
            apiKey: "AIzaSyAnsZJnWu5PvC5UDyGL7q2zO9HjePDt5wk",
            authDomain: "amancdsys.firebaseapp.com",
            projectId: "amancdsys",
            storageBucket: "amancdsys.firebasestorage.app",
            messagingSenderId: "335675080686",
            appId: "1:335675080686:web:f38787505d1873c3cf58ff",
            measurementId: "G-F4D55C3MFK"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // --------------------------------------------------------------
        // 2.5 ONEDRIVE FILE SYSTEM API
        // --------------------------------------------------------------
        let oneDriveFolderHandle = null;

        async function initOneDrive() {
            try {
                const handle = await get('oneDriveHandle');
                if (handle) {
                    const options = { mode: 'readwrite' };
                    if ((await handle.queryPermission(options)) === 'granted') {
                        oneDriveFolderHandle = handle;
                        document.getElementById('onedrive-status-text').textContent = 'OneDrive Linked';
                        document.getElementById('link-onedrive-btn').classList.replace('text-blue-400', 'text-green-400');
                        document.getElementById('link-onedrive-btn').classList.replace('border-blue-500/50', 'border-green-500/50');
                    } else {
                        document.getElementById('onedrive-status-text').textContent = 'Grant Folder Access';
                    }
                }
            } catch (e) {
                console.error("Init OneDrive error", e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('link-onedrive-btn').addEventListener('click', async () => {
                try {
                    let handle = await get('oneDriveHandle');
                    if (handle && (await handle.queryPermission({ mode: 'readwrite' })) === 'prompt') {
                        const perm = await handle.requestPermission({ mode: 'readwrite' });
                        if (perm === 'granted') {
                            oneDriveFolderHandle = handle;
                            document.getElementById('onedrive-status-text').textContent = 'OneDrive Linked';
                            document.getElementById('link-onedrive-btn').classList.replace('text-blue-400', 'text-green-400');
                            document.getElementById('link-onedrive-btn').classList.replace('border-blue-500/50', 'border-green-500/50');
                            return;
                        }
                    }

                    handle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    await setIdb('oneDriveHandle', handle);
                    oneDriveFolderHandle = handle;
                    document.getElementById('onedrive-status-text').textContent = 'OneDrive Linked';
                    document.getElementById('link-onedrive-btn').classList.replace('text-blue-400', 'text-green-400');
                    document.getElementById('link-onedrive-btn').classList.replace('border-blue-500/50', 'border-green-500/50');
                } catch (e) {
                    console.error("Folder picker error", e);
                }
            });
        });

        window.openLocalFile = async (fileName) => {
            if (!oneDriveFolderHandle) {
                showModal("Access Required", "<p class='text-red-400'>Please click 'Link OneDrive' or 'Grant Folder Access' in the sidebar first.</p>");
                return;
            }
            try {
                if ((await oneDriveFolderHandle.queryPermission({ mode: 'read' })) !== 'granted') {
                    await oneDriveFolderHandle.requestPermission({ mode: 'read' });
                }
                const fileHandle = await oneDriveFolderHandle.getFileHandle(fileName);
                const file = await fileHandle.getFile();
                const url = URL.createObjectURL(file);
                window.open(url, '_blank');
            } catch (err) {
                console.error(err);
                showModal("File Not Found", `<p class='text-red-400'>Could not open the file. It may have been moved or deleted from your OneDrive folder. Error: ${err.message}</p>`);
            }
        };

        // --------------------------------------------------------------
        // 2. AUTHENTICATION LOGIC
        // --------------------------------------------------------------
        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const userDisplay = document.getElementById('user-display');
        const logoutBtn = document.getElementById('logout-btn');

        // Monitor Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Logged in as:", user.email);
                userDisplay.textContent = user.email;
                loginScreen.style.display = 'none';
                appContainer.style.display = 'flex';
                listenToFirebase();
            } else {
                console.log("User signed out");
                loginScreen.style.display = 'flex';
                appContainer.style.display = 'none';
            }
        });

        // Handle Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            loginError.classList.add('hidden');

            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    loginError.textContent = "Invalid Email or Password.";
                    loginError.classList.remove('hidden');
                });
        });

        // Handle Logout
        logoutBtn.addEventListener('click', () => {
            // Replaced confirm() with an internal message/check for consistency
            showModal("Confirm Sign Out", "<p class='text-gray-300'>Are you sure you want to sign out?</p><div class='flex justify-end gap-4 mt-6'><button id='confirm-logout' class='px-6 py-2 rounded-lg bg-red-600 text-white hover:bg-red-500 transition-colors font-semibold'>Sign Out</button><button id='cancel-logout' class='px-6 py-2 rounded-lg bg-gray-600 text-white hover:bg-gray-500 transition-colors font-semibold'>Cancel</button></div>", () => {
                document.getElementById('confirm-logout').addEventListener('click', () => {
                    signOut(auth).then(() => {
                        window.location.reload();
                    }).catch((error) => {
                        console.error("Error signing out:", error);
                        // Using internal modal instead of alert
                        showModal("Error Signing Out", "<p class='text-red-400'>There was an error signing out. Please try again.</p>");
                    });
                    hideModal();
                });
                document.getElementById('cancel-logout').addEventListener('click', hideModal);
            });
        });


        // --------------------------------------------------------------
        // 3. APP STATE & LOGIC
        // --------------------------------------------------------------
        let cdCerts = [];
        let amanCerts = [];
        let historyData = {}; // For CD/Aman certificate old expiry/link history
        let projectsList = new Set(['Main Project']);
        let currentProject = 'Main Project';

        // ** STEP 1: DEFINE THE AUTHORIZED ADMIN UID **
        // NOTE: Replace 'YOUR_ADMIN_FIREBASE_UID_HERE' with the actual UID of the user who should have edit access.
        // If left as a placeholder, no one will have edit access.
        const ADMIN_UID = '2xs0IlmRDDYwbekOuXsv2ThWBCl1';

        // Helper function to check if the current user is authorized
        const isAuthorizedEditor = () => {
            // CHANGED: Allow any logged-in user to edit (removed hardcoded UID check)
            return !!auth.currentUser;
        };

        let currentPage = 'Civil Defence';
        let currentFilters = {
            'Civil Defence': { validity: 'All', phase: 'All', workflow: 'All', search: '' },
            'Aman Certificate': { validity: 'All', phase: 'All', workflow: 'All', search: '' }
        };

        const CD_WORKFLOW_STEPS = ['AMC ready', 'Renewal Pending', 'Informed Fire team', 'Awaiting inspection', 'Inspection Date', 'Certificate ready'];
        const AMAN_WORKFLOW_STEPS = ['Application Done', 'Installation in Progress', 'Installation Done', 'Pending Renewal', 'Certificate ready'];

        // --------------------------------------------------------------
        // 4. DATABASE FUNCTIONS
        // --------------------------------------------------------------

        const saveDataToFirebase = () => {
            if (!auth.currentUser) return; // Don't save if not logged in
            set(ref(db, 'appData'), {
                cdCerts: cdCerts,
                amanCerts: amanCerts,
                historyData: historyData
            }).catch((error) => {
                // Replaced alert
                showModal("Error Saving Data", `<p class='text-red-400'>Error saving to cloud: ${error.message}</p>`);
            });
        };

        const listenToFirebase = () => {
            if (!auth.currentUser) return;
            const dataRef = ref(db, 'appData');
            onValue(dataRef, (snapshot) => {
                const data = snapshot.val();

                if (data) {
                    cdCerts = data.cdCerts || [];
                    // Ensure renewalHistory is initialized for Aman Cets
                    amanCerts = (data.amanCerts || []).map(c => ({
                        ...c,
                        renewalHistory: c.renewalHistory || [] // Initialize or keep array
                    }));
                    historyData = data.historyData || {};

                    // Update Projects List
                    projectsList = new Set(['Main Project']);
                    [...cdCerts, ...amanCerts].forEach(item => {
                        if (item.project) projectsList.add(item.project);
                    });
                    updateProjectDropdown();
                } else {
                    cdCerts = [];
                    amanCerts = [];
                    historyData = {};
                    updateProjectDropdown();
                }
                // Only re-render the main page if no modal is currently open.
                // When a modal (workflow manager, hub, etc.) is visible, we update
                // the in-memory data silently to avoid a disruptive page flash.
                const isModalOpen = !document.getElementById('modal-container').classList.contains('hidden');
                if (!isModalOpen) {
                    render();
                    updateNotifications();
                }
            }, (error) => {
                console.error("Error loading data:", error);
                if (error.code === 'PERMISSION_DENIED') {
                    showModal("Access Denied", "<p class='text-red-400'>Access Denied. Please ensure you are logged in correctly.</p>");
                }
            });
        };

        // --------------------------------------------------------------
        // 5. PROJECT LOGIC
        // --------------------------------------------------------------
        const projectSelect = document.getElementById('project-select');

        function updateProjectDropdown() {
            projectSelect.innerHTML = '';
            // Add existing projects
            projectsList.forEach(p => {
                const option = document.createElement('option');
                option.value = p;
                option.textContent = p;
                if (p === currentProject) option.selected = true;
                projectSelect.appendChild(option);
            });
            // Add Create New Option
            const createOption = document.createElement('option');
            createOption.value = '__CREATE_NEW__';
            createOption.textContent = '+ Create New Project';
            createOption.style.fontWeight = 'bold';
            createOption.style.color = '#2dd4bf'; // Teal
            projectSelect.appendChild(createOption);
        }

        projectSelect.addEventListener('change', (e) => {
            if (e.target.value === '__CREATE_NEW__') {
                const modalContent = `
                    <div class="space-y-4">
                        <label for="newProjectName" class="block text-sm font-medium text-gray-300">Enter the name for the new project (e.g. 'Open Yards Phase 2'):</label>
                        <input type="text" id="newProjectName" class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-white" placeholder="Project Name" required>
                        <div class="flex justify-end gap-4">
                            <button id="cancel-new-project" class="px-6 py-2 rounded-lg bg-gray-600 text-white hover:bg-gray-500 transition-colors font-semibold">Cancel</button>
                            <button id="save-new-project" class="px-6 py-2 rounded-lg bg-teal-600 text-white hover:bg-teal-500 transition-colors font-semibold">Create Project</button>
                        </div>
                    </div>`;

                showModal('Create New Project', modalContent, () => {
                    const newNameInput = document.getElementById('newProjectName');
                    newNameInput.focus();

                    document.getElementById('save-new-project').addEventListener('click', () => {
                        const newName = newNameInput.value.trim();
                        if (newName) {
                            projectsList.add(newName);
                            currentProject = newName;
                            updateProjectDropdown();
                            render();
                            hideModal();
                        } else {
                            showModal('Error', "<p class='text-red-400'>Project name cannot be empty.</p>");
                        }
                    });
                    document.getElementById('cancel-new-project').addEventListener('click', hideModal);
                });
            } else {
                currentProject = e.target.value;
                render();
            }
        });

        // --------------------------------------------------------------
        // 5.1 CUSTOM REPORTING LOGIC
        // --------------------------------------------------------------

        function handleShowTools() {
            const modalContent = `
                <div class="space-y-6">
                    <p class="text-sm text-gray-400">Select categories to include in the generated PDF report.</p>
                    
                    <!-- Civil Defence Filters -->
                    <div class="bg-gray-700/30 p-4 rounded-lg border border-gray-600">
                        <h4 class="text-blue-400 font-bold mb-3">Civil Defence</h4>
                        <div class="grid grid-cols-2 gap-3">
                             <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="cd-valid" class="form-checkbox text-blue-500 rounded bg-gray-800 border-gray-600">
                                <span class="text-sm text-gray-300">Valid Certificates</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="cd-expired" class="form-checkbox text-red-500 rounded bg-gray-800 border-gray-600">
                                <span class="text-sm text-gray-300">Expired</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="cd-near" class="form-checkbox text-yellow-500 rounded bg-gray-800 border-gray-600">
                                <span class="text-sm text-gray-300">Near Expiry</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="cd-amc" class="form-checkbox text-green-500 rounded bg-gray-800 border-gray-600">
                                <span class="text-sm text-gray-300">AMC Ready</span>
                            </label>
                        </div>
                    </div>

                    <!-- Aman Filters -->
                    <div class="bg-gray-700/30 p-4 rounded-lg border border-gray-600">
                        <h4 class="text-teal-400 font-bold mb-3">Aman System</h4>
                        <div class="grid grid-cols-2 gap-3">
                             <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="aman-valid" class="form-checkbox text-teal-500 rounded bg-gray-800 border-gray-600">
                                <span class="text-sm text-gray-300">Valid Certificates</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="aman-expired" class="form-checkbox text-red-500 rounded bg-gray-800 border-gray-600">
                                <span class="text-sm text-gray-300">Expired</span>
                            </label>

        function generateCustomPDF() {
            // 1. Gather Filter Settings
            const options = {
                cd: {
                    valid: document.getElementById('cd-valid').checked,
                    expired: document.getElementById('cd-expired').checked,
                    near: document.getElementById('cd-near').checked,
                    amc: document.getElementById('cd-amc').checked
                },
                aman: {
                    valid: document.getElementById('aman-valid').checked,
                    expired: document.getElementById('aman-expired').checked,
                    near: document.getElementById('aman-near').checked,
                    installation: document.getElementById('aman-installation').checked
                },
                currentProjectOnly: document.getElementById('current-project-only').checked
            };

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const reportDate = new Date().toLocaleDateString('en-GB');

            // Title
            doc.setFontSize(18);
            doc.text(`Status Report - ${options.currentProjectOnly ? currentProject : 'All Projects'}`, 14, 22);
            doc.setFontSize(11);
            doc.text(`Generated on: ${reportDate}`, 14, 30);

            let finalY = 35;
            let hasData = false;

            // Helper to add a table section
            const addSection = (title, data, isAman) => {
                if (data.length === 0) return;
                hasData = true;

                // Check page break
                if (finalY > 250) {
                    doc.addPage();
                    finalY = 20;
                }

                doc.setFontSize(14);
                // Set Color based on type/status hint in title
                if (title.includes("Expired")) doc.setTextColor(220, 53, 69); // Red
                else if (title.includes("Near")) doc.setTextColor(255, 193, 7); // Orange/Yellow
                else if (title.includes("Valid")) doc.setTextColor(40, 167, 69); // Green
                else if (title.includes("Installation")) doc.setTextColor(59, 130, 246); // Blue
                else doc.setTextColor(0, 0, 0); // Black

                doc.text(title, 14, finalY + 10);
                doc.setTextColor(0, 0, 0); // Reset

                const body = data.map(c => [
                    c.propertyNumber,
                    c.propertyType || '',
                    formatDate(c.expiryDate),
                    getValidityStatus(c.expiryDate).text,
                    c.workflowStatus || 'N/A'
                ]);

                doc.autoTable({
                    startY: finalY + 15,
                    head: [['Property', 'Type', 'Expiry', 'Status', 'Workflow']],
                    body: body,
                    theme: 'striped',
                    headStyles: { fillColor: isAman ? [22, 160, 133] : [41, 128, 185] },
                    styles: { fontSize: 10 },
                    margin: { top: 20 }
                });

                finalY = doc.lastAutoTable.finalY + 10;
            };

            // Filter Logic
            const filterCerts = (list, criteria) => {
                return list.filter(c => {
                    const projectMatch = !options.currentProjectOnly || (c.project || 'Main Project') === currentProject;
                    if (!projectMatch) return false;

                    const status = getValidityStatus(c.expiryDate).text;
                    if (criteria.expired && status === 'Expired') return true;
                    if (criteria.near && status === 'Near Expiry') return true;
                    if (criteria.valid && (status === 'Valid' || status === 'New')) return true;
                    if (criteria.amc && c.workflowStatus === 'AMC ready') return true;
                    if (criteria.installation && c.workflowStatus === 'Installation in Progress') return true;

                    return false;
                });
            };

            // --- Civil Defence Sections ---
            if (options.cd.expired) addSection("Civil Defence - Expired Certificates",
                filterCerts(cdCerts, { expired: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Expired'), false);

            if (options.cd.near) addSection("Civil Defence - Near Expiry (Action Required)",
                filterCerts(cdCerts, { near: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Near Expiry'), false);

            if (options.cd.amc) addSection("Civil Defence - AMC Ready Workflows",
                filterCerts(cdCerts, { amc: true }).filter(c => c.workflowStatus === 'AMC ready'), false);

            if (options.cd.valid) addSection("Civil Defence - Valid Certificates",
                filterCerts(cdCerts, { valid: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Valid'), false);


            // --- Aman Sections ---
            if (options.aman.expired) addSection("Aman - Expired Certificates",
                filterCerts(amanCerts, { expired: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Expired'), true);

            if (options.aman.near) addSection("Aman - Near Expiry",
                filterCerts(amanCerts, { near: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Near Expiry'), true);

            if (options.aman.installation) addSection("Aman - Installation in Progress",
                filterCerts(amanCerts, { installation: true }).filter(c => c.workflowStatus === 'Installation in Progress'), true);

            if (options.aman.valid) addSection("Aman - Valid Certificates",
                filterCerts(amanCerts, { valid: true }).filter(c => getValidityStatus(c.expiryDate).text === 'Valid'), true);


            if (!hasData) {
                doc.setFontSize(12);
                doc.setTextColor(100);
                doc.text("No records found matching the selected criteria.", 14, 50);
            }

            doc.save(`Custom_Report_${currentProject}_${new Date().toISOString().split('T')[0]}.pdf`);
        }

        // --------------------------------------------------------------
        // 6. APP STATE & LOGIC
        // --------------------------------------------------------------

        const getValidityStatus = (expiryDate) => {
            if (!expiryDate) return { text: 'N/A', color: 'gray' };
            const now = new Date();
            const expiry = new Date(expiryDate);
            const thirtyDaysFromNow = new Date();
            thirtyDaysFromNow.setDate(now.getDate() + 30);

            if (expiry < now) return { text: 'Expired', color: 'red' };
            if (expiry <= thirtyDaysFromNow) return { text: 'Near Expiry', color: 'yellow' };
            return { text: 'Valid', color: 'green' };
        };

        const formatDate = (dateString) => {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            if (isNaN(date)) return 'Invalid Date';
            return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        };

        const processData = (data) => {
            let valid = 0, nearExpiry = 0, expired = 0;
            data.forEach(item => {
                const status = getValidityStatus(item.expiryDate).text;
                if (status === 'Valid') valid++;
                else if (status === 'Near Expiry') nearExpiry++;
                else if (status === 'Expired') expired++;
            });
            return { valid, nearExpiry, expired };
        };

        // ADDED: Notification Logic
        function generateExpiryNotifications() {
            const notifications = [];
            const now = new Date();
            const thirtyDaysFromNow = new Date();
            thirtyDaysFromNow.setDate(now.getDate() + 30);

            // Helper to check for notifications
            const checkCerts = (certs, type) => {
                certs.filter(c => (c.project || 'Main Project') === currentProject).forEach(cert => {
                    if (!cert.expiryDate) return;
                    const expiry = new Date(cert.expiryDate);

                    if (expiry < now) {
                        notifications.push({
                            id: cert.id,
                            type: type,
                            message: `${type === 'Civil Defence' ? 'CD' : 'Aman'} Cert #${cert.propertyNumber} **Expired** on ${formatDate(cert.expiryDate)}!`,
                            urgency: 'red'
                        });
                    } else if (expiry <= thirtyDaysFromNow) {
                        notifications.push({
                            id: cert.id,
                            type: type,
                            message: `${type === 'Civil Defence' ? 'CD' : 'Aman'} Cert #${cert.propertyNumber} **Near Expiry** on ${formatDate(cert.expiryDate)}.`,
                            urgency: 'yellow'
                        });
                    }
                });
            };

            checkCerts(cdCerts, 'Civil Defence');
            checkCerts(amanCerts, 'Aman Certificate');

            return notifications;
        }

            // Notification bell has been removed from the UI.
            // This is intentionally a no-op kept for call-site compatibility.
        }

        function handleNotificationClick(id, type) {

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-yellow-600/90 border border-yellow-500 text-white px-6 py-4 rounded-lg shadow-2xl z-50 animate-fade-in-up flex items-start gap-3 max-w-sm';
            toast.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0 mt-0.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <div class="text-sm font-medium leading-snug">${message}</div>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                setTimeout(() => toast.remove(), 500);
            }, 6000);
        }

        function checkAndApplyAutomaticStatusUpdates() {
            let changedCount = 0;
            const today = new Date().setHours(0, 0, 0, 0);

            cdCerts.forEach(cert => {
                // Only check if it belongs to the current project to avoid mass updates on invisible items
                if ((cert.project || 'Main Project') === currentProject && cert.expiryDate) {
                    const expiry = new Date(cert.expiryDate).setHours(0, 0, 0, 0);
                    if (expiry < today) {
                        if (!CD_WORKFLOW_STEPS.includes(cert.workflowStatus) || cert.workflowStatus === 'Certificate ready') {
                            cert.workflowStatus = 'Renewal Pending';
                            changedCount++;
                        }
                    }
                }
            });

            // Added: Aman Check - Aman only enters 'Pending Renewal' if expired
            amanCerts.forEach(cert => {
                if ((cert.project || 'Main Project') === currentProject && cert.expiryDate) {
                    const expiry = new Date(cert.expiryDate).setHours(0, 0, 0, 0);
                    if (expiry < today) {
                        if (cert.workflowStatus !== 'Pending Renewal' && cert.workflowStatus !== 'Installation in Progress') {
                            cert.workflowStatus = 'Pending Renewal';
                            changedCount++;
                        }
                    }
                }
            });

            if (changedCount > 0) {
                saveDataToFirebase();
                if (window.hasRenderedOnce) {
                    showToast(`System Auto-Correct: ${changedCount} expired certificate(s) were automatically moved back to Pending Renewal. You cannot mark an expired certificate as 'Ready'.`);
                }
            }
        }

        function render() {
            checkAndApplyAutomaticStatusUpdates();
            window.hasRenderedOnce = true;

            // FILTER DATA BY PROJECT BEFORE RENDERING
            const filteredCdCerts = cdCerts.filter(c => (c.project || 'Main Project') === currentProject);
            const filteredAmanCerts = amanCerts.filter(c => (c.project || 'Main Project') === currentProject);

            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const activePage = document.getElementById(`page-${currentPage}`);
            if (activePage) activePage.classList.add('active');

            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.dataset.page === currentPage) {
                    link.classList.add('bg-teal-600/90', 'text-white', 'shadow-lg');
                    link.classList.remove('text-gray-300', 'hover:bg-gray-700/50');
                } else {
                    link.classList.remove('bg-teal-600/90', 'text-white', 'shadow-lg');
                    link.classList.add('text-gray-300', 'hover:bg-gray-700/50');
                }
            });

            switch (currentPage) {
                case 'Civil Defence': renderCertificatePage('Civil Defence', filteredCdCerts); break;
                case 'Aman Certificate': renderCertificatePage('Aman Certificate', filteredAmanCerts); break;
            }
            updateNotifications(); // Re-render notifications whenever main view changes
        }

            const detailDashboardHTML = generateDetailedDashboard(type, data);

            const searchPlaceholder = isCivilDefence ? "Search by Property No..." : "Search by Property, Account, Record, Device, or Serial No...";

            // BULK REMINDER BANNER
            let bannerHTML = '';
            if (isCivilDefence && isEditor && !window.sessionStorage.getItem('hideBulkBanner')) {
                const expiredCDCerts = data.filter(c => getValidityStatus(c.expiryDate).text === 'Expired' && c.workflowStatus === 'Renewal Pending');
                if (expiredCDCerts.length > 0) {
                    bannerHTML = `
                    <div id="bulk-expiry-banner" class="bg-red-900/40 border border-red-500 rounded-lg p-4 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
                        <div>
                            <h4 class="text-lg font-bold text-red-400">Action Required: ${expiredCDCerts.length} Expired Certificate(s)</h4>
                            <p class="text-sm text-gray-300">Please inform the Fire AMC team to initiate renewal.</p>
                        </div>
                        <div class="flex gap-2 flex-wrap">
                            <button id="bulk-email-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded transition-colors flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>Email Fire Team</button>
                            <button id="bulk-informed-btn" class="px-4 py-2 bg-green-600 hover:bg-green-500 text-white text-sm font-semibold rounded transition-colors">Mark as Informed</button>
                            <button id="bulk-remind-later-btn" class="px-4 py-2 bg-gray-600 hover:bg-gray-500 text-white text-sm font-semibold rounded transition-colors">Remind Later</button>
                        </div>
                    </div>
                    `;
                }
            }

            pageEl.innerHTML = `
                ${bannerHTML}
                <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
                    <h1 class="text-4xl font-bold text-white">${type} Certificates</h1>
                    <!-- Toolbar: all groups in one row, no wrapping overflow -->
                    <div class="flex items-center gap-2">
                        <!-- Group 1: View / Navigate -->
                        <div class="flex items-center gap-1 bg-gray-800 border border-gray-700 rounded-xl p-1">
                            <button id="workflow-hub-btn"
                                class="flex items-center gap-2 px-3 py-2 text-sm font-semibold text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-colors"
                                title="Open Active Workflows Hub">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                                Active Workflows
                            </button>
                            <button id="tools-btn"
                                class="flex items-center gap-2 px-3 py-2 text-sm font-semibold text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-colors"
                                title="Generate Custom PDF Report">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                                Custom Report
                            </button>
                        </div>

                        <!-- Group 2: Downloads -->
                        <div class="flex items-center gap-1 bg-gray-800 border border-gray-700 rounded-xl p-1">
                            <button id="download-btn-${typeId}"
                                class="flex items-center gap-2 px-3 py-2 text-sm font-semibold text-gray-300 hover:text-white hover:bg-gray-700 rounded-lg transition-colors"
                                title="Download Certificate Status Report">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
                                Download PDF
                            </button>
                            ${isAman ? `
                            <button id="financial-report-btn-${typeId}"
                                class="flex items-center gap-2 px-3 py-2 text-sm font-semibold text-yellow-300 hover:text-yellow-100 hover:bg-yellow-700/40 rounded-lg transition-colors"
                                title="Financial Report">
                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                Financial
                            </button>` : ''}
                        </div>

                        <!-- Group 3: Primary Action -->
                        ${isEditor ? `
                        <button id="add-btn-${typeId}"
                            class="flex items-center gap-2 px-4 py-2.5 text-sm font-bold text-white bg-teal-600 hover:bg-teal-500 rounded-xl transition-colors shadow-lg shadow-teal-900/40"
                            title="Add New Certificate">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
                            Add New
                        </button>` : ''}
                    </div>
                </div>
                ${detailDashboardHTML}
                <div class="mb-6">
                    <div class="filter-controls flex space-x-1 bg-gray-800 p-1 rounded-lg" data-type="${typeId}">
                        ${["All", "Valid", "Near Expiry", "Expired"].map(f => `<button data-filter-type="validity" data-filter-value="${f}" class="filter-btn w-full py-2.5 text-sm font-medium leading-5 rounded-lg transition-colors ${currentFilters[type].validity === f ? 'bg-teal-600 text-white shadow' : 'text-gray-300 hover:bg-gray-700'}">${f}</button>`).join('')}
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div class="relative md:col-span-1">
                        <input type="search" id="search-input-${typeId}" placeholder="${searchPlaceholder}" value="${currentFilters[type].search}" class="w-full bg-gray-800 border border-gray-700 rounded-lg pl-10 pr-4 py-2 text-white focus:ring-2 focus:ring-teal-500">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                    <div>
                        <select id="phase-filter-${typeId}" data-filter-type="phase" class="filter-select w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-teal-500">
                            <option value="All">All Phases</option>
                            <option value="Phase 1">Phase 1</option>
                            <option value="Phase 2">Phase 2</option>
                            <option value="OPY">OPY</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    ${isCivilDefence || isAman ? `
                    <div>
                        <select id="workflow-filter-${typeId}" data-filter-type="workflow" class="filter-select w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:ring-2 focus:ring-teal-500">
                            <option value="All">All Workflow</option>
                            ${(isCivilDefence ? CD_WORKFLOW_STEPS : AMAN_WORKFLOW_STEPS).map(step => `<option value="${step}">${step}</option>`).join('')}
                        </select>
                    </div>
                    ` : '<div></div>'}
                </div>

                ${sectionsHTML}
                `;

            renderAllTables(type, data);

            const phaseFilter = pageEl.querySelector(`#phase-filter-${typeId}`);
            if (phaseFilter) phaseFilter.value = currentFilters[type].phase;

            if (isCivilDefence || isAman) {
                const workflowFilter = pageEl.querySelector(`#workflow-filter-${typeId}`);
                if (workflowFilter) workflowFilter.value = currentFilters[type].workflow;
            }

            // --- Event Listeners for this page ---
            if (isEditor) {
                const addBtn = pageEl.querySelector(`#add-btn-${typeId}`);
                if (addBtn) addBtn.addEventListener('click', () => handleShowForm(type));
                // Note: import/export buttons have been moved to Settings modal
            }

            const downloadBtn = pageEl.querySelector(`#download-btn-${typeId}`);
            if (downloadBtn) downloadBtn.addEventListener('click', () => handleDownloadReport(type));

            if (isCivilDefence && isEditor) {
                const bulkEmailBtn = pageEl.querySelector('#bulk-email-btn');
                const bulkInformedBtn = pageEl.querySelector('#bulk-informed-btn');
                const remindLaterBtn = pageEl.querySelector('#bulk-remind-later-btn');

                if (bulkEmailBtn) bulkEmailBtn.addEventListener('click', handleBulkEmailCD);
                if (bulkInformedBtn) bulkInformedBtn.addEventListener('click', handleBulkInformedCD);
                if (remindLaterBtn) remindLaterBtn.addEventListener('click', () => {
                    window.sessionStorage.setItem('hideBulkBanner', 'true');
                    render();
                });
            }

            if (isAman) {
                const financialBtn = pageEl.querySelector(`#financial-report-btn-${typeId}`);
                if (financialBtn) financialBtn.addEventListener('click', handleShowFinancialReportOptions);
            }


            pageEl.querySelector(`#search-input-${typeId}`).addEventListener('input', (e) => {
                currentFilters[type].search = e.target.value;
                renderAllTables(type, data);
            });

            pageEl.querySelectorAll(`.filter-select`).forEach(select => {
                select.addEventListener('change', (e) => {
                    const filterType = e.target.dataset.filterType;
                    currentFilters[type][filterType] = e.target.value;
                    renderAllTables(type, data);
                });
            });

            const filterControls = pageEl.querySelector(`.filter-controls[data-type="${typeId}"]`);
            if (filterControls) {
                filterControls.addEventListener('click', (e) => {
                    if (e.target.matches('.filter-btn')) {
                        const filterType = e.target.dataset.filterType;
                        const filterValue = e.target.dataset.filterValue;
                        currentFilters[type][filterType] = filterValue;

                        filterControls.querySelectorAll(`.filter-btn`).forEach(btn => {
                            btn.classList.toggle('bg-teal-600', btn.dataset.filterValue === filterValue);
                            btn.classList.toggle('text-white', btn.dataset.filterValue === filterValue);
                            btn.classList.toggle('shadow', btn.dataset.filterValue === filterValue);
                            btn.classList.toggle('text-gray-300', btn.dataset.filterValue !== filterValue);
                            btn.classList.toggle('hover:bg-gray-700', btn.dataset.filterValue !== filterValue);
                        });
                        renderAllTables(type, data);
                    }
                });
            }
        }

        function renderAllTables(type, data) {
            const filters = currentFilters[type];
            const typeId = type.replace(/\s+/g, '-');
            // Consistent map used for routing and rendering sections
            const PROPERTY_SECTIONS = { 'Warehouse': 'warehouse', 'OPY': 'opy', 'Admin': 'admin', 'Others': 'others' };

            // Helper function to safely get lowercase value of a field, defaulting to empty string if the property is null/undefined
            const getLower = (item, field) => String(item[field] || '').toLowerCase();

            let filteredData = data.filter(item => {
                const validityMatch = filters.validity === 'All' || getValidityStatus(item.expiryDate).text === filters.validity;

                let searchMatch = !filters.search;
                if (filters.search) {
                    const searchTerm = filters.search.toLowerCase();

                    if (type === 'Aman Certificate') {
                        searchMatch = (getLower(item, 'propertyNumber').includes(searchTerm)) ||
                            (getLower(item, 'accountId').includes(searchTerm)) ||
                            (getLower(item, 'recordId').includes(searchTerm)) ||
                            (getLower(item, 'deviceId').includes(searchTerm)) ||
                            (getLower(item, 'serialNumber').includes(searchTerm));
                    } else { // Civil Defence
                        searchMatch = (getLower(item, 'propertyNumber').includes(searchTerm));
                    }
                }

                const phaseMatch = filters.phase === 'All' || item.phase === filters.phase;
                const workflowMatch = filters.workflow === 'All' || item.workflowStatus === filters.workflow;
                return validityMatch && searchMatch && phaseMatch && workflowMatch;
            });

            filteredData.sort((a, b) => {
                return String(a.propertyNumber).localeCompare(String(b.propertyNumber), undefined, { numeric: true, sensitivity: 'base' });
            });


            const groupedData = filteredData.reduce((acc, item) => {
                // Robust Routing Logic
                let itemType = item.propertyType ? item.propertyType.toLowerCase().replace(/\s/g, '') : 'others';

                // Handle various forms of old property names to map to standardized keys
                if (itemType.includes('openyard')) itemType = 'opy';
                if (itemType.includes('adminbuilding')) itemType = 'admin';
                if (itemType === 'warehouse' || itemType === 'warehouses') itemType = 'warehouse';
                if (itemType === 'admin') itemType = 'admin';
                if (itemType === 'opy') itemType = 'opy';


                let section = 'Others'; // Default
                for (const key in PROPERTY_SECTIONS) {
                    if (PROPERTY_SECTIONS[key] === itemType) {
                        section = key;
                        break;
                    }
                }

                if (!acc[section]) {
                    acc[section] = [];
                }
                acc[section].push(item);
                return acc;
            }, { 'Warehouse': [], 'OPY': [], 'Admin': [], 'Others': [] });

            Object.keys(PROPERTY_SECTIONS).forEach(sectionTitle => {
                const sectionData = groupedData[sectionTitle] || [];
                renderTableSection(type, sectionTitle, sectionData);
            });
        }

        function renderTableSection(type, sectionTitle, data) {
            const typeId = type.replace(/\s+/g, '-');
            const tableBody = document.getElementById(`table-body-${sectionTitle.replace(/\s+/g, '-')}-${typeId}`);
            if (!tableBody) return;

            const isCivilDefence = type === 'Civil Defence';
            const isAman = type === 'Aman Certificate';
            const today = new Date().setHours(0, 0, 0, 0);

            // Authorization Check
            const isEditor = isAuthorizedEditor();

            // Phase column is ONLY rendered for Warehouse
            const renderPhaseColumn = sectionTitle === 'Warehouse';

            // Calculate colspan dynamically
            let totalColumns = 5; // Property No, Expiry, Validity, Workflow/Notes, Actions
            if (renderPhaseColumn) totalColumns += 1; // + Phase Column
            if (isCivilDefence) totalColumns += 1; // + Issue Date
            if (isAman) totalColumns += 2; // + Device ID, Serial No.

            if (data.length === 0) {
                // Changed table text color to reflect dark theme
                tableBody.innerHTML = `<tr><td colspan="${totalColumns}" class="text-center py-10 text-gray-400 bg-gray-800/50">No certificates in this section matching criteria.</td></tr>`;
                return;
            }

            tableBody.innerHTML = data.map(item => {
                const validityStatus = getValidityStatus(item.expiryDate);
                const isRenewable = validityStatus.text === 'Expired' || validityStatus.text === 'Near Expiry';

                let updateStatusButton = '';
                if (isCivilDefence && item.workflowStatus === 'Inspection Date' && item.inspectionDate && new Date(item.inspectionDate).setHours(0, 0, 0, 0) <= today) {
                    updateStatusButton = `<button class="action-btn text-yellow-500 hover:text-yellow-700 animate-pulse" data-action="update-inspection" data-id="${item.id}" title="Update Inspection Status"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></button>`;
                }

                let workflowCell = `<td class="px-3 py-2.5 bg-gray-800/50"></td>`;
                if (isCivilDefence || isAman) {
                    const typeData = isCivilDefence ? 'Civil Defence' : 'Aman Certificate';
                    workflowCell = `
                    <td class="px-3 py-2.5 text-sm bg-gray-800/50">
                        ${generateWorkflowBadge(item.workflowStatus, item.inspectionDate, typeData)}
                    </td>`;
                }

                // View Details icon
                const viewDetailsIcon = `<button class="action-btn text-blue-500 hover:text-blue-700" data-action="view-details" data-id="${item.id}" data-type="${type}" title="View Details"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>`;

                let emailButton = '';
                if (isCivilDefence && isRenewable && item.workflowStatus === 'Renewal Pending') {
                    emailButton = `<button class="action-btn text-blue-400 hover:text-blue-300" data-action="email-fire-team" data-id="${item.id}" data-type="${type}" title="Email Fire AMC Team"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></button>`;
                }

                return `
                <tr class="bg-gray-800/50 border-b border-gray-700 hover:bg-gray-700/70 transition-colors">
                    <td class="px-3 py-2.5 text-sm font-medium text-white truncate max-w-0">${item.propertyNumber || ''}</td>
                    ${renderPhaseColumn ? `<td class="px-3 py-2.5 text-sm text-gray-300 truncate max-w-0">${item.phase || ''}</td>` : ''}
                    ${isCivilDefence ? `<td class="px-3 py-2.5 text-sm text-gray-300 whitespace-nowrap">${formatDate(item.issueDate)}</td>` : ''}
                    <td class="px-3 py-2.5 text-sm text-gray-300 whitespace-nowrap">${formatDate(item.expiryDate)}</td>
                    ${isCivilDefence ? `<td class="px-3 py-2.5 text-sm text-gray-300 whitespace-nowrap">${(item.amcOnly === 'on' || item.amcOnly === true) ? (formatDate(item.amcExpiryDate) || '<span class="text-gray-500 italic">Not set</span>') : '—'}</td>` : ''}
                    <td class="px-3 py-2.5 text-sm text-gray-300">${generateStatusBadge(validityStatus)}</td>
                    ${isAman ? `<td class="px-3 py-2.5 text-sm text-gray-300 truncate max-w-0">${item.deviceId || '—'}</td>` : ''}
                    ${isAman ? `<td class="px-3 py-2.5 text-sm text-gray-300 truncate max-w-0">${item.serialNumber || '—'}</td>` : ''}
                    ${workflowCell}
                    <td class="px-3 py-2.5 text-sm font-medium">
                        <div class="flex items-center justify-end gap-1">
                            ${isEditor ? updateStatusButton : ''}
                            ${isEditor ? emailButton : ''}
                            ${viewDetailsIcon}
                            <button class="action-btn text-purple-400 hover:text-purple-300" data-action="history" data-id="${item.id}" title="View History"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
                            ${isEditor ? `<button class="action-btn text-teal-400 hover:text-teal-300" data-action="edit" data-id="${item.id}" data-type="${type}" title="Edit"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path><path d="m15 5 4 4"></path></svg></button>` : ''}
                            ${isEditor ? `<button class="action-btn text-red-500 hover:text-red-400" data-action="delete" data-id="${item.id}" data-type="${type}" title="Delete"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg></button>` : ''}
                        </div>
                    </td>
                </tr>
                `}).join('');
        }

        function generateStatusBadge(status) {
            // Note: Keeping badges dark-themed as they look best this way against light backgrounds too.
            const colors = { green: "bg-green-500/20 text-green-400 border border-green-500/30", yellow: "bg-yellow-500/20 text-yellow-400 border border-yellow-500/30", red: "bg-red-500/20 text-red-400 border border-red-500/30", gray: "bg-gray-500/20 text-gray-400 border border-gray-500/30" };
            return `<span class="px-3 py-1 text-xs font-semibold rounded-full whitespace-nowrap ${colors[status.color]}">${status.text}</span>`;
        }

        function generateWorkflowBadge(status, inspectionDate, type) {
            const cdColors = {
                'Renewal Pending': "bg-red-500/20 text-red-400 border-red-500/30",
                'Informed Fire team': "bg-orange-500/20 text-orange-400 border-orange-500/30",
                'Awaiting inspection': "bg-yellow-500/20 text-yellow-400 border-yellow-500/30",
                'Inspection Date': "bg-blue-500/20 text-blue-400 border-blue-500/30",
                'Certificate ready': "bg-cyan-500/20 text-cyan-400 border-cyan-500/30",
                'AMC ready': "bg-purple-500/20 text-purple-400 border-purple-500/30",
            };

            const amanColors = {
                'Installation in Progress': "bg-yellow-500/20 text-yellow-400 border-yellow-500/30",
                'Pending Renewal': "bg-red-500/20 text-red-400 border-red-500/30",
                'Certificate ready': "bg-cyan-500/20 text-cyan-400 border-cyan-500/30",
            };

            const colors = type === 'Civil Defence' ? cdColors : amanColors;

            let text = status || 'N/A';
            if (status === 'Inspection Date' && inspectionDate) {
                text = `Inspection: ${formatDate(inspectionDate)}`;
            }

            return `<span class="px-3 py-1 text-xs font-semibold rounded-full whitespace-nowrap ${colors[status] || 'bg-gray-500/20 text-gray-400 border-gray-500/30'}">${text}</span>`;
        }

        // --- Modals and Forms ---
        function showModal(title, content, onOpen = null, sizeClass = 'max-w-lg') {
            // Signal to hideModal (if it runs just before this) not to do a full render
            window._suppressHideRender = true;
            const modalContainer = document.getElementById('modal-container');
            modalContainer.innerHTML = `
                <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl w-full ${sizeClass} m-4 max-h-[90vh] flex flex-col">
                    <div class="flex items-center justify-between p-5 border-b border-gray-700 flex-shrink-0">
                        <h3 class="text-xl font-bold text-white">${title}</h3>
                        <button id="modal-close-btn" class="text-gray-400 hover:text-white transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                        </button>
                    </div>
                    <div class="p-6 overflow-y-auto">${content}</div>
                </div>`;
            modalContainer.classList.remove('hidden');
            document.getElementById('modal-close-btn').addEventListener('click', () => {
                if (window._wfFromHub) {
                    window._wfFromHub = false;
                    window._suppressHideRender = true; // Don't flash the page before hub opens
                    hideModal();
                    handleShowWorkflowHub(); // No setTimeout needed — direct call is seamless
                } else {
                    hideModal();
                }
            });
            if (onOpen) onOpen();
        }

        function hideModal() {
            const modalContainer = document.getElementById('modal-container');
            modalContainer.innerHTML = '';
            modalContainer.classList.add('hidden');
            // Only refresh the main page if we are NOT about to immediately open another modal
            if (!window._suppressHideRender) {
                render();
                updateNotifications();
            }
            window._suppressHideRender = false;
        }
        window.hideModal = hideModal;

                     onclick="window._suppressHideRender = true; hideModal(); handleShowWorkflowManager('${cert.id}', '${currentPage}', true);">

                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                                </div>
